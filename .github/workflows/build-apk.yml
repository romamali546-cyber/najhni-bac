name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and copy it into Android
        run: |
          python3 tools/build_web.py
          npx cap sync android

      - name: Build APK (signed with the fixed key when the secrets exist)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../najahni-bac.apk
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets: building with a temporary debug key, updates will not install over older builds."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../najahni-bac.apk
          fi

      - name: Write release notes
        run: |
          {
            echo "build=${BUILD_NUMBER}"
            echo
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/d'
            echo
            echo "حمّل ملف najahni-bac.apk وثبّته فوق النسخة القديمة، يبقى تقدّمك كما هو."
          } > release_body.md

      - name: Publish APK as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: نجّحني باك 1.0.${{ github.run_number }}
          body_path: release_body.md
          files: najahni-bac.apk
          make_latest: true
