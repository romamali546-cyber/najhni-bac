<link id="favicon" rel="icon" href="">
<style>
/* Layout: one-column phone app, RTL, sticky bottom nav; mascot card leads the home screen */
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--surface2:#ECF0EE;--border:#DFE5E2;
  --text:#0E1A18;--text2:#52605C;--text3:#87938F;
  --primary:#0A7458;--primary-press:#085E48;--primary-soft:#E0F0EA;--on-primary:#FFFFFF;
  --accent:#D98E3F;--accent-soft:#F8ECDD;--flame:#E8692A;
  --warning:#C97A22;--danger:#C93C3C;--info:#2F63C4;
  --ink:#0C2621;--ink2:#123630;--on-ink:#F1F5F3;--on-ink2:#9DB8B0;--ink-line:rgba(241,245,243,.12);
  --shadow:0 1px 1px rgba(14,26,24,.04),0 6px 20px -8px rgba(14,26,24,.12);
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:16px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090F0E;--surface:#111917;--surface2:#17221F;--border:#22302C;
  --text:#EAF1EE;--text2:#9AABA6;--text3:#62726D;
  --primary:#3BC495;--primary-press:#2DA97F;--primary-soft:#113529;--on-primary:#032018;
  --accent:#EFAA62;--accent-soft:#2F2317;--flame:#FF8A4C;--warning:#EBA556;--danger:#F06A6A;--info:#7EA4F0;
  --ink:#0F2B25;--ink2:#15382F;--on-ink:#EAF1EE;--on-ink2:#8FB0A6;--ink-line:rgba(234,241,238,.1);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090F0E;--surface:#111917;--surface2:#17221F;--border:#22302C;
  --text:#EAF1EE;--text2:#9AABA6;--text3:#62726D;
  --primary:#3BC495;--primary-press:#2DA97F;--primary-soft:#113529;--on-primary:#032018;
  --accent:#EFAA62;--accent-soft:#2F2317;--flame:#FF8A4C;--warning:#EBA556;--danger:#F06A6A;--info:#7EA4F0;
  --ink:#0F2B25;--ink2:#15382F;--on-ink:#EAF1EE;--on-ink2:#8FB0A6;--ink-line:rgba(234,241,238,.1);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:24px;font-weight:700}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--text2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--text3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--primary);color:var(--on-primary);min-height:46px}
.btn:active{background:var(--primary-press)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
input[type=text],input[type=date],input[type=time],select{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
.choice{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt b{display:block}
/* hero */
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden}
.hero .mascot{width:96px;height:96px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center}
.hero .mascot svg{width:92px;height:92px}
.hero p{color:rgba(255,255,255,.95)}
.hero h1{color:#fff;font-size:20px;font-weight:700}
.hero p{font-size:14.5px;line-height:1.7}
.mood-happy{background:linear-gradient(150deg,#0E8466 0%,#0A6650 100%)}
.mood-neutral{background:linear-gradient(150deg,#1E6B62 0%,#154F49 100%)}
.mood-worried{background:linear-gradient(150deg,#C47B28 0%,#A0601A 100%)}
.mood-sad{background:linear-gradient(150deg,#45537A 0%,#323D5E 100%)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
/* countdown */
.cd{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.cd::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:1px solid var(--ink-line);box-shadow:0 0 0 28px var(--ink-line) inset;opacity:.6;pointer-events:none}
.cd .eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--on-ink2);display:flex;justify-content:space-between;gap:8px}
.cd .big{display:flex;align-items:baseline;gap:10px}
.cd .big .n{font-family:var(--display);font-weight:300;font-size:72px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd .big .u{font-size:18px;font-weight:600;color:var(--on-ink2)}
.cd .segs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink-line);padding-top:12px}
.cd .seg{text-align:center;border-inline-start:1px solid var(--ink-line)}
.cd .seg:first-child{border-inline-start:0}
.cd .seg b{display:block;font-family:var(--display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.cd .seg span{font-size:11.5px;color:var(--on-ink2)}
.cd .track{height:4px;background:var(--ink-line);border-radius:9px;overflow:hidden}
.cd .track i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cd .foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--on-ink2);flex-wrap:wrap}
.cd .chip{background:var(--ink2);color:var(--on-ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-weight:500;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.stat .v small{font-size:14px;color:var(--text3);font-weight:400}
.flame{color:var(--flame);width:16px;height:16px;flex:none}
/* sessions */
.sess{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.sess:first-of-type{border-top:0}
.sess .bar{align-self:stretch;border-radius:4px}
.sess.done .t{text-decoration:line-through;color:var(--text3)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:18px;color:var(--on-primary)}
.sess.done .check{background:var(--primary);border-color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
/* week */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:52px;border:1px solid var(--border);border-radius:12px;padding:6px 0;text-align:center;background:var(--surface)}
.day[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.day b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.day span{font-size:11px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin:2px auto 0}
/* subjects */
.subj{border-top:1px solid var(--border);padding:12px 0}
.subj:first-child{border-top:0}
.lv{display:flex;gap:6px}
.lv button{flex:1;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:6px 4px;font-size:12px}
.lv button[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chap{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.chap input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
details summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:13px;margin-top:6px}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--text3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,20,32,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.timer{font-family:var(--display);font-weight:300;font-size:64px;letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.exbtn.big{font-size:13.5px;padding:7px 14px;margin-top:0}
.exbtn.alt{border-color:var(--border);background:var(--surface2);color:var(--text)}
.chaprow{display:flex;align-items:flex-start;gap:8px}
.exbtn{border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;margin-top:4px}
.papers{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.paperlink{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.paperlink span{color:var(--primary)}
.extext{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.extext.sol{background:var(--surface2);border-radius:14px;padding:12px}
.gamecard.terms{background:linear-gradient(135deg,#0B5E57,#13806F)}
.gm-q.long div{font-size:15px;font-weight:600}.gm-opts.long .gm-opt{font-size:13.5px;font-weight:500;text-align:start;justify-content:flex-start;line-height:1.6}
.gm-rev.t{grid-template-columns:1fr}.gl{display:flex;flex-direction:column;max-height:55vh;overflow:auto}.gl-u{font-weight:700;color:var(--primary);padding:10px 0 4px}.gl-it{border-top:1px solid var(--border);padding:8px 0}.gl-it summary{font-weight:600;cursor:pointer}.gl-it p{margin-top:6px;font-size:14px;color:var(--text2);line-height:1.8}
.gamecard{display:flex;align-items:center;gap:12px;text-align:start;border:0;border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,#2B2A6B,#4B3A8F);color:#fff}
.gamecard small{display:block;color:rgba(255,255,255,.8);font-size:12.5px}.gamecard b{font-size:16px}
.gc-ic{font-size:30px}.gc-go{background:#F0A85A;color:#2B1A08;font-weight:700;border-radius:999px;padding:6px 14px;font-size:13px}
.gm-mascot svg{width:110px;height:110px;display:block;margin:0 auto}
.game{display:flex;flex-direction:column;gap:12px}
.gm-top{display:flex;align-items:center;gap:8px;font-size:14px}
.gm-score{font-family:var(--display);font-weight:600;font-size:20px;color:var(--primary);min-width:40px;text-align:end;font-variant-numeric:tabular-nums}
.gm-timer{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}.gm-timer i{display:block;height:100%;background:var(--primary);transition:width .1s linear}.gm-timer i.low{background:var(--warning)}
.gm-face svg{width:84px;height:84px;display:block;margin:0 auto}
.gm-q{background:var(--surface2);border-radius:16px;padding:14px;text-align:center;font-size:18px;font-weight:700;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.gm-opts{display:grid;gap:8px}
.gm-opt{border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.gm-opt.ok{border-color:var(--success,#1E9E5A);background:color-mix(in srgb,#1E9E5A 15%,var(--surface))}
.gm-opt.bad{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 15%,var(--surface))}
.gm-opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.gm-n{min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:13px;display:inline-grid;place-items:center}.gm-n:empty{display:none}
.gm-fb{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}.gm-fb.ok{background:var(--primary-soft)}.gm-fb.bad{background:var(--accent-soft)}
.gm-rev{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:14px}.gm-rev:first-of-type{border-top:0}.gm-rev b{color:var(--primary);white-space:nowrap}
.gamesheet{position:relative;overflow-x:hidden}
.gamesheet.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.gm-lives span{transition:filter .3s,transform .3s;display:inline-block}.gm-lives span.lost{filter:grayscale(1) opacity(.35);transform:scale(.8)}
.gm-score.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.35);color:var(--accent)}}
.gm-stage{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100px}
.gm-combo{font-weight:800;color:var(--flame);font-size:15px;min-height:22px}
.gm-float{position:absolute;top:10px;inset-inline-start:58%;font-family:var(--display);font-weight:700;font-size:26px;color:var(--primary);animation:float .9s ease-out forwards;pointer-events:none}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.gm-face.shake{animation:fshake .4s}@keyframes fshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.gm-count{font-family:var(--display);font-weight:700;font-size:96px;text-align:center;color:var(--primary);line-height:1.2;padding:20px 0}
#gm-body.in{animation:slidein .3s ease-out}@keyframes slidein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gm-q.order{background:linear-gradient(135deg,#2B2A6B,#4B3A8F);color:#fff}.gm-q.order .tiny{color:#F0A85A}
.gm-timer i.low{animation:pulse .5s infinite alternate}@keyframes pulse{to{opacity:.45}}
.gm-stars{display:flex;justify-content:center;gap:10px;font-size:44px;line-height:1}
.gm-stars span{color:var(--border);transform:scale(.4);animation:star .5s forwards}.gm-stars span.on{color:#F6C343;text-shadow:0 2px 8px rgba(246,195,67,.5)}
@keyframes star{to{transform:scale(1)}}
.gm-rank{background:var(--accent-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;min-height:92px}
.tool span{font-size:22px;line-height:1.2}.tool b{font-size:14.5px}.tool small{font-size:12px;color:var(--text2)}
.tool:active{background:var(--surface2)}
.calc{display:flex;flex-direction:column}
.calcrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.calcrow:first-child{border-top:0}
.calcrow input{width:84px;min-height:40px;padding:6px 10px;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-variant-numeric:tabular-nums;direction:ltr}
.avgbox{background:var(--surface2);border-radius:16px;padding:14px;text-align:center}
.avgbox.ok{background:var(--primary-soft)}
.avgnum{font-family:var(--display);font-weight:300;font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums}
.mock{display:flex;flex-direction:column;gap:14px;text-align:center}
.sharebox{border-radius:16px;overflow:hidden;background:var(--surface2);min-height:200px;display:grid;place-items:center}
.sharebox img{width:100%;display:block}
.upd{border-color:var(--primary);background:var(--primary-soft)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text2);display:grid;place-items:center;flex:none}
.iconbtn.sm{width:36px;height:36px}
.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.contact{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font-size:13px;padding:10px 6px}
.contact.wa{background:#1F9D55;color:#fff}
.contact.soft{background:var(--primary-soft);color:var(--primary)}
.kv{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.kv .sel{user-select:all;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.iconprev{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.iconprev svg{width:100%;height:100%}
.onb{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:24px;max-width:520px;margin:0 auto}
.onb .mascot svg{width:150px;height:150px}
.onb .mascot{display:grid;place-items:center}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:22px;height:5px;border-radius:9px;background:var(--border)}
.steps i.on{background:var(--primary)}
.photo{width:88px;height:88px;border-radius:50%;background:var(--surface2);border:2px dashed var(--border);display:grid;place-items:center;overflow:hidden;color:var(--text3);font-size:12px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ring{width:72px;height:72px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}

/* ===== v2 look: chunky, tactile, game-like ===== */

/* daily splash */

<div id="root"></div>

<script>
const BAC=/*DATA*/;
const MSG_M=/*MSG*/,MSG_F=/*MSGF*/;
const MSG=new Proxy({},{get:(t,k)=>((S&&S.gender==="f")?MSG_F:MSG_M)[k]});
const gx=(m,f)=>(S&&S.gender==="f")?f:m;
const MASCOT=/*MASCOT*/;
const BUILD=Number("/*BUILD*/")||0;
const EX=/*EX*/;
const HD=/*HD*/;
const TERMS=/*TERMS*/;
const LINKS=/*LINKS*/;
const ICONS=/*ICONS*/;
const SUBJ_COLORS={math:"#3A6FD8",physics:"#7A4FD6",svt:"#1E9E5A",arabic:"#0E8A6A",islamic:"#2C8C7C",philosophy:"#C2508A",history_geo:"#B7791F",french:"#2F7DB8",english:"#D2603A",amazigh:"#E2A72E",technology:"#5B6B95",economics:"#8C6A3F",accounting:"#A0743A",law:"#6D5B8E",third_language:"#4E9A9F",pe:"#9AA0AE",arts:"#D96C9A"};
const MODES={strong:{name:"البرنامج القوي",per:4,min:60,desc:"4 جلسات × 60 دقيقة = 4 ساعات يومياً"},light:{name:"البرنامج الخفيف",per:2,min:45,desc:"جلستان × 45 دقيقة = ساعة ونصف يومياً"}};
const LEVELS=[{v:1,t:"ضعيف",f:1.5},{v:2,t:"متوسط",f:1},{v:3,t:"جيد",f:.7}];
const DAYN=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const KEY="fennouk-v1";

/* ---------- storage ---------- */
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let ui={tab:"home",onbStep:0,draft:{mode:"strong",remind:"18:00",levels:{}},planDay:null,timer:null};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseYmd(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayDiff(a,b){return Math.round((parseYmd(ymd(b))-parseYmd(ymd(a)))/864e5)}
const today=()=>new Date();

/* ---------- data helpers ---------- */
function stream(){return BAC.streams.find(s=>s.id===S.stream)}
function chaptersOf(sub){
  if(sub.chapters_by_option&&S.option&&sub.chapters_by_option[S.option])return sub.chapters_by_option[S.option];
  return (sub.chapters||[]).map(c=>c.replace(/^\[[^\]]+\]\s*/,""));
}
function studySubjects(){
  return stream().subjects.filter(s=>!s.optional&&s.id!=="pe"&&s.id!=="amazigh").map(s=>({...s,chapters:chaptersOf(s)}));
}
function weightOf(s){const lv=(S.levels&&S.levels[s.id])||2;return s.coefficient*LEVELS.find(l=>l.v===lv).f}
function priority(){return studySubjects().map(s=>({...s,w:weightOf(s)})).sort((a,b)=>b.w-a.w)}
function subjName(id){const s=stream().subjects.find(x=>x.id===id);return s?s.name_ar.replace(/\s*\(.*\)$/,""):id}
function color(id){return SUBJ_COLORS[id]||"#5B6278"}

/* ---------- plan: smooth weighted round-robin from start date ---------- */
let planCache=null;
function planSeq(n){
  const key=JSON.stringify([S.stream,S.option,S.mode,S.levels,n]);
  if(planCache&&planCache.key===key)return planCache.seq;
  const subs=priority();const total=subs.reduce((a,s)=>a+s.w,0);const cur={};subs.forEach(s=>cur[s.id]=0);
  const seq=[];
  for(let i=0;i<n;i++){let best=null;subs.forEach(s=>{cur[s.id]+=s.w;if(!best||cur[s.id]>cur[best.id])best=s});cur[best.id]-=total;seq.push(best.id)}
  planCache={key,seq};return seq;
}
function sessionsFor(date){
  const m=MODES[S.mode];const di=Math.max(0,dayDiff(parseYmd(S.start),date));
  let per=m.per; if(date.getDay()===5&&S.mode==="strong")per=3; // الجمعة أخف
  const seq=planSeq((di+8)*m.per);const out=[];
  const toBac=daysToBac(date);
  for(let i=0;i<per;i++){
    const id=seq[di*m.per+i];const sub=studySubjects().find(s=>s.id===id);
    const done=(S.chapDone[id]||[]);const next=sub.chapters.findIndex((c,j)=>!done.includes(j));
    let kind,label;
    if(toBac<=30||next===-1){kind="paper";label="حل موضوع باك سابق وتصحيحه"}
    else if(i===per-1&&S.mode==="strong"){kind="ex";label="تمارين: "+sub.chapters[next]}
    else{kind="learn";label=sub.chapters[next]}
    out.push({key:ymd(date)+"#"+i,id,label,kind,min:m.min});
  }
  return out;
}

/* ---------- log, streak, mood ---------- */
function dayLog(d){return S.log[ymd(d)]||{done:[],min:0}}
function studied(d){return dayLog(d).done.length>0}
function streak(){let n=0,d=today();if(!studied(d))d=addDays(d,-1);while(studied(d)){n++;d=addDays(d,-1)}return n}
function lastStudy(){const ks=Object.keys(S.log).filter(k=>S.log[k].done.length).sort();return ks.length?parseYmd(ks[ks.length-1]):null}
function missedDays(){const l=lastStudy();const ref=l||addDays(parseYmd(S.start),-1);return Math.max(0,dayDiff(ref,today())-1)}
function mood(){
  const t=today();
  if(studied(t))return "happy";
  const miss=missedDays();
  if(!lastStudy()&&dayDiff(parseYmd(S.start),t)<=0)return "neutral";
  if(miss===0){const [h,mi]=S.remind.split(":").map(Number);return (t.getHours()*60+t.getMinutes()>=h*60+mi)?"worried":"neutral"}
  if(miss===1)return "worried";
  return "sad";
}
function daysToBac(from){return dayDiff(from||today(),parseYmd(S.bacDate))}
function pick(arr,seed){return arr[Math.abs(seed)%arr.length]}
function fill(s,extra){
  const nx=sessionsFor(today()).find(x=>!dayLog(today()).done.includes(x.key));
  return s.replace(/\{name\}/g,S.name).replace(/\{days\}/g,extra&&extra.days!=null?extra.days:daysToBac()).replace(/\{streak\}/g,streak())
    .replace(/\{subject\}/g,extra&&extra.subject||(nx?subjName(nx.id):"")).replace(/\{minutes\}/g,extra&&extra.minutes||"");
}
function heroMessage(md){
  const seed=dayDiff(new Date(2026,0,1),today());const d=daysToBac();
  if(md==="sad")return fill(pick(MSG.missed_several_days,seed),{days:missedDays()});
  if(md==="worried"&&missedDays()>=1)return fill(pick(MSG.missed_one_day,seed));
  if(md==="happy"){const all=sessionsFor(today()).every(x=>dayLog(today()).done.includes(x.key));
    if(all)return fill(pick(MSG.daily_goal_done,seed));return fill(pick(MSG.streak_kept,seed))}
  if(d<=30&&d>=0)return fill(pick(MSG.exam_close,seed));
  return fill(pick(today().getHours()<15?MSG.greeting_morning:MSG.greeting_evening,seed));
}

/* ---------- icon (favicon now; launcher icon on Android build) ---------- */
function setIcon(md){const el=document.getElementById("favicon");el.href="data:image/svg+xml,"+encodeURIComponent(ICONS[md]);}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function selectNear(b){const s=b.parentElement.querySelector(".sel");if(!s)return;const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("حدّد النص وانسخه")}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function avatar(){return S.photo?`<div class="avatar"><img src="${S.photo}" alt=""></div>`:`<div class="avatar">${esc(S.name.trim()[0]||"؟")}</div>`}

function render(){
  document.documentElement.dir="rtl";document.documentElement.lang="ar";applyTheme();
  if(!S){renderOnb();setIcon("happy");return}
  const md=mood();setIcon(md);
  const views={home:vHome,plan:vPlan,subjects:vSubjects,progress:vProgress,settings:vSettings,about:vAbout};
  $("#root").innerHTML=`<main class="app">${views[ui.tab]()}</main>${nav()}`;
  bind();nativeSync();setTimeout(maybeSplash,50);
}
const NAVI=[["home","الرئيسية",'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>'],["plan","البرنامج",'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],["subjects","المواد",'<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/>'],["progress","التقدم",'<path d="M5 20V10M12 20V4M19 20v-7"/>'],["settings","الإعدادات",'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>']];
function nav(){return `<nav class="tabs"><div class="in">${NAVI.map(([k,t,p])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${t}</button>`).join("")}</div></nav>`}

function vHome(){
  const md=mood();const t=today();const ses=sessionsFor(t);const lg=dayLog(t);
  const doneN=ses.filter(x=>lg.done.includes(x.key)).length;
  const d=daysToBac();const weeks=Math.floor(d/7);
  const greet=t.getHours()<12?"صباح الخير":t.getHours()<18?"مرحباً":"مساء الخير";
  return `${updCard()}${announceCard()}
  <div class="row">${avatar()}<div class="grow"><div class="tiny">${greet}</div><h2>أهلاً ${esc(S.name)} 👋</h2></div>
    <button class="iconbtn" data-tab="about" aria-label="عن التطبيق والتواصل">${INFO_ICON}</button></div>
  <section class="hero mood-${md} pop"><div class="mascot">${MASCOT[md]}</div>
    <div class="col" style="gap:6px"><h1>${md==="happy"?gx("فنّوك فرحان بيك!","فنّوك فرحان بيكِ!"):md==="neutral"?gx("فنّوك مستنّيك","فنّوك مستنّيكِ"):md==="worried"?"فنّوك قلقان شوية":gx("فنّوك ناعس بلا بيك","فنّوك ناعس بلا بيكِ")}</h1><p>${esc(heroMessage(md))}</p></div></section>
  ${cdCard()}
  <div class="stats">
    <div class="stat"><div class="k">أيام متتالية</div><div class="v"><span class="streakpill"><span class="fl">🔥</span>${streak()}</span> <small>يوم</small></div></div>
    <div class="stat"><div class="k">هدف اليوم</div><div class="v">${doneN}<small> / ${ses.length} جلسات</small></div><div class="progress"><i style="width:${ses.length?doneN/ses.length*100:0}%"></i></div></div>
  </div>
  <button class="gamecard" data-tool="game"><span class="gc-ic" aria-hidden="true">🎮</span><span class="grow"><b>سباق التواريخ</b><small>${(S.game&&S.game.best)?"أفضل نتيجة: "+S.game.best+" نقطة · ":""}احفظ تواريخ الباك وأنت تلعب</small></span><span class="gc-go">العب</span></button>
  <button class="gamecard terms" data-tool="terms"><span class="gc-ic" aria-hidden="true">🧠</span><span class="grow"><b>لعبة المصطلحات</b><small>${(S.game&&S.game.tbest)?"أفضل نتيجة: "+S.game.tbest+" نقطة · ":""}مصطلحات التاريخ والجغرافيا</small></span><span class="gc-go">العب</span></button>
  <section class="tools" aria-label="أدوات">
    <button class="tool" data-tool="calc"><span aria-hidden="true">🧮</span><b>حاسبة المعدل</b><small>${S.grades&&S.grades[S.stream]&&Object.keys(S.grades[S.stream]).length?"معدلك المتوقع "+fmtAvg(calcAvg().avg):"احسب معدلك المتوقع"}</small></button>
    <button class="tool" data-tool="mock"><span aria-hidden="true">⏱️</span><b>باك تجريبي</b><small>بالتوقيت الرسمي</small></button>
    <button class="tool" data-tool="share"><span aria-hidden="true">📤</span><b>شارك سلسلتك</b><small>🔥 ${streak()} يوم</small></button>
    <button class="tool" data-tool="book"><span aria-hidden="true">👨‍🏫</span><b>احجز حصة</b><small>مع الأستاذ أسامة</small></button>
  </section>
  <section class="card"><div class="row" style="margin-bottom:4px"><h3 class="grow">برنامج اليوم</h3><span class="tiny">${MODES[S.mode].name}</span></div>
    ${ses.map(x=>sessRow(x)).join("")}</section>
  ${exOfDay()}
  <section class="card col"><h3>نصيحة اليوم</h3><p class="muted">${esc(pick(BAC.tips,dayDiff(new Date(2026,0,1),t)))}</p></section>`;
}
const FLAME='<svg class="flame" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.2c0-2 1-3.4 2.2-4.5.2 1.6 1 2.7 2.2 3.1C11 9 11.4 5 12 2zm0 20a7 7 0 0 1-7-7c0 .4 0 0 0 0a7 7 0 0 0 14 0 7 7 0 0 1-7 7z"/></svg>';
function bacParts(){const ms=parseYmd(S.bacDate).setHours(8,0,0,0)-Date.now();if(ms<=0)return null;const s=Math.floor(ms/1000);return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
function cdCard(){const p=bacParts();const st=parseYmd(S.start),end=parseYmd(S.bacDate);const tot=Math.max(1,dayDiff(st,end)),gone=Math.min(tot,Math.max(0,dayDiff(st,today())));
  const yr=end.getFullYear();
  if(!p)return `<section class="cd"><div class="eyebrow"><span>بكالوريا ${yr}</span></div><h2 style="color:var(--on-ink)">انتهت البكالوريا. بالتوفيق في النتائج!</h2></section>`;
  return `<section class="cd" aria-label="العد التنازلي للبكالوريا">
   <div class="eyebrow"><span>العد التنازلي · بكالوريا ${yr}</span><span class="chip">${esc(stream().name_ar)}${S.option?" · "+esc(S.option):""}</span></div>
   <div class="big"><span class="n" id="cd-d">${p.d}</span><span class="u">يوماً متبقياً</span></div>

const normCh=c=>String(c).replace(/^\[[^\]]+\]\s*/,"").replace(/\s+/g," ").trim();

const EX_HARD=["math-05b","math-10b"],LIGHT_MATH=["letters_philosophy","foreign_languages","arts"];

function exCount(sub){const s=studySubjects().find(x=>x.id===sub);if(!s)return 0;const ids=new Set();s.chapters.forEach(c=>exFor(sub,c).forEach(e=>ids.add(e.id)));return ids.size}

  const done=S.exDone||{};let pickE=null;
  for(const s of priority()){for(const c of s.chapters){const e=exFor(s.id,c).find(x=>!done[x.id]);if(e){pickE={...e,sub:s.id};break}}if(pickE)break}
  const total=Object.keys(exIndex()).length;if(!pickE)return "";const nDone=Object.keys(done).length;
  return `<section class="card col"><div class="row"><h3 class="grow">📝 تمرين اليوم</h3><button class="exbtn" data-tab="subjects">كل التمارين</button></div>
   <div class="row"><span class="bar" style="width:6px;align-self:stretch;border-radius:4px;background:${color(pickE.sub)}"></span><div class="grow"><b>${esc(pickE.title)}</b><div class="tiny">${esc(subjName(pickE.sub))} · ${esc(pickE.level||"")} · ${pickE.minutes||20} دقيقة</div></div></div>

    totalC+=s.coefficient;if(v!=null){num+=v*s.coefficient;coef+=s.coefficient}});
  return {avg:coef?(num+bonus)/coef:null,num:num+bonus,coef,totalC,complete:coef===totalC}}
const fmtAvg=a=>a==null?"—":(Math.round(a*100)/100).toFixed(2);
function mention(a){return a>=18?"ممتاز":a>=16?"جيد جداً":a>=14?"جيد":a>=12?"قريب من الجيد":a>=10?"مقبول":"راسب"}

/* ---------- game: سباق التواريخ ---------- */
const MONTHS=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function hdFmt(d){const p=d.split("-").map(Number);return p.length===3?`${p[2]} ${MONTHS[p[1]-1]} ${p[0]}`:p.length===2?`${MONTHS[p[1]-1]} ${p[0]}`:String(p[0])}
const hdYear=d=>+d.slice(0,4);const hdKey=d=>{const p=d.split("-").map(Number);return p[0]*10000+(p[1]||6)*100+(p[2]||15)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gstate(){S.game=S.game||{best:0,plays:0,seen:{},wrong:{},right:{}};return S.game}
function pickEvent(pool,used){const g=gstate();let tot=0;const ws=pool.filter(e=>!used.has(e.id)).map(e=>{const w=Math.max(.3,1+(g.seen[e.id]?0:2)+3*(g.wrong[e.id]||0)-.7*Math.min(3,g.right[e.id]||0));tot+=w;return [e,w]});
  let r=Math.random()*tot;for(const [e,w] of ws){r-=w;if(r<=0)return e}return ws.length?ws[ws.length-1][0]:pool[0]}
function nearDates(e,pool){const prec=e.d.split("-").length;const fmtC=hdFmt(e.d);const out=new Set();
  const cands=pool.filter(x=>x.id!==e.id&&x.d.split("-").length===prec).sort((a,b)=>Math.abs(hdYear(a.d)-hdYear(e.d))-Math.abs(hdYear(b.d)-hdYear(e.d)));
  for(const c of cands.slice(0,6)){const f=hdFmt(c.d);if(f!==fmtC)out.add(f)}
  const p=e.d.split("-");[1,-1,2,-2].forEach(k=>{const f=hdFmt([+p[0]+k,...p.slice(1)].join("-"));if(f!==fmtC)out.add(f)});
  return shuf([...out]).slice(0,3)}
function makeQ(pool,used,i){
  const e=pickEvent(pool,used);used.add(e.id);
  if(i%4===3){const others=shuf(pool.filter(x=>x.id!==e.id&&Math.abs(hdYear(x.d)-hdYear(e.d))<=8&&hdKey(x.d)!==hdKey(e.d)));
    const set=[e];for(const o of others){if(set.length<3&&set.every(s=>hdKey(s.d)!==hdKey(o.d)))set.push(o)}
    if(set.length===3)return {type:"order",items:shuf(set),answer:set.slice().sort((a,b)=>hdKey(a.d)-hdKey(b.d)).map(x=>x.id),ev:e}}
  if(Math.random()<.6){const opts=shuf([hdFmt(e.d),...nearDates(e,pool)]);return {type:"when",ev:e,q:e.e,opts,answer:hdFmt(e.d)}}
  const dis=shuf(pool.filter(x=>x.id!==e.id&&hdFmt(x.d)!==hdFmt(e.d))).sort((a,b)=>Math.abs(hdYear(a.d)-hdYear(e.d))-Math.abs(hdYear(b.d)-hdYear(e.d))).slice(0,3);
  return {type:"what",ev:e,q:hdFmt(e.d),opts:shuf([e.e,...dis.map(x=>x.e)]),answer:e.e}}

/* ---------- Android back button / back gesture ----------
   Capacitor sends "back" to the WebView history, so we keep one trap entry in it and handle each press ourselves. */
let backArmed=false,exitPending=false;
function armBack(){if(!NATIVE||backArmed)return;try{history.pushState({trap:1},"");backArmed=true}catch(e){}}
function handleBack(){
  const sp=document.querySelector(".splash");if(sp){sp.remove();return true}
  const ce=document.querySelector(".celebrate");if(ce){ce.remove();render();return true}
  const ovs=document.querySelectorAll(".overlay");const ov=ovs[ovs.length-1];
  if(ov){
    if(ov.querySelector(".mock")){toast("الامتحان جارٍ. اضغط «أنهيت الامتحان» للخروج");return true}
    const q=sel=>ov.querySelector(sel);
    const btn=q("#gm-close")||q("#gm-quit")||q("#t-close")||q("#x-close")||q("[data-close]");
    if(btn)btn.click();else{ov.remove();render()}
    return true}
  if(ui.tab!=="home"){ui.tab=ui.tab==="about"?(ui.back||"home"):"home";ui.confirmReset=false;render();window.scrollTo(0,0);return true}
  return false}
window.addEventListener("popstate",()=>{if(!NATIVE)return;backArmed=false;
  if(handleBack()){armBack();return}
  if(!exitPending){exitPending=true;toast("اضغط رجوع مرة أخرى للخروج");setTimeout(()=>{exitPending=false;armBack()},2000)}});
setTimeout(armBack,300);

function readPhoto(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=160;c.width=c.height=s;const x=c.getContext("2d");const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);cb(c.toDataURL("image/jpeg",.82))};img.src=r.result};r.readAsDataURL(file)}

  on("o-back","click",()=>{ui.onbStep--;renderOnb()});

  on("o-restore","change",e=>readBackup(e.target.files[0],j=>{ui.pendingRestore=j;showRestore()}));
  on("o-name","input",e=>{d.name=e.target.value;$("#o-next").disabled=!d.name.trim()});
  on("o-photo","change",e=>readPhoto(e.target.files[0],u=>{d.photo=u;renderOnb()}));
  on("o-opt","change",e=>d.option=e.target.value);
  on("o-rem","change",e=>d.remind=e.target.value);
  document.querySelectorAll("[data-stream]").forEach(b=>b.onclick=()=>{d.stream=b.dataset.stream;d.option=null;d.levels={};renderOnb()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{d.mode=b.dataset.mode;renderOnb()});
  document.querySelectorAll("[data-olv]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.olv.split(":");d.levels[i]=+v;renderOnb()});
  on("o-done","click",()=>{
    S={gender:d.gender||"m",name:d.name.trim(),photo:d.photo||null,stream:d.stream,option:d.option||null,mode:d.mode,levels:d.levels,remind:d.remind||"18:00",
      bacDate:BAC.bac_date.estimated_start,bacOfficial:!!BAC.bac_date.official,start:ymd(today()),chapDone:{},log:{}};
    save();ui.tab="home";render();toast("أهلاً "+S.name+"! برنامجك واجد 🎉");if(LN)askNotif();
  });
}

/* ---------- main bindings ---------- */
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="about"&&ui.tab!=="about")ui.back=ui.tab;ui.tab=b.dataset.tab;ui.confirmReset=false;render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const v=b.dataset.copy;const done=()=>toast("تم النسخ: "+v);
    try{navigator.clipboard.writeText(v).then(done).catch(()=>selectNear(b))}catch(e){selectNear(b)}});
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>openTimer(b.dataset.start));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const k=b.dataset.undo;const day=k.split("#")[0];const l=S.log[day];if(!l)return;
    const it=(l.items||[]).find(i=>i.key===k);l.done=l.done.filter(x=>x!==k);if(it){l.min-=it.min;l.items=l.items.filter(i=>i.key!==k)}save();render()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ui.planDay=b.dataset.day;render()});
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.lv.split(":");S.levels[i]=+v;save();render()});
  document.querySelectorAll("[data-ch]").forEach(b=>b.onchange=()=>{const[i,j]=b.dataset.ch.split(":");const a=S.chapDone[i]||(S.chapDone[i]=[]);
    if(b.checked){if(!a.includes(+j))a.push(+j)}else S.chapDone[i]=a.filter(x=>x!==+j);save();const y=scrollY;render();scrollTo(0,y)});
  document.querySelectorAll("details[data-sub]").forEach(d=>d.ontoggle=()=>{ui.openSub=ui.openSub||{};ui.openSub[d.dataset.sub]=d.open});
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));
  document.querySelectorAll("[data-open-sub]").forEach(b=>b.onclick=()=>{const id=b.dataset.openSub;ui.openSub=ui.openSub||{};ui.openSub[id]=true;render();const d=document.querySelector(`details[data-sub="${id}"]`);if(d)d.scrollIntoView({block:"start",behavior:"smooth"})});
  bindExternal(document);
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>({calc:openCalc,mock:openMock,share:openShare,book:openBooking,game:openGame,terms:openTerms})[b.dataset.tool]());
  {const mx=document.getElementById("msg-x");if(mx)mx.onclick=()=>{ui.hideMsg=CFG.message;render()}}
  {const x=document.getElementById("upd-x");if(x)x.onclick=()=>{ui.hideUpd=true;render()};const c=document.getElementById("upd-check");if(c)c.onclick=()=>{c.disabled=true;c.textContent="جارٍ البحث…";checkUpdate(true)}}
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();render();toast("تم التبديل إلى "+MODES[S.mode].name)});
  const on=(id,ev,f)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,f)};
  on("s-name","change",e=>{if(e.target.value.trim()){S.name=e.target.value.trim();save();render()}});
  on("s-photo","change",e=>readPhoto(e.target.files[0],u=>{S.photo=u;save();render()}));
  on("s-nophoto","click",()=>{S.photo=null;save();render()});
  on("s-stream","change",e=>{S.stream=e.target.value;const s=stream();S.option=s.options&&s.options.length?s.options[0]:null;S.levels={};S.chapDone={};save();render();toast("تم تغيير الشعبة وتحديث البرنامج")});
  on("s-opt","change",e=>{S.option=e.target.value;save();render()});
  on("s-rem","change",e=>{S.remind=e.target.value;save();render();toast("التذكير على "+S.remind)});
  on("s-bac","change",e=>{if(e.target.value){S.bacDate=e.target.value;S.bacDateManual=true;save();render()}});
  on("s-bacauto","click",()=>{S.bacDateManual=false;save();checkConfig();toast("سيُستعمل التاريخ الذي ننشره تلقائياً")});
  on("s-notif","click",askNotif);
  on("s-reset","click",()=>{ui.confirmReset=true;render()});
  on("s-backup","click",doBackup);
  document.querySelectorAll("[data-theme-pick]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.themePick;save();render()});
  document.querySelectorAll("[data-sgender]").forEach(b=>b.onclick=()=>{S.gender=b.dataset.sgender;save();render();nativeSync(true)});
  on("s-restore","change",e=>readBackup(e.target.files[0],st=>{ui.pendingRestore=st;render();showRestore()}));
  on("s-cancel","click",()=>{ui.confirmReset=false;render()});
  on("s-reset2","click",()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;ui={tab:"home",onbStep:0,draft:{mode:"strong",remind:"18:00",levels:{}}};render()});
}

/* ---------- session timer ---------- */
function openTimer(key){
  const day=key.split("#")[0];const x=sessionsFor(parseYmd(day)).find(s=>s.key===key);if(!x)return;
  let left=x.min*60,running=false,iv=null,wake=null;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="row"><span class="bar" style="width:6px;height:40px;border-radius:4px;background:${color(x.id)}"></span><div class="grow"><h2>${esc(subjName(x.id))}</h2><p class="small muted">${esc(x.label)}</p></div></div>
   <div class="timer" id="t-clock"></div><div class="progress"><i id="t-bar" style="width:0%"></i></div>
   <p class="small muted" style="text-align:center">ضع الهاتف بعيداً وركّز. خذ استراحة 10 دقائق بعد الجلسة.</p>
   ${sessionHelp(x)}
   ${x.kind!=="paper"?`<label class="chap"><input type="checkbox" id="t-ch"><span>أنهيت هذا المحور، انتقل للمحور التالي في المرة القادمة</span></label>`:""}
   <div class="row"><button class="btn grow" id="t-go">ابدأ المؤقت</button><button class="btn soft grow" id="t-done">أنهيت الجلسة</button></div>
   <button class="btn ghost" id="t-close">إغلاق</button></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));bindExternal(ov);
  const draw=()=>{ov.querySelector("#t-clock").textContent=pad(Math.floor(left/60))+":"+pad(left%60);ov.querySelector("#t-bar").style.width=(100-left/(x.min*60)*100)+"%"};draw();
  const stop=()=>{clearInterval(iv);running=false;try{wake&&wake.release()}catch(e){}};
  ov.querySelector("#t-go").onclick=async e=>{if(running){stop();e.target.textContent="استئناف";return}running=true;e.target.textContent="إيقاف مؤقت";
    try{wake=await navigator.wakeLock.request("screen")}catch(err){}
    iv=setInterval(()=>{left--;draw();if(left<=0){stop();finish(x.min)}},1000)};
  ov.querySelector("#t-close").onclick=()=>{stop();ov.remove()};
  ov.querySelector("#t-done").onclick=()=>{const spent=Math.round((x.min*60-left)/60);finish(spent>=5?spent:x.min)};
  function finish(min){stop();
    const l=S.log[day]||(S.log[day]={done:[],min:0,items:[]});l.items=l.items||[];
    if(!l.done.includes(key)){l.done.push(key);l.min+=min;l.items.push({key,id:x.id,min})}
    const ch=ov.querySelector("#t-ch");if(ch&&ch.checked){const sub=studySubjects().find(s=>s.id===x.id);const a=S.chapDone[x.id]||(S.chapDone[x.id]=[]);const nx=sub.chapters.findIndex((c,j)=>!a.includes(j));if(nx>-1)a.push(nx)}
    save();ov.remove();render();celebrate(subjName(x.id),min);}
}

/* ---------- native Android bridge (inactive on the web) ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const LN=NATIVE&&window.capacitorLocalNotifications?window.capacitorLocalNotifications.LocalNotifications:null;
const FI=NATIVE&&window.capacitorExports?window.capacitorExports.registerPlugin("FennoukIcon"):null;
let lastSyncKey="";
async function nativeSync(force){
  if(!NATIVE||!S)return;
  const md=mood();const ls=lastStudy();
  const key=[md,ls?ymd(ls):"",S.remind,ymd(today()),S.name,S.bacDate,S.mode,S.gender].join("|");
  if(!force&&key===lastSyncKey)return;lastSyncKey=key;
  try{if(FI)await FI.sync({mood:md,lastStudy:ls?ymd(ls):"",start:S.start,remind:S.remind})}catch(e){}
  try{if(LN)await scheduleReminders()}catch(e){}
}
async function scheduleReminders(){
  const perm=await LN.checkPermissions();if(perm.display!=="granted")return;
  try{await LN.createChannel({id:"reminders",name:"تذكير المراجعة",description:"تذكير يومي من فنّوك",importance:4,vibration:true})}catch(e){}
  const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const [h,m]=S.remind.split(":").map(Number);const t=today();const now=new Date();const list=[];
  const ls=lastStudy();const studiedToday=studied(t);const N=MSG.notifications;
  for(let i=0;i<14;i++){
    if(i===0&&studiedToday)continue;
    const d=addDays(t,i);const gap=ls?dayDiff(ls,d):dayDiff(addDays(parseYmd(S.start),-1),d);
    const toB=daysToBac(d);if(toB<0)break;
    let grp=N.daily_reminder;if(gap>=3&&N.comeback)grp=N.comeback;else if(toB<=30&&N.exam_countdown)grp=N.exam_countdown;
    const msg=pick(grp,i+d.getDate());const ex={days:grp===N.comeback?gap-1:toB};
    const at=new Date(d);at.setHours(h,m,0,0);
    if(at>now)list.push({id:1000+i,title:fill(msg.title,ex),body:fill(msg.body,ex),channelId:"reminders",schedule:{at,allowWhileIdle:true},smallIcon:"ic_stat_fennouk"});
    if(N.second_reminder&&h<21){const at2=new Date(d);at2.setHours(21,30,0,0);const m2=pick(N.second_reminder,i);
      if(at2>now)list.push({id:2000+i,title:fill(m2.title,ex),body:fill(m2.body,ex),channelId:"reminders",schedule:{at:at2,allowWhileIdle:true},smallIcon:"ic_stat_fennouk"})}
  }
  if(list.length)await LN.schedule({notifications:list});
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S){render();checkUpdate()}});
setTimeout(()=>checkUpdate(),3000);

/* ---------- reminders (while open; Android build schedules real notifications) ---------- */
function askNotif(){if(LN){LN.requestPermissions().then(p=>{toast(p.display==="granted"?"تم تفعيل الإشعارات اليومية":"لم يُسمح بالإشعارات، فعّلها من إعدادات الهاتف");nativeSync(true)}).catch(()=>{});return}
  try{if(!("Notification" in window)){toast("الإشعارات تعمل في نسخة الهاتف");return}
  Notification.requestPermission().then(p=>toast(p==="granted"?"تم تفعيل الإشعارات":"الإشعارات غير مسموحة هنا، ستعمل في نسخة أندرويد")).catch(()=>toast("الإشعارات تعمل في نسخة أندرويد"))}catch(e){toast("الإشعارات تعمل في نسخة أندرويد")}}
let lastNotified=null;
setInterval(()=>{if(!S)return;const t=today();const now=pad(t.getHours())+":"+pad(t.getMinutes());
  if(now===S.remind&&!studied(t)&&lastNotified!==ymd(t)){lastNotified=ymd(t);const n=pick(MSG.notifications.daily_reminder,t.getDate());
    try{if(Notification.permission==="granted")new Notification(fill(n.title),{body:fill(n.body),icon:"data:image/svg+xml,"+encodeURIComponent(ICONS.worried)})}catch(e){}
    toast(fill(n.title)+": "+fill(n.body))}
  if(ui.tab==="home"&&!document.querySelector(".overlay"))render();},60000);

render();
</script>
