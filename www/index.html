/* Layout: one-column phone app, RTL, sticky bottom nav; mascot card leads the home screen */
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--surface2:#ECF0EE;--border:#DFE5E2;
  --text:#0E1A18;--text2:#52605C;--text3:#87938F;
  --primary:#0A7458;--primary-press:#085E48;--primary-soft:#E0F0EA;--on-primary:#FFFFFF;
  --accent:#D98E3F;--accent-soft:#F8ECDD;--flame:#E8692A;
  --warning:#C97A22;--danger:#C93C3C;--info:#2F63C4;
  --ink:#0C2621;--ink2:#123630;--on-ink:#F1F5F3;--on-ink2:#9DB8B0;--ink-line:rgba(241,245,243,.12);
  --shadow:0 1px 1px rgba(14,26,24,.04),0 6px 20px -8px rgba(14,26,24,.12);
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:16px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090F0E;--surface:#111917;--surface2:#17221F;--border:#22302C;
  --text:#EAF1EE;--text2:#9AABA6;--text3:#62726D;
  --primary:#3BC495;--primary-press:#2DA97F;--primary-soft:#113529;--on-primary:#032018;
  --accent:#EFAA62;--accent-soft:#2F2317;--flame:#FF8A4C;--warning:#EBA556;--danger:#F06A6A;--info:#7EA4F0;
  --ink:#0F2B25;--ink2:#15382F;--on-ink:#EAF1EE;--on-ink2:#8FB0A6;--ink-line:rgba(234,241,238,.1);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090F0E;--surface:#111917;--surface2:#17221F;--border:#22302C;
  --text:#EAF1EE;--text2:#9AABA6;--text3:#62726D;
  --primary:#3BC495;--primary-press:#2DA97F;--primary-soft:#113529;--on-primary:#032018;
  --accent:#EFAA62;--accent-soft:#2F2317;--flame:#FF8A4C;--warning:#EBA556;--danger:#F06A6A;--info:#7EA4F0;
  --ink:#0F2B25;--ink2:#15382F;--on-ink:#EAF1EE;--on-ink2:#8FB0A6;--ink-line:rgba(234,241,238,.1);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:24px;font-weight:700}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--text2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--text3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--primary);color:var(--on-primary);min-height:46px}
.btn:active{background:var(--primary-press)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
input[type=text],input[type=date],input[type=time],select{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
.choice{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt b{display:block}
/* hero */
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden}
.hero .mascot{width:96px;height:96px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center}
.hero .mascot svg{width:92px;height:92px}
.hero p{color:rgba(255,255,255,.95)}
.hero h1{color:#fff;font-size:20px;font-weight:700}
.hero p{font-size:14.5px;line-height:1.7}
.mood-happy{background:linear-gradient(150deg,#0E8466 0%,#0A6650 100%)}
.mood-neutral{background:linear-gradient(150deg,#1E6B62 0%,#154F49 100%)}
.mood-worried{background:linear-gradient(150deg,#C47B28 0%,#A0601A 100%)}
.mood-sad{background:linear-gradient(150deg,#45537A 0%,#323D5E 100%)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
/* countdown */
.cd{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.cd::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:1px solid var(--ink-line);box-shadow:0 0 0 28px var(--ink-line) inset;opacity:.6;pointer-events:none}
.cd .eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--on-ink2);display:flex;justify-content:space-between;gap:8px}
.cd .big{display:flex;align-items:baseline;gap:10px}
.cd .big .n{font-family:var(--display);font-weight:300;font-size:72px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd .big .u{font-size:18px;font-weight:600;color:var(--on-ink2)}
.cd .segs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink-line);padding-top:12px}
.cd .seg{text-align:center;border-inline-start:1px solid var(--ink-line)}
.cd .seg:first-child{border-inline-start:0}
.cd .seg b{display:block;font-family:var(--display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.cd .seg span{font-size:11.5px;color:var(--on-ink2)}
.cd .track{height:4px;background:var(--ink-line);border-radius:9px;overflow:hidden}
.cd .track i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cd .foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--on-ink2);flex-wrap:wrap}
.cd .chip{background:var(--ink2);color:var(--on-ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-weight:500;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.stat .v small{font-size:14px;color:var(--text3);font-weight:400}
.flame{color:var(--flame);width:16px;height:16px;flex:none}
/* sessions */
.sess{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.sess:first-of-type{border-top:0}
.sess .bar{align-self:stretch;border-radius:4px}
.sess.done .t{text-decoration:line-through;color:var(--text3)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:18px;color:var(--on-primary)}
.sess.done .check{background:var(--primary);border-color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
/* week */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:52px;border:1px solid var(--border);border-radius:12px;padding:6px 0;text-align:center;background:var(--surface)}
.day[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.day b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.day span{font-size:11px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin:2px auto 0}
/* subjects */
.subj{border-top:1px solid var(--border);padding:12px 0}
.subj:first-child{border-top:0}
.lv{display:flex;gap:6px}
.lv button{flex:1;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:6px 4px;font-size:12px}
.lv button[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chap{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.chap input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
details summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:13px;margin-top:6px}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--text3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,20,32,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.timer{font-family:var(--display);font-weight:300;font-size:64px;letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.exbtn.big{font-size:13.5px;padding:7px 14px;margin-top:0}
.exbtn.alt{border-color:var(--border);background:var(--surface2);color:var(--text)}
.chaprow{display:flex;align-items:flex-start;gap:8px}
.exbtn{border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;margin-top:4px}
.papers{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.paperlink{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.paperlink span{color:var(--primary)}
.extext{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.extext.sol{background:var(--surface2);border-radius:14px;padding:12px}
.gamecard{display:flex;align-items:center;gap:12px;text-align:start;border:0;border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,#2B2A6B,#4B3A8F);color:#fff}
.gamecard small{display:block;color:rgba(255,255,255,.8);font-size:12.5px}.gamecard b{font-size:16px}
.gc-ic{font-size:30px}.gc-go{background:#F0A85A;color:#2B1A08;font-weight:700;border-radius:999px;padding:6px 14px;font-size:13px}
.gm-mascot svg{width:110px;height:110px;display:block;margin:0 auto}
.game{display:flex;flex-direction:column;gap:12px}
.gm-top{display:flex;align-items:center;gap:8px;font-size:14px}
.gm-score{font-family:var(--display);font-weight:600;font-size:20px;color:var(--primary);min-width:40px;text-align:end;font-variant-numeric:tabular-nums}
.gm-timer{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}.gm-timer i{display:block;height:100%;background:var(--primary);transition:width .1s linear}.gm-timer i.low{background:var(--warning)}
.gm-face svg{width:84px;height:84px;display:block;margin:0 auto}
.gm-q{background:var(--surface2);border-radius:16px;padding:14px;text-align:center;font-size:18px;font-weight:700;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.gm-opts{display:grid;gap:8px}
.gm-opt{border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.gm-opt.ok{border-color:var(--success,#1E9E5A);background:color-mix(in srgb,#1E9E5A 15%,var(--surface))}
.gm-opt.bad{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 15%,var(--surface))}
.gm-opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.gm-n{min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:13px;display:inline-grid;place-items:center}.gm-n:empty{display:none}
.gm-fb{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}.gm-fb.ok{background:var(--primary-soft)}.gm-fb.bad{background:var(--accent-soft)}
.gm-rev{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:14px}.gm-rev:first-of-type{border-top:0}.gm-rev b{color:var(--primary);white-space:nowrap}
.gamesheet{position:relative;overflow-x:hidden}
.gamesheet.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.gm-lives span{transition:filter .3s,transform .3s;display:inline-block}.gm-lives span.lost{filter:grayscale(1) opacity(.35);transform:scale(.8)}
.gm-score.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.35);color:var(--accent)}}
.gm-stage{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100px}
.gm-combo{font-weight:800;color:var(--flame);font-size:15px;min-height:22px}
.gm-float{position:absolute;top:10px;inset-inline-start:58%;font-family:var(--display);font-weight:700;font-size:26px;color:var(--primary);animation:float .9s ease-out forwards;pointer-events:none}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.gm-face.shake{animation:fshake .4s}@keyframes fshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.gm-count{font-family:var(--display);font-weight:700;font-size:96px;text-align:center;color:var(--primary);line-height:1.2;padding:20px 0}
#gm-body.in{animation:slidein .3s ease-out}@keyframes slidein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gm-q.order{background:linear-gradient(135deg,#2B2A6B,#4B3A8F);color:#fff}.gm-q.order .tiny{color:#F0A85A}
.gm-timer i.low{animation:pulse .5s infinite alternate}@keyframes pulse{to{opacity:.45}}
.gm-stars{display:flex;justify-content:center;gap:10px;font-size:44px;line-height:1}
.gm-stars span{color:var(--border);transform:scale(.4);animation:star .5s forwards}.gm-stars span.on{color:#F6C343;text-shadow:0 2px 8px rgba(246,195,67,.5)}
@keyframes star{to{transform:scale(1)}}
.gm-rank{background:var(--accent-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;min-height:92px}
.tool span{font-size:22px;line-height:1.2}.tool b{font-size:14.5px}.tool small{font-size:12px;color:var(--text2)}
.tool:active{background:var(--surface2)}
.calc{display:flex;flex-direction:column}
.calcrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.calcrow:first-child{border-top:0}
.calcrow input{width:84px;min-height:40px;padding:6px 10px;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-variant-numeric:tabular-nums;direction:ltr}
.avgbox{background:var(--surface2);border-radius:16px;padding:14px;text-align:center}
.avgbox.ok{background:var(--primary-soft)}
.avgnum{font-family:var(--display);font-weight:300;font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums}
.mock{display:flex;flex-direction:column;gap:14px;text-align:center}
.sharebox{border-radius:16px;overflow:hidden;background:var(--surface2);min-height:200px;display:grid;place-items:center}
.sharebox img{width:100%;display:block}
.upd{border-color:var(--primary);background:var(--primary-soft)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text2);display:grid;place-items:center;flex:none}
.iconbtn.sm{width:36px;height:36px}
.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.contact{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font-size:13px;padding:10px 6px}
.contact.wa{background:#1F9D55;color:#fff}
.contact.soft{background:var(--primary-soft);color:var(--primary)}
.kv{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.kv .sel{user-select:all;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.iconprev{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.iconprev svg{width:100%;height:100%}
.onb{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:24px;max-width:520px;margin:0 auto}
.onb .mascot svg{width:150px;height:150px}
.onb .mascot{display:grid;place-items:center}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:22px;height:5px;border-radius:9px;background:var(--border)}
.steps i.on{background:var(--primary)}
.photo{width:88px;height:88px;border-radius:50%;background:var(--surface2);border:2px dashed var(--border);display:grid;place-items:center;overflow:hidden;color:var(--text3);font-size:12px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ring{width:72px;height:72px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}

'(x) ≥ 0 ولا تنعدم إلا عند x = 0: f متزايدة تماما على ℝ.", "جدول التغيرات: f تتزايد من −∞ إلى +∞، مع f(0) = −1 + 2 = 1.", "II-3) f(x) − (x − 1) = (x + 2)e^(−x) → 0 لما x → +∞، إذن (Δ) مقارب مائل عند +∞.", "إشارة الفرق هي إشارة (x + 2):", "• x > −2: (Cf) فوق (Δ). • x < −2: (Cf) تحت (Δ). • يتقاطعان في A(−2 ; −3).", "II-4) f مستمرة ومتزايدة تماما على ℝ وتأخذ قيمها من −∞ إلى +∞، إذن f(x) = 0 تقبل حلا وحيدا α.", "f(−1,5) = −2,5 + 0,5·e^(1,5) ≈ −0,259 < 0", "f(−1,4) = −2,4 + 0,6·e^(1,4) ≈ 0,033 > 0، إذن −1,5 < α < −1,4.", "II-5-أ) F'(x) = −e^(−x) + (x + 3)e^(−x) = (x + 2)e^(−x). إذن F دالة أصلية لها.", "II-5-ب) على [0 ; 1] لدينا (Cf) فوق (Δ)، ومنه:", "A = ∫ من 0 إلى 1 لـ [f(x) − (x − 1)] dx = ∫ من 0 إلى 1 لـ (x + 2)e^(−x) dx", "= F(1) − F(0) = −4e^(−1) − (−3) = 3 − 4/e ≈ 1,53 وحدة مساحة."], "answer": "g(x) ≥ 0 ؛ f متزايدة تماما على ℝ ؛ (Δ): y = x − 1 ؛ α ≈ −1,41 ؛ A = 3 − 4/e ≈ 1,53 u.a"}, {"id": "math-04a", "chapters": ["الدالة اللوغاريتمية", "الدالة الأسية والدالة اللوغاريتمية"], "title": "معادلات ومتراجحات ونهايات لوغاريتمية", "level": "متوسط", "minutes": 25, "statement": ["1) حل في المجال ]1 ; +∞[ المعادلة: ln(x − 1) + ln(x + 1) = ln 3.", "2) حل في ]0 ; +∞[ المعادلة: (ln x)² − ln x − 2 = 0.", "3) حل في ℝ المتراجحة: ln(2x − 3) ≤ 0.", "4) احسب النهايات:", "أ) lim (x→+∞) (x − ln x)", "ب) lim (x→0⁺) x·ln x", "ج) lim (x→1) ln x/(x − 1)", "5) f دالة معرفة على ]0 ; +∞[ بـ: f(x) = x·ln x − x. احسب f'(x) وادرس اتجاه تغير f."], "solution": ["1) من أجل x > 1: ln(x − 1) + ln(x + 1) = ln((x − 1)(x + 1)) = ln(x² − 1).", "ln(x² − 1) = ln 3 ⇔ x² − 1 = 3 ⇔ x² = 4 ⇔ x = 2 أو x = −2.", "−2 ∉ ]1 ; +∞[، إذن S = {2}.", "2) نضع X = ln x: X² − X − 2 = 0 ⇔ (X − 2)(X + 1) = 0.", "ln x = 2 ⇔ x = e² ، ln x = −1 ⇔ x = e^(−1) = 1/e. إذن S = {1/e ; e²}.", "3) شرط الوجود: 2x − 3 > 0 ⇔ x > 3/2.", "ln(2x − 3) ≤ 0 = ln 1 ⇔ 2x − 3 ≤ 1 ⇔ x ≤ 2 (لأن ln متزايدة تماما).", "S = ]3/2 ; 2].", "4-أ) x − ln x = x(1 − (ln x)/x)، و lim (x→+∞) (ln x)/x = 0، إذن النهاية = +∞.", "4-ب) نهاية شهيرة: lim (x→0⁺) x·ln x = 0.", "4-ج) ln x/(x − 1) = (ln x − ln 1)/(x − 1) وهو معدل تغير ln عند 1،", "فالنهاية تساوي العدد المشتق ln'(1) = 1/1 = 1.", "5) f'(x) = 1·ln x + x·(1/x) − 1 = ln x.", "ln x < 0 على ]0 ; 1[ و ln x > 0 على ]1 ; +∞[.", "f متناقصة تماما على ]0 ; 1] ومتزايدة تماما على [1 ; +∞[، وقيمتها الصغرى f(1) = −1."], "answer": "S = {2} ؛ S = {1/e ; e²} ؛ S = ]3/2 ; 2] ؛ النهايات: +∞ ، 0 ، 1 ؛ f'(x) = ln x ، f(1) = −1"}, {"id": "math-04b", "chapters": ["الدالة اللوغاريتمية", "الدالة الأسية والدالة اللوغاريتمية"], "title": "دالة لوغاريتمية: دالة مساعدة، مماس ومساحة", "level": "باك", "minutes": 55, "statement": ["الجزء الأول: g دالة معرفة على ]0 ; +∞[ بـ: g(x) = x² − 1 + ln x.", "1) ادرس اتجاه تغير g، واحسب g(1).", "2) استنتج إشارة g(x) على ]0 ; +∞[.", "الجزء الثاني: f دالة معرفة على ]0 ; +∞[ بـ: f(x) = x − 1 − (ln x)/x، و (Cf) تمثيلها البياني في معلم متعامد ومتجانس.", "1) احسب lim (x→0⁺) f(x) وفسّر النتيجة هندسيا، ثم احسب lim (x→+∞) f(x).", "2) بيّن أن f'(x) = g(x)/x²، ثم شكّل جدول تغيرات f. استنتج أن f(x) ≥ 0 على ]0 ; +∞[.", "3) بيّن أن (Δ): y = x − 1 مقارب مائل لـ (Cf) عند +∞، وادرس الوضع النسبي لـ (Cf) و (Δ).", "4) بيّن أن (Cf) يقبل مماسا (T) يوازي (Δ)، يطلب كتابة معادلته.", "5) احسب المساحة A للحيز المحدد بـ (Cf) و (Δ) والمستقيمين x = 1 و x = e."], "solution": ["I-1) g'(x) = 2x + 1/x > 0 على ]0 ; +∞[، إذن g متزايدة تماما. g(1) = 1 − 1 + 0 = 0.", "I-2) g متزايدة تماما و g(1) = 0: g(x) < 0 على ]0 ; 1[ و g(x) > 0 على ]1 ; +∞[.", "II-1) لما x → 0⁺: ln x → −∞ و 1/x → +∞، إذن (ln x)/x → −∞ و −(ln x)/x → +∞.", "ومنه lim (x→0⁺) f(x) = +∞: محور التراتيب (x = 0) مقارب عمودي لـ (Cf).", "لما x → +∞: (ln x)/x → 0 و x − 1 → +∞، إذن lim f = +∞.", "II-2) (ln x / x)' = ((1/x)·x − ln x)/x² = (1 − ln x)/x².", "f'(x) = 1 − (1 − ln x)/x² = (x² − 1 + ln x)/x² = g(x)/x².", "إشارة f'(x) هي إشارة g(x): f متناقصة تماما على ]0 ; 1] ومتزايدة تماما على [1 ; +∞[.", "f(1) = 1 − 1 − 0 = 0 هي القيمة الصغرى لـ f، إذن f(x) ≥ 0 على ]0 ; +∞[.", "II-3) f(x) − (x − 1) = −(ln x)/x → 0 لما x → +∞، إذن (Δ) مقارب مائل عند +∞.", "• على ]0 ; 1[: ln x < 0 فالفرق > 0: (Cf) فوق (Δ).", "• على ]1 ; +∞[: الفرق < 0: (Cf) تحت (Δ). • يتقاطعان في النقطة (1 ; 0).", "II-4) (T) يوازي (Δ) ⇔ f'(x) = 1 ⇔ g(x) = x² ⇔ ln x − 1 = 0 ⇔ x = e.", "f(e) = e − 1 − 1/e، ومنه (T): y = 1·(x − e) + e − 1 − 1/e، أي (T): y = x − 1 − 1/e.", "II-5) على [1 ; e] المستقيم (Δ) فوق (Cf):", "A = ∫ من 1 إلى e لـ [(x − 1) − f(x)] dx = ∫ من 1 إلى e لـ (ln x)/x dx.", "(ln x)/x من الشكل u'·u مع u = ln x، فدالتها الأصلية (ln x)²/2.", "A = [(ln x)²/2] من 1 إلى e = 1/2 − 0 = 1/2 وحدة مساحة."], "answer": "g(1) = 0 ؛ x = 0 مقارب عمودي ؛ f(1) = 0 قيمة صغرى ؛ (T): y = x − 1 − 1/e ؛ A = 1/2 u.a"}, {"id": "math-05a", "chapters": ["المتتاليات العددية", "المتتاليات العددية (الحسابية والهندسية)"], "title": "متتالية حسابية ومتتالية هندسية", "level": "متوسط", "minutes": 25, "statement": ["1) (u_n) متتالية حسابية معرفة على ℕ، حيث u₂ = 11 و u₅ = 20.", "أ) عيّن أساسها r وحدها الأول u₀.", "ب) اكتب u_n بدلالة n، ثم احسب u₂₀.", "ج) احسب المجموع S = u₀ + u₁ + ... + u₂₀.", "د) عيّن أصغر عدد طبيعي n يحقق u_n > 100.", "2) (v_n) متتالية هندسية حدها الأول v₀ = 2 وأساسها q = 3.", "أ) اكتب v_n بدلالة n، واحسب v₄.", "ب) احسب المجموع S' = v₀ + v₁ + ... + v₅.", "3) يدّخر تاجر 1000 DA في الشهر الأول، ثم يزيد ادخاره بـ 200 DA كل شهر.", "كم يدّخر في الشهر الثاني عشر؟ وما مجموع ما يدّخره خلال 12 شهرا؟"], "solution": ["1-أ) u₅ = u₂ + 3r ⇔ 20 = 11 + 3r ⇔ r = 3.", "u₂ = u₀ + 2r ⇔ u₀ = 11 − 6 = 5.", "1-ب) u_n = u₀ + n·r = 5 + 3n، ومنه u₂₀ = 5 + 60 = 65.", "1-ج) المجموع يحوي 21 حدا: S = 21 × (u₀ + u₂₀)/2 = 21 × 70/2 = 735.", "1-د) 5 + 3n > 100 ⇔ n > 95/3 ≈ 31,67، إذن n = 32 (u₃₂ = 101).", "2-أ) v_n = v₀·qⁿ = 2 × 3ⁿ، ومنه v₄ = 2 × 81 = 162.", "2-ب) S' يحوي 6 حدود: S' = v₀ × (q⁶ − 1)/(q − 1) = 2 × (729 − 1)/2 = 728.", "3) المبالغ المدخرة تشكل متتالية حسابية حدها الأول w₁ = 1000 وأساسها 200.", "w₁₂ = 1000 + 11 × 200 = 3200 DA.", "المجموع = 12 × (1000 + 3200)/2 = 25200 DA."], "answer": "r = 3 ، u₀ = 5 ، u_n = 5 + 3n ، u₂₀ = 65 ، S = 735 ، n = 32 ؛ v_n = 2·3ⁿ ، v₄ = 162 ، S' = 728 ؛ 3200 DA و 25200 DA"}, {"id": "math-05b", "chapters": ["المتتاليات العددية", "المتتاليات العددية (الحسابية والهندسية)"], "title": "متتالية تراجعية ومتتالية هندسية مساعدة", "level": "باك", "minutes": 50, "statement": ["(u_n) متتالية معرفة بـ: u₀ = 3، ومن أجل كل n من ℕ: u_(n+1) = (3u_n + 2)/(u_n + 4).", "نعتبر الدالة f المعرفة على ]−4 ; +∞[ بـ: f(x) = (3x + 2)/(x + 4).", "1) بيّن أن f متزايدة تماما على ]−4 ; +∞[، واحسب u₁ و u₂.", "2) برهن بالتراجع أنه من أجل كل n من ℕ: 1 < u_n ≤ 3.", "3) أ) بيّن أن: u_(n+1) − u_n = −(u_n − 1)(u_n + 2)/(u_n + 4).", "ب) استنتج أن (u_n) متناقصة، ثم أنها متقاربة.", "4) نضع من أجل كل n من ℕ: v_n = (u_n − 1)/(u_n + 2).", "أ) بيّن أن (v_n) متتالية هندسية أساسها 2/5، وعيّن حدها الأول v₀.", "ب) اكتب v_n ثم u_n بدلالة n، واحسب lim u_n.", "ج) احسب بدلالة n المجموع S_n = v₀ + v₁ + ... + v_n."], "solution": ["1) f'(x) = (3(x + 4) − (3x + 2))/(x + 4)² = 10/(x + 4)² > 0: f متزايدة تماما.", "u₁ = (9 + 2)/(3 + 4) = 11/7 ، u₂ = (33/7 + 2)/(11/7 + 4) = (47/7)/(39/7) = 47/39.", "2) التحقق: u₀ = 3 و 1 < 3 ≤ 3 صحيحة.", "الوراثة: نفرض 1 < u_n ≤ 3. بما أن f متزايدة تماما: f(1) < f(u_n) ≤ f(3).", "f(1) = 5/5 = 1 و f(3) = 11/7 ≤ 3، إذن 1 < u_(n+1) ≤ 3.", "الخلاصة: من أجل كل n من ℕ: 1 < u_n ≤ 3.", "3-أ) u_(n+1) − u_n = (3u_n + 2 − u_n² − 4u_n)/(u_n + 4) = −(u_n² + u_n − 2)/(u_n + 4)", "= −(u_n − 1)(u_n + 2)/(u_n + 4).", "3-ب) بما أن u_n > 1: (u_n − 1) > 0 و (u_n + 2) > 0 و (u_n + 4) > 0، إذن u_(n+1) − u_n < 0.", "(u_n) متناقصة ومحدودة من الأسفل بـ 1، إذن هي متقاربة.", "4-أ) u_(n+1) − 1 = (2u_n − 2)/(u_n + 4) = 2(u_n − 1)/(u_n + 4)", "u_(n+1) + 2 = (5u_n + 10)/(u_n + 4) = 5(u_n + 2)/(u_n + 4)", "v_(n+1) = 2(u_n − 1)/(5(u_n + 2)) = (2/5)·v_n.", "(v_n) هندسية أساسها 2/5 وحدها الأول v₀ = (3 − 1)/(3 + 2) = 2/5.", "4-ب) v_n = (2/5)·(2/5)ⁿ = (2/5)^(n+1).", "من v_n(u_n + 2) = u_n − 1 نجد: u_n = (1 + 2v_n)/(1 − v_n)،", "أي u_n = (1 + 2(2/5)^(n+1))/(1 − (2/5)^(n+1)).", "بما أن 0 < 2/5 < 1 فإن (2/5)^(n+1) → 0، إذن lim u_n = 1.", "4-ج) S_n = v₀ × (1 − (2/5)^(n+1))/(1 − 2/5) = (2/5)/(3/5) × (1 − (2/5)^(n+1))", "S_n = (2/3)(1 − (2/5)^(n+1))."], "answer": "u₁ = 11/7 ، u₂ = 47/39 ؛ v_n = (2/5)^(n+1) ؛ u_n = (1 + 2v_n)/(1 − v_n) ؛ lim u_n = 1 ؛ S_n = (2/3)(1 − (2/5)^(n+1))"}, {"id": "math-06a", "chapters": ["الدوال الأصلية والحساب التكاملي"], "title": "دوال أصلية وحساب تكاملات", "level": "متوسط", "minutes": 20, "statement": ["1) عيّن الدالة الأصلية F للدالة f(x) = 3x² − 4x + 1 على ℝ والتي تحقق F(1) = 2.", "2) احسب التكاملات التالية:", "أ) I = ∫ من 0 إلى 1 لـ (2x + 1)·e^(x² + x) dx", "ب) J = ∫ من 1 إلى e لـ (2/x) dx", "ج) K = ∫ من 0 إلى 1 لـ x/(x² + 1) dx", "3) احسب القيمة المتوسطة للدالة g(x) = x² على المجال [0 ; 3]."], "solution": ["1) الدوال الأصلية لـ f هي: F(x) = x³ − 2x² + x + c (c ثابت حقيقي).", "F(1) = 1 − 2 + 1 + c = c = 2، إذن F(x) = x³ − 2x² + x + 2.", "2-أ) الدالة من الشكل u'·e^u مع u(x) = x² + x، فدالتها الأصلية e^(x² + x).", "I = e^(1 + 1) − e^0 = e² − 1 ≈ 6,39.", "2-ب) J = [2 ln x] من 1 إلى e = 2 ln e − 2 ln 1 = 2.", "2-ج) x/(x² + 1) = (1/2) × 2x/(x² + 1) من الشكل (1/2)·u'/u مع u = x² + 1 > 0.", "K = [(1/2) ln(x² + 1)] من 0 إلى 1 = (1/2) ln 2 ≈ 0,35.", "3) القيمة المتوسطة: μ = (1/(3 − 0)) × ∫ من 0 إلى 3 لـ x² dx = (1/3) × [x³/3] من 0 إلى 3 = (1/3) × 9 = 3."], "answer": "F(x) = x³ − 2x² + x + 2 ؛ I = e² − 1 ؛ J = 2 ؛ K = (1/2)ln 2 ؛ μ = 3"}, {"id": "math-06b", "chapters": ["الدوال الأصلية والحساب التكاملي"], "title": "التكامل بالتجزئة، مساحة ومتتالية تكاملات", "level": "باك", "minutes": 50, "statement": ["الجزء الأول:", "1) تحقق أن F(x) = (x − 1)e^x دالة أصلية للدالة x ↦ x·e^x على ℝ، ثم احسب A = ∫ من 0 إلى 1 لـ x·e^x dx.", "2) باستعمال التكامل بالتجزئة، احسب B = ∫ من 1 إلى e لـ x·ln x dx.", "3) في معلم متعامد ومتجانس وحدة الطول فيه 2 cm، احسب بالـ cm² مساحة الحيز المحدد بالمنحنى y = x² والمستقيم y = 2x.", "الجزء الثاني: من أجل كل عدد طبيعي n نضع: J_n = ∫ من 0 إلى 1 لـ xⁿ/(1 + x) dx.", "1) احسب J₀.", "2) بيّن أن J_n + J_(n+1) = 1/(n + 1)، واستنتج J₁ و J₂.", "3) بيّن أنه من أجل كل n: 0 ≤ J_n ≤ 1/(n + 1)، ثم استنتج lim J_n."], "solution": ["I-1) F'(x) = 1·e^x + (x − 1)e^x = x·e^x. إذن F دالة أصلية لـ x·e^x.", "A = F(1) − F(0) = 0 − (−1) = 1.", "I-2) نضع u(x) = ln x ⇒ u'(x) = 1/x ، و v'(x) = x ⇒ v(x) = x²/2.", "B = [(x²/2)·ln x] من 1 إلى e − ∫ من 1 إلى e لـ (x²/2)(1/x) dx", "= e²/2 − ∫ من 1 إلى e لـ (x/2) dx = e²/2 − [x²/4] من 1 إلى e", "= e²/2 − e²/4 + 1/4 = (e² + 1)/4 ≈ 2,10.", "I-3) نقط التقاطع: x² = 2x ⇔ x(x − 2) = 0 ⇔ x = 0 أو x = 2.", "على [0 ; 2]: 2x ≥ x². المساحة = ∫ من 0 إلى 2 لـ (2x − x²) dx = [x² − x³/3] من 0 إلى 2 = 4 − 8/3 = 4/3 u.a.", "وحدة المساحة = 2 cm × 2 cm = 4 cm²، إذن المساحة = (4/3) × 4 = 16/3 ≈ 5,33 cm².", "II-1) J₀ = ∫ من 0 إلى 1 لـ 1/(1 + x) dx = [ln(1 + x)] من 0 إلى 1 = ln 2.", "II-2) J_n + J_(n+1) = ∫ من 0 إلى 1 لـ (xⁿ + x^(n+1))/(1 + x) dx = ∫ من 0 إلى 1 لـ xⁿ(1 + x)/(1 + x) dx", "= ∫ من 0 إلى 1 لـ xⁿ dx = [x^(n+1)/(n + 1)] من 0 إلى 1 = 1/(n + 1).", "n = 0: J₁ = 1 − J₀ = 1 − ln 2 ≈ 0,307.", "n = 1: J₂ = 1/2 − J₁ = ln 2 − 1/2 ≈ 0,193.", "II-3) من أجل x ∈ [0 ; 1]: xⁿ ≥ 0 و 1 + x ≥ 1، إذن 0 ≤ xⁿ/(1 + x) ≤ xⁿ.", "بالمكاملة على [0 ; 1] (الحدان مرتبان): 0 ≤ J_n ≤ ∫ من 0 إلى 1 لـ xⁿ dx = 1/(n + 1).", "بما أن lim 1/(n + 1) = 0، فحسب مبرهنة الحصر: lim J_n = 0."], "answer": "A = 1 ؛ B = (e² + 1)/4 ؛ المساحة = 4/3 u.a = 16/3 cm² ؛ J₀ = ln 2 ، J₁ = 1 − ln 2 ، J₂ = ln 2 − 1/2 ؛ lim J_n = 0"}, {"id": "math-07a", "chapters": ["الأعداد المركبة والتحويلات النقطية"], "title": "الشكل الجبري والمثلثي لعدد مركب", "level": "متوسط", "minutes": 25, "statement": ["نعتبر العددين المركبين: z₁ = 1 + i√3 و z₂ = 1 − i.", "1) اكتب كلا من z₁ و z₂ على الشكل المثلثي.", "2) اكتب z₁ × z₂ على الشكل الجبري ثم على الشكل المثلثي.", "3) استنتج القيمتين المضبوطتين لـ cos(π/12) و sin(π/12).", "4) حل في ℂ المعادلة: z² − 2z + 4 = 0.", "5) احسب z₁⁶."], "solution": ["1) |z₁| = √(1 + 3) = 2، و cos θ = 1/2 ، sin θ = √3/2 ⇒ θ = π/3.", "z₁ = 2(cos(π/3) + i·sin(π/3)).", "|z₂| = √(1 + 1) = √2، و cos θ' = √2/2 ، sin θ' = −√2/2 ⇒ θ' = −π/4.", "z₂ = √2(cos(−π/4) + i·sin(−π/4)).", "2) z₁z₂ = 1 − i + i√3 − i²√3 = (1 + √3) + i(√3 − 1).", "|z₁z₂| = 2 × √2 = 2√2، و arg(z₁z₂) = π/3 − π/4 = π/12.", "z₁z₂ = 2√2(cos(π/12) + i·sin(π/12)).", "3) بالمطابقة بين الشكلين:", "2√2·cos(π/12) = 1 + √3 ⇒ cos(π/12) = (1 + √3)/(2√2) = (√6 + √2)/4.", "2√2·sin(π/12) = √3 − 1 ⇒ sin(π/12) = (√3 − 1)/(2√2) = (√6 − √2)/4.", "4) Δ = (−2)² − 4 × 4 = −12 = (2i√3)².", "z' = (2 − 2i√3)/2 = 1 − i√3 و z'' = (2 + 2i√3)/2 = 1 + i√3. (لاحظ أن z'' = z₁)", "5) حسب دستور موافر: z₁⁶ = 2⁶(cos(6π/3) + i·sin(6π/3)) = 64(cos 2π + i·sin 2π) = 64."], "answer": "z₁ = 2e^(iπ/3) ، z₂ = √2·e^(−iπ/4) ؛ z₁z₂ = (1 + √3) + i(√3 − 1) ؛ cos(π/12) = (√6 + √2)/4 ؛ S = {1 − i√3 ; 1 + i√3} ؛ z₁⁶ = 64"}, {"id": "math-07b", "chapters": ["الأعداد المركبة والتحويلات النقطية"], "title": "معادلة من الدرجة الثالثة، دوران وتشابه مباشر", "level": "باك", "minutes": 55, "statement": ["1) أ) تحقق أنه من أجل كل عدد مركب z: z³ − 4z² + 6z − 4 = (z − 2)(z² − 2z + 2).", "ب) حل في ℂ المعادلة: z³ − 4z² + 6z − 4 = 0.", "2) في المستوي المنسوب إلى معلم متعامد ومتجانس (O ; u , v)، نعتبر النقط A و B و C ذات اللواحق: z_A = 2 ، z_B = 1 + i ، z_C = 1 − i.", "أ) اكتب العدد (z_B − z_A)/(z_C − z_A) على الشكل الجبري، واستنتج طبيعة المثلث ABC.", "ب) عيّن لاحقة النقطة D حتى يكون الرباعي ABDC مربعا.", "3) R الدوران الذي مركزه A وزاويته π/2.", "أ) اكتب العبارة المركبة للدوران R.", "ب) تحقق أن صورة النقطة B بالدوران R هي C.", "4) S التحويل النقطي الذي يرفق بكل نقطة M ذات اللاحقة z النقطة M' ذات اللاحقة z' = (1 + i)z − 2i.", "أ) بيّن أن S تشابه مباشر، وعيّن عناصره المميزة.", "ب) عيّن صورة النقطة B بالتشابه S.", "5) عيّن مجموعة النقط M ذات اللاحقة z التي تحقق: |z − 1 − i| = |z − 1 + i|.", "6) عيّن قيم العدد الطبيعي n التي يكون من أجلها (z_B)ⁿ عددا حقيقيا."], "solution": ["1-أ) (z − 2)(z² − 2z + 2) = z³ − 2z² + 2z − 2z² + 4z − 4 = z³ − 4z² + 6z − 4.", "1-ب) z − 2 = 0 ⇔ z = 2. أو z² − 2z + 2 = 0: Δ = 4 − 8 = −4 = (2i)²، ومنه z = 1 − i أو z = 1 + i.", "S = {2 ; 1 + i ; 1 − i}.", "2-أ) (z_B − z_A)/(z_C − z_A) = (−1 + i)/(−1 − i) = (−1 + i)²/((−1)² + 1²) = (1 − 2i − 1)/2 = −i.", "|−i| = 1 ⇒ AB = AC ، و arg(−i) = −π/2 ⇒ (AC→ , AB→) = −π/2.", "إذن المثلث ABC قائم ومتساوي الساقين في A.", "2-ب) ABDC مربع ⇔ AB→ = CD→ (مع ABC قائم ومتساوي الساقين في A).", "z_D = z_B + z_C − z_A = 1 + i + 1 − i − 2 = 0، إذن D هي المبدأ O.", "3-أ) z' − z_A = e^(iπ/2)(z − z_A) ⇔ z' − 2 = i(z − 2) ⇔ z' = iz + 2 − 2i.", "3-ب) i(1 + i) + 2 − 2i = i − 1 + 2 − 2i = 1 − i = z_C، إذن R(B) = C.", "4-أ) S من الشكل z' = az + b مع a = 1 + i (a ≠ 0 و a ≠ 1)، فهو تشابه مباشر.", "المركز: z = (1 + i)z − 2i ⇔ −iz = −2i ⇔ z = 2، أي المركز هو A.", "النسبة: |1 + i| = √2 ، الزاوية: arg(1 + i) = π/4.", "4-ب) (1 + i)(1 + i) − 2i = 2i − 2i = 0، إذن S(B) = O = D.", "5) |z − z_B| = |z − z_C| ⇔ MB = MC: المجموعة هي محور القطعة [BC].", "B و C متناظرتان بالنسبة لمحور الفواصل، إذن المجموعة هي محور الفواصل (محور الأعداد الحقيقية).", "6) z_B = √2·e^(iπ/4)، ومنه (z_B)ⁿ = (√2)ⁿ·e^(inπ/4).", "(z_B)ⁿ حقيقي ⇔ nπ/4 = kπ (k ∈ ℤ) ⇔ n = 4k، أي n مضاعف لـ 4.", "مثال: (1 + i)⁴ = −4 و (1 + i)⁸ = 16."], "answer": "S = {2 ; 1 + i ; 1 − i} ؛ ABC قائم ومتساوي الساقين في A ؛ z_D = 0 ؛ R: z' = iz + 2 − 2i ؛ S تشابه مركزه A نسبته √2 وزاويته π/4 ، S(B) = O ؛ المجموعة: محور الفواصل ؛ n = 4k"}, {"id": "math-08a", "chapters": ["الهندسة في الفضاء"], "title": "مستوٍ، مسافة ومسقط عمودي", "level": "متوسط", "minutes": 30, "statement": ["في الفضاء المنسوب إلى معلم متعامد ومتجانس (O ; i , j , k)، نعتبر النقط: A(1 ; 2 ; −1) ، B(3 ; 0 ; 1) ، C(2 ; 3 ; 1) ، D(7 ; 0 ; 0).", "1) بيّن أن النقط A و B و C تعيّن مستويا.", "2) أ) تحقق أن الشعاع n(3 ; 1 ; −2) ناظمي للمستوي (ABC).", "ب) استنتج أن معادلة ديكارتية للمستوي (ABC) هي: 3x + y − 2z − 7 = 0.", "3) احسب المسافة بين النقطة D والمستوي (ABC).", "4) اكتب تمثيلا وسيطيا للمستقيم (Δ) المار بـ D والعمودي على (ABC)، ثم عيّن إحداثيات H المسقط العمودي لـ D على (ABC).", "5) علما أن مساحة المثلث ABC تساوي √14 وحدة مساحة، احسب حجم رباعي الوجوه DABC."], "solution": ["1) AB→(2 ; −2 ; 2) و AC→(1 ; 1 ; 2).", "2/1 ≠ −2/1، إذن الشعاعان غير مرتبطين خطيا: النقط A و B و C ليست في استقامية وتعيّن مستويا.", "2-أ) n·AB→ = 6 − 2 − 4 = 0 و n·AC→ = 3 + 1 − 4 = 0.", "n عمودي على شعاعين غير مرتبطين خطيا من المستوي، إذن هو ناظمي لـ (ABC).", "2-ب) (ABC): 3x + y − 2z + d = 0. A ∈ (ABC): 3 + 2 + 2 + d = 0 ⇒ d = −7.", "تحقق: B: 9 + 0 − 2 − 7 = 0 ✓ ، C: 6 + 3 − 2 − 7 = 0 ✓.", "3) d(D ; (ABC)) = |3×7 + 0 − 0 − 7|/√(9 + 1 + 4) = 14/√14 = √14.", "4) (Δ) يوجهه n: x = 7 + 3t ، y = t ، z = −2t (t ∈ ℝ).", "H نقطة تقاطع (Δ) و (ABC): 3(7 + 3t) + t − 2(−2t) − 7 = 0 ⇔ 14 + 14t = 0 ⇔ t = −1.", "H(4 ; −1 ; 2). تحقق: DH = √(9 + 1 + 4) = √14 ✓.", "5) V = (1/3) × مساحة القاعدة × الارتفاع = (1/3) × √14 × √14 = 14/3 وحدة حجم."], "answer": "(ABC): 3x + y − 2z − 7 = 0 ؛ المسافة = √14 ؛ H(4 ; −1 ; 2) ؛ V = 14/3 u.v"}, {"id": "math-08b", "chapters": ["الهندسة في الفضاء"], "title": "سطح كرة، مستويات ومستقيمات في الفضاء", "level": "باك", "minutes": 50, "statement": ["في الفضاء المنسوب إلى معلم متعامد ومتجانس (O ; i , j , k)، نعتبر:", "• سطح الكرة (S) ذا المعادلة: x² + y² + z² − 2x + 4y − 6z − 11 = 0", "• المستوي (P) ذا المعادلة: 2x − y + 2z − 1 = 0", "• المستوي (Q) ذا المعادلة: x + 2y − 3 = 0", "• المستقيم (D) ذا التمثيل الوسيطي: x = t ، y = 1 + t ، z = 2 − t (t ∈ ℝ)", "1) عيّن إحداثيات Ω مركز (S) ونصف قطرها R.", "2) أ) احسب المسافة بين Ω والمستوي (P)، واستنتج أن (P) يقطع (S) وفق دائرة (Γ).", "ب) عيّن نصف قطر (Γ) وإحداثيات مركزها H.", "3) أ) بيّن أن المستويين (P) و (Q) متعامدان.", "ب) تحقق أن المستقيم (L): x = 1 − 4s ، y = 1 + 2s ، z = 5s (s ∈ ℝ) هو تقاطع (P) و (Q).", "4) عيّن إحداثيات نقطة تقاطع المستقيم (D) مع المستوي (P).", "5) هل يقطع المستوي (Q) سطح الكرة (S)؟ علّل."], "solution": ["1) نكمل المربعات: (x − 1)² − 1 + (y + 2)² − 4 + (z − 3)² − 9 − 11 = 0", "⇔ (x − 1)² + (y + 2)² + (z − 3)² = 25. إذن Ω(1 ; −2 ; 3) و R = 5.", "2-أ) d(Ω ; (P)) = |2 + 2 + 6 − 1|/√(4 + 1 + 4) = 9/3 = 3.", "بما أن 3 < 5 = R، فإن (P) يقطع (S) وفق دائرة (Γ).", "2-ب) نصف القطر: r = √(R² − d²) = √(25 − 9) = 4.", "المركز H هو المسقط العمودي لـ Ω على (P): المستقيم المار بـ Ω والموجه بـ n_P(2 ; −1 ; 2):", "x = 1 + 2k ، y = −2 − k ، z = 3 + 2k. نعوض في (P): 2 + 4k + 2 + k + 6 + 4k − 1 = 0 ⇔ 9 + 9k = 0 ⇔ k = −1.", "H(−1 ; −1 ; 1).", "3-أ) n_P(2 ; −1 ; 2) و n_Q(1 ; 2 ; 0): n_P·n_Q = 2 − 2 + 0 = 0، إذن (P) ⊥ (Q).", "3-ب) في (P): 2(1 − 4s) − (1 + 2s) + 2(5s) − 1 = 2 − 8s − 1 − 2s + 10s − 1 = 0 ✓.", "في (Q): (1 − 4s) + 2(1 + 2s) − 3 = 0 ✓.", "(L) محتوى في المستويين غير المتوازيين، إذن (L) هو مستقيم تقاطعهما.", "4) نعوض في (P): 2t − (1 + t) + 2(2 − t) − 1 = 0 ⇔ −t + 2 = 0 ⇔ t = 2.", "نقطة التقاطع: (2 ; 3 ; 0).", "5) d(Ω ; (Q)) = |1 − 4 − 3|/√(1 + 4) = 6/√5 ≈ 2,68 < 5.", "إذن (Q) يقطع (S) وفق دائرة نصف قطرها √(25 − 36/5) = √(89/5) ≈ 4,22."], "answer": "Ω(1 ; −2 ; 3) ، R = 5 ؛ d = 3 ، r = 4 ، H(−1 ; −1 ; 1) ؛ (P) ⊥ (Q) ؛ (D) ∩ (P) = {(2 ; 3 ; 0)} ؛ نعم لأن 6/√5 < 5"}, {"id": "math-09a", "chapters": ["الاحتمالات", "الإحصاء والاحتمالات"], "title": "سحب كريات في آن واحد ومتغير عشوائي", "level": "متوسط", "minutes": 25, "statement": ["يحتوي كيس على 8 كريات متماثلة لا نفرق بينها باللمس: 4 حمراء، 3 خضراء، 1 بيضاء.", "نسحب عشوائيا وفي آن واحد كريتين.", "1) ما عدد السحبات الممكنة؟", "2) احسب احتمال كل من الحادثتين:", "A: «الكريتان من نفس اللون» ، B: «الحصول على كرية حمراء على الأقل».", "3) X المتغير العشوائي الذي يرفق بكل سحب عدد الكريات الحمراء المسحوبة.", "أ) عيّن قيم X الممكنة، ثم عرّف قانون احتماله.", "ب) احسب الأمل الرياضياتي E(X)."], "solution": ["1) عدد السحبات الممكنة: C(8 , 2) = (8 × 7)/2 = 28.", "2) A: كريتان حمراوان C(4 , 2) = 6 أو خضراوان C(3 , 2) = 3 (البيضاء واحدة فقط).", "P(A) = (6 + 3)/28 = 9/28.", "الحادثة العكسية لـ B: «لا توجد كرية حمراء»، أي السحب من الكريات الأربع غير الحمراء: C(4 , 2) = 6.", "P(B) = 1 − 6/28 = 22/28 = 11/14.", "3-أ) X ∈ {0 ; 1 ; 2}.", "P(X = 0) = C(4 , 2)/28 = 6/28 = 3/14", "P(X = 1) = (C(4 , 1) × C(4 , 1))/28 = 16/28 = 4/7", "P(X = 2) = C(4 , 2)/28 = 6/28 = 3/14", "تحقق: 3/14 + 8/14 + 3/14 = 1 ✓.", "3-ب) E(X) = 0 × 3/14 + 1 × 4/7 + 2 × 3/14 = 4/7 + 3/7 = 1."], "answer": "28 سحبا ؛ P(A) = 9/28 ؛ P(B) = 11/14 ؛ قانون X: 3/14 ، 4/7 ، 3/14 ؛ E(X) = 1"}, {"id": "math-09b", "chapters": ["الاحتمالات", "الإحصاء والاحتمالات"], "title": "احتمالات شرطية وقانون ثنائي الحد في مصنع", "level": "باك", "minutes": 45, "statement": ["ينتج مصنع علبا كرتونية بآلتين M₁ و M₂. الآلة M₁ تنتج 60% من العلب، و M₂ تنتج الباقي.", "نسبة العلب المعيبة: 3% من إنتاج M₁ و 5% من إنتاج M₂.", "نختار عشوائيا علبة من الإنتاج، ونسمي الحوادث:", "M₁: «العلبة من إنتاج M₁» ، M₂: «العلبة من إنتاج M₂» ، D: «العلبة معيبة».", "1) أنشئ شجرة الاحتمالات الموافقة.", "2) احسب P(M₁ ∩ D)، ثم بيّن أن P(D) = 0,038.", "3) علما أن العلبة المختارة معيبة، ما احتمال أن تكون من إنتاج M₂؟", "4) نختار عشوائيا 5 علب (نعتبر الاختيارات مستقلة). X عدد العلب المعيبة من بينها.", "أ) ما قانون احتمال X؟ علّل.", "ب) احسب P(X = 0) و P(X ≥ 1) (تدوّر النتائج إلى 10⁻³).", "ج) احسب الأمل الرياضياتي E(X).", "5) يربح المصنع 50 DA عن كل علبة سليمة ويخسر 120 DA عن كل علبة معيبة.", "Y الربح الجبري عن علبة واحدة. احسب E(Y)."], "solution": ["1) الشجرة: M₁ (0,6) ← D (0,03) و D̄ (0,97) ؛ M₂ (0,4) ← D (0,05) و D̄ (0,95).", "2) P(M₁ ∩ D) = P(M₁) × P_M₁(D) = 0,6 × 0,03 = 0,018.", "P(M₂ ∩ D) = 0,4 × 0,05 = 0,02.", "حسب دستور الاحتمالات الكلية: P(D) = 0,018 + 0,02 = 0,038.", "3) P_D(M₂) = P(M₂ ∩ D)/P(D) = 0,02/0,038 = 10/19 ≈ 0,526.", "4-أ) نكرر 5 مرات بصفة مستقلة تجربة لها مخرجان: «معيبة» باحتمال p = 0,038 أو «سليمة».", "إذن X يتبع قانون ثنائي الحد B(5 ; 0,038):", "P(X = k) = C(5 , k) × (0,038)^k × (0,962)^(5 − k) ، k ∈ {0 ; 1 ; ... ; 5}.", "4-ب) P(X = 0) = (0,962)⁵ ≈ 0,824.", "P(X ≥ 1) = 1 − P(X = 0) ≈ 1 − 0,824 = 0,176.", "4-ج) E(X) = n × p = 5 × 0,038 = 0,19.", "5) Y يأخذ القيمتين 50 (باحتمال 0,962) و −120 (باحتمال 0,038).", "E(Y) = 50 × 0,962 + (−120) × 0,038 = 48,1 − 4,56 = 43,54 DA."], "answer": "P(M₁ ∩ D) = 0,018 ؛ P(D) = 0,038 ؛ P_D(M₂) = 10/19 ≈ 0,526 ؛ X ~ B(5 ; 0,038) ؛ P(X = 0) ≈ 0,824 ، P(X ≥ 1) ≈ 0,176 ؛ E(X) = 0,19 ؛ E(Y) = 43,54 DA"}, {"id": "math-10a", "chapters": ["الحساب في Z: القسمة الإقليدية، القاسم المشترك الأكبر، الموافقات", "الحساب في Z: القسمة الإقليدية والموافقات"], "title": "القسمة الإقليدية والموافقات", "level": "متوسط", "minutes": 25, "statement": ["1) أ) عيّن حاصل وباقي القسمة الإقليدية للعدد 1386 على 546.", "ب) باستعمال خوارزمية إقليدس، عيّن PGCD(1386 ; 546).", "2) أ) ادرس، حسب قيم العدد الطبيعي n، بواقي القسمة الإقليدية للعدد 5ⁿ على 7.", "ب) استنتج باقي قسمة 5^2026 على 7.", "3) عيّن الأعداد الطبيعية n التي تحقق: 3n + 5 ≡ 0 [7].", "4) كان يوم 1 نوفمبر 2026 يوم أحد. ما هو يوم الأسبوع بعد 100 يوم من هذا التاريخ؟"], "solution": ["1-أ) 1386 = 546 × 2 + 294 مع 0 ≤ 294 < 546: الحاصل 2 والباقي 294.", "1-ب) 1386 = 2 × 546 + 294", "546 = 1 × 294 + 252", "294 = 1 × 252 + 42", "252 = 6 × 42 + 0", "آخر باقٍ غير معدوم هو 42، إذن PGCD(1386 ; 546) = 42.", "2-أ) 5⁰ ≡ 1 ، 5¹ ≡ 5 ، 5² = 25 ≡ 4 ، 5³ ≡ 4 × 5 = 20 ≡ 6 ، 5⁴ ≡ 30 ≡ 2 ، 5⁵ ≡ 10 ≡ 3 ، 5⁶ ≡ 15 ≡ 1 [7].", "البواقي دورية دورها 6: من أجل k ∈ ℕ:", "n = 6k → 1 ، 6k + 1 → 5 ، 6k + 2 → 4 ، 6k + 3 → 6 ، 6k + 4 → 2 ، 6k + 5 → 3.", "2-ب) 2026 = 6 × 337 + 4، إذن 5^2026 ≡ 5⁴ ≡ 2 [7]. الباقي 2.", "3) 3n + 5 ≡ 0 [7] ⇔ 3n ≡ −5 ≡ 2 [7].", "نضرب الطرفين في 5 (لأن 3 × 5 = 15 ≡ 1 [7]): n ≡ 10 ≡ 3 [7].", "إذن n = 7k + 3 مع k ∈ ℕ.", "4) 100 = 7 × 14 + 2، إذن 100 ≡ 2 [7]: بعد 100 يوم نتقدم يومين في الأسبوع.", "الأحد + 2 = الثلاثاء (يوافق 9 فيفري 2027)."], "answer": "1386 = 546 × 2 + 294 ؛ PGCD = 42 ؛ دور البواقي 6 ؛ 5^2026 ≡ 2 [7] ؛ n = 7k + 3 ؛ يوم الثلاثاء"}, {"id": "math-10b", "chapters": ["الحساب في Z: القسمة الإقليدية، القاسم المشترك الأكبر، الموافقات", "الحساب في Z: القسمة الإقليدية والموافقات"], "title": "معادلة ديوفانتية، PGCD وبواقي القوى", "level": "باك", "minutes": 50, "statement": ["1) نعتبر في ℤ² المعادلة (E): 11x − 7y = 5.", "أ) تحقق أن الثنائية (3 ; 4) حل للمعادلة (E).", "ب) حل في ℤ² المعادلة (E).", "2) ليكن (x ; y) حلا للمعادلة (E)، و d = PGCD(x ; y).", "أ) بيّن أن القيم الممكنة لـ d هي 1 و 5.", "ب) عيّن الحلول (x ; y) للمعادلة (E) التي يكون من أجلها d = 5.", "3) أ) ادرس، حسب قيم العدد الطبيعي n، بواقي القسمة الإقليدية لـ 3ⁿ على 11.", "ب) استنتج باقي قسمة 2027^2026 على 11.", "ج) عيّن الأعداد الطبيعية n التي يكون من أجلها: 3ⁿ + 7 ≡ 0 [11]."], "solution": ["1-أ) 11 × 3 − 7 × 4 = 33 − 28 = 5 ✓.", "1-ب) بطرح المساواتين: 11x − 7y = 11 × 3 − 7 × 4 ⇔ 11(x − 3) = 7(y − 4).", "7 يقسم 11(x − 3) و PGCD(7 ; 11) = 1، إذن حسب مبرهنة غوص: 7 يقسم (x − 3)، أي x = 3 + 7k (k ∈ ℤ).", "بالتعويض: 11 × 7k = 7(y − 4) ⇒ y = 4 + 11k.", "عكسيا: 11(3 + 7k) − 7(4 + 11k) = 33 − 28 = 5 ✓.", "S = {(3 + 7k ; 4 + 11k) ، k ∈ ℤ}.", "2-أ) d يقسم x و y، إذن d يقسم 11x − 7y = 5، ومنه d ∈ {1 ; 5}.", "2-ب) d = 5 ⇔ 5 يقسم x و 5 يقسم y.", "x = 3 + 7k ≡ 3 + 2k [5]: 3 + 2k ≡ 0 ⇔ 2k ≡ 2 ⇔ k ≡ 1 [5].", "y = 4 + 11k ≡ 4 + k [5]: 4 + k ≡ 0 ⇔ k ≡ 1 [5]. (الشرطان متوافقان)", "إذن k = 5m + 1 (m ∈ ℤ)، والحلول: (x ; y) = (10 + 35m ; 15 + 55m).", "3-أ) 3¹ ≡ 3 ، 3² ≡ 9 ، 3³ = 27 ≡ 5 ، 3⁴ ≡ 15 ≡ 4 ، 3⁵ ≡ 12 ≡ 1 [11].", "البواقي دورية دورها 5: من أجل k ∈ ℕ:", "n = 5k → 1 ، 5k + 1 → 3 ، 5k + 2 → 9 ، 5k + 3 → 5 ، 5k + 4 → 4.", "3-ب) 2027 = 11 × 184 + 3، إذن 2027 ≡ 3 [11]، و 2026 = 5 × 405 + 1.", "2027^2026 ≡ 3^2026 ≡ 3¹ ≡ 3 [11]. الباقي 3.", "3-ج) 3ⁿ + 7 ≡ 0 [11] ⇔ 3ⁿ ≡ −7 ≡ 4 [11] ⇔ n = 5k + 4 (k ∈ ℕ)."], "answer": "S = {(3 + 7k ; 4 + 11k)} ؛ d ∈ {1 ; 5} ؛ d = 5 ⇔ (x ; y) = (10 + 35m ; 15 + 55m) ؛ دور بواقي 3ⁿ هو 5 ؛ الباقي 3 ؛ n = 5k + 4"}, {"id": "math-11a", "chapters": ["الإحصاء: السلاسل الإحصائية ذات متغيرين (التعديل الخطي)", "الإحصاء والاحتمالات"], "title": "سلسلة إحصائية ذات متغيرين: التعديل الخطي", "level": "متوسط", "minutes": 25, "statement": ["يمثل الجدول التالي عدد العلب الكرتونية المبيعة y (بالآلاف) من طرف مؤسسة خلال 6 سنوات متتالية، حيث x رتبة السنة:", "x_i : 1 ، 2 ، 3 ، 4 ، 5 ، 6", "y_i : 12 ، 15 ، 17 ، 20 ، 24 ، 26", "1) مثّل سحابة النقط M_i(x_i ; y_i) في معلم متعامد. هل يبرر شكلها تعديلا خطيا؟", "2) احسب إحداثيي النقطة المتوسطة G.", "3) احسب التباين V(x) والتغاير cov(x ; y).", "4) استنتج معادلة مستقيم الانحدار (D) لـ y بالنسبة إلى x بطريقة المربعات الدنيا (تدوّر المعاملات إلى 10⁻²).", "5) قدّر عدد العلب المبيعة في السنة الثامنة."], "solution": ["1) النقط تكاد تكون على استقامة واحدة، إذن التعديل الخطي مبرر.", "2) x̄ = (1 + 2 + ... + 6)/6 = 21/6 = 3,5.", "ȳ = (12 + 15 + 17 + 20 + 24 + 26)/6 = 114/6 = 19. إذن G(3,5 ; 19).", "3) Σx_i² = 1 + 4 + 9 + 16 + 25 + 36 = 91.", "V(x) = 91/6 − 3,5² = 15,1667 − 12,25 = 35/12 ≈ 2,92.", "Σx_i·y_i = 12 + 30 + 51 + 80 + 120 + 156 = 449.", "cov(x ; y) = 449/6 − 3,5 × 19 = 74,833 − 66,5 = 25/3 ≈ 8,33.", "4) a = cov(x ; y)/V(x) = (25/3)/(35/12) = 20/7 ≈ 2,86.", "b = ȳ − a·x̄ = 19 − (20/7) × 3,5 = 19 − 10 = 9.", "(D): y = 2,86x + 9.", "5) من أجل x = 8: y ≈ 2,86 × 8 + 9 ≈ 31,9، أي حوالي 31 900 علبة."], "answer": "G(3,5 ; 19) ؛ V(x) = 35/12 ≈ 2,92 ؛ cov = 25/3 ≈ 8,33 ؛ (D): y = 2,86x + 9 ؛ التقدير ≈ 31,9 ألف علبة"}, {"id": "math-11b", "chapters": ["الإحصاء: السلاسل الإحصائية ذات متغيرين (التعديل الخطي)", "الإحصاء والاحتمالات"], "title": "تعديل أسي بتغيير المتغير z = ln y", "level": "باك", "minutes": 45, "statement": ["يمثل الجدول التالي تطور عدد المشتركين y (بالآلاف) في تطبيق للمراجعة خلال 6 أشهر، حيث x رتبة الشهر:", "x_i : 1 ، 2 ، 3 ، 4 ، 5 ، 6", "y_i : 2,1 ، 3,0 ، 4,4 ، 6,3 ، 9,2 ، 13,5", "1) مثّل سحابة النقط. هل التعديل الخطي مناسب؟ علّل.", "2) نضع z = ln y.", "أ) انقل وأكمل جدولا بقيم z_i مدوّرة إلى 10⁻².", "ب) احسب إحداثيي النقطة المتوسطة G(x̄ ; z̄).", "ج) عيّن معادلة مستقيم الانحدار لـ z بالنسبة إلى x بطريقة المربعات الدنيا (تدوّر المعاملات إلى 10⁻³).", "د) احسب معامل الارتباط الخطي r بين x و z، وفسّر النتيجة.", "3) استنتج عبارة y بدلالة x على الشكل y = α·e^(βx).", "4) قدّر عدد المشتركين في الشهر الثامن. ابتداء من أيّ شهر يتجاوز عدد المشتركين 50 ألفا حسب هذا النموذج؟"], "solution": ["1) السحابة منحنية (الزيادات تكبر شهرا بعد شهر)، إذن التعديل الخطي غير مناسب.", "2-أ) z_i = ln y_i: 0,74 ، 1,10 ، 1,48 ، 1,84 ، 2,22 ، 2,60.", "2-ب) x̄ = 3,5 و z̄ = 9,98/6 ≈ 1,663. إذن G(3,5 ; 1,663).", "2-ج) V(x) = 35/12 ≈ 2,917.", "Σx_i·z_i = 0,74 + 2,20 + 4,44 + 7,36 + 11,10 + 15,60 = 41,44.", "cov(x ; z) = 41,44/6 − 3,5 × 1,6633 ≈ 6,9067 − 5,8217 = 1,085.", "a = cov/V(x) = 1,085/2,917 ≈ 0,372 ، b = z̄ − a·x̄ ≈ 1,663 − 0,372 × 3,5 ≈ 0,361.", "مستقيم الانحدار: z = 0,372x + 0,361.", "2-د) V(z) = (Σz_i²)/6 − z̄² ≈ 0,4037.", "r = cov/√(V(x)·V(z)) = 1,085/√(2,917 × 0,4037) ≈ 0,9999.", "r قريب جدا من 1: ارتباط خطي قوي جدا بين x و z، فالتعديل مبرر.", "3) ln y = 0,372x + 0,361 ⇔ y = e^0,361 × e^(0,372x).", "e^0,361 ≈ 1,435، إذن y ≈ 1,435·e^(0,372x).", "4) x = 8: z = 0,372 × 8 + 0,361 = 3,337، و y = e^3,337 ≈ 28,1 أي حوالي 28 100 مشترك.", "y > 50 ⇔ 0,372x + 0,361 > ln 50 ≈ 3,912 ⇔ x > 9,55.", "إذن ابتداء من الشهر العاشر (x = 10: y ≈ 59,2 ألف)."], "answer": "z = 0,372x + 0,361 ؛ r ≈ 0,9999 ؛ y ≈ 1,435·e^(0,372x) ؛ الشهر 8: ≈ 28,1 ألف ؛ يتجاوز 50 ألفا ابتداء من الشهر 10"}], "physics": [{"id": "physics-01a", "chapters": ["المتابعة الزمنية لتحول كيميائي في وسط مائي"], "title": "تفاعل شوارد اليود مع شوارد بيروكسوديكبريتات", "level": "متوسط", "minutes": 25, "statement": ["عند اللحظة t = 0 نمزج حجما V₁ = 100 mL من محلول يود البوتاسيوم (K⁺ + I⁻) تركيزه c₁ = 0,20 mol/L،", "مع حجم V₂ = 100 mL من محلول بيروكسوديكبريتات الصوديوم (2Na⁺ + S₂O₈²⁻) تركيزه c₂ = 0,050 mol/L.", "معادلة التفاعل المنمذج للتحول: S₂O₈²⁻(aq) + 2I⁻(aq) → 2SO₄²⁻(aq) + I₂(aq)", "1) اكتب المعادلتين النصفيتين للأكسدة والإرجاع، وحدد الثنائيتين (Ox/Red).", "2) احسب كميتي المادة الابتدائيتين n₀(I⁻) و n₀(S₂O₈²⁻).", "3) أنشئ جدول تقدم التفاعل، وعيّن التقدم الأعظمي x_max والمتفاعل المحد.", "4) أعطت المتابعة الزمنية النتائج التالية:", "t (min): 0 ، 5 ، 10 ، 15 ، 20 ، 30 ، 40 ، 60", "x (mmol): 0 ، 1,65 ، 2,75 ، 3,49 ، 3,99 ، 4,55 ، 4,80 ، 4,96", "ويمكن نمذجتها بالعلاقة: x(t) = 5(1 − e^(−t/12,5)) حيث x بـ mmol و t بـ min.", "أ) عرّف زمن نصف التفاعل t½ واحسب قيمته.", "ب) احسب السرعة الحجمية للتفاعل عند t = 0. كيف تتطور هذه السرعة مع الزمن؟ علّل.", "5) احسب التركيز المولي لثنائي اليود [I₂] في نهاية التحول."], "solution": ["1) الأكسدة: 2I⁻ = I₂ + 2e⁻ ، الإرجاع: S₂O₈²⁻ + 2e⁻ = 2SO₄²⁻.", "الثنائيتان: (I₂/I⁻) و (S₂O₈²⁻/SO₄²⁻).", "2) n₀(I⁻) = c₁·V₁ = 0,20 × 0,100 = 2,0×10⁻² mol.", "n₀(S₂O₈²⁻) = c₂·V₂ = 0,050 × 0,100 = 5,0×10⁻³ mol.", "3) جدول التقدم (بالمول):", "الحالة الابتدائية: S₂O₈²⁻: 5,0×10⁻³ | I⁻: 2,0×10⁻² | SO₄²⁻: 0 | I₂: 0", "الحالة الانتقالية: 5,0×10⁻³ − x | 2,0×10⁻² − 2x | 2x | x", "إذا كان S₂O₈²⁻ محدا: x = 5,0×10⁻³ mol. إذا كان I⁻ محدا: x = 1,0×10⁻² mol.", "x_max هو الأصغر: x_max = 5,0×10⁻³ mol = 5,0 mmol، والمتفاعل المحد هو S₂O₈²⁻.", "4-أ) t½ هو المدة اللازمة ليبلغ التقدم نصف قيمته النهائية: x(t½) = x_max/2 = 2,5 mmol.", "5(1 − e^(−t½/12,5)) = 2,5 ⇔ e^(−t½/12,5) = 1/2 ⇔ t½ = 12,5 × ln 2 ≈ 8,7 min.", "(يتوافق مع الجدول: x = 2,5 mmol بين 5 min و 10 min)", "4-ب) v = (1/V)·(dx/dt) مع V = V₁ + V₂ = 0,200 L.", "dx/dt = (5/12,5)·e^(−t/12,5) ⇒ عند t = 0: dx/dt = 0,40 mmol/min.", "v(0) = 0,40/0,200 = 2,0 mmol·L⁻¹·min⁻¹ = 2,0×10⁻³ mol·L⁻¹·min⁻¹.", "السرعة تتناقص مع الزمن (ميل المماس يتناقص) لأن تراكيز المتفاعلات (عامل حركي) تتناقص.", "5) [I₂]_f = x_max/V = 5,0×10⁻³/0,200 = 2,5×10⁻² mol/L."], "answer": "x_max = 5,0 mmol (S₂O₈²⁻ محد) ؛ t½ ≈ 8,7 min ؛ v(0) = 2,0×10⁻³ mol·L⁻¹·min⁻¹ ؛ [I₂]_f = 2,5×10⁻² mol/L"}, {"id": "physics-01b", "chapters": ["المتابعة الزمنية لتحول كيميائي في وسط مائي"], "title": "متابعة تفاعل المغنيزيوم مع حمض بقياس الضغط", "level": "باك", "minutes": 50, "statement": ["نضع في دورق شريطا من المغنيزيوم كتلته m = 0,12 g،", "ثم نضيف عند t = 0 حجما V = 50 mL من محلول حمض كلور الهيدروجين (H₃O⁺ + Cl⁻) تركيزه c = 0,50 mol/L.", "يُغلق الدورق ويوصل بمقياس ضغط. حجم الغاز فوق المحلول V_g = 1,0 L ودرجة الحرارة ثابتة T = 300 K.", "معادلة التفاعل: Mg(s) + 2H₃O⁺(aq) → Mg²⁺(aq) + H₂(g) + 2H₂O(l)", "المعطيات: M(Mg) = 24 g/mol ، R = 8,31 SI. نعتبر غاز H₂ مثاليا.", "1) احسب كميتي المادة الابتدائيتين للمتفاعلين.", "2) أنشئ جدول التقدم، وعيّن x_max والمتفاعل المحد.", "3) نرمز بـ ΔP = P − P₀ لزيادة الضغط الناتجة عن غاز H₂.", "أ) بيّن أن التقدم يعطى بـ: x = ΔP·V_g/(R·T).", "ب) احسب القيمة النظرية ΔP_max في نهاية التفاعل.", "4) أعطت القياسات الجدول التالي:", "t (s): 0 ، 20 ، 35 ، 60 ، 80 ، 120 ، 160 ، 200 ، 300", "ΔP (kPa): 0 ، 4,11 ، 6,28 ، 8,71 ، 9,95 ، 11,33 ، 11,96 ، 12,24 ، 12,43", "أ) استنتج من الجدول قيمة تقريبية لزمن نصف التفاعل t½.", "ب) ميل المماس لمنحنى ΔP = f(t) عند t = 0 يساوي 249 Pa/s. احسب السرعة الحجمية للتفاعل عند t = 0.", "ج) اذكر عاملين حركيين يسمحان بتسريع هذا التحول.", "5) احسب في نهاية التحول: [H₃O⁺] ثم pH المحلول، و [Mg²⁺]."], "solution": ["1) n₀(Mg) = m/M = 0,12/24 = 5,0×10⁻³ mol.", "n₀(H₃O⁺) = c·V = 0,50 × 0,050 = 2,5×10⁻² mol.", "2) الحالة الانتقالية: Mg: 5,0×10⁻³ − x | H₃O⁺: 2,5×10⁻² − 2x | Mg²⁺: x | H₂: x.", "إذا كان Mg محدا: x = 5,0×10⁻³ mol. إذا كان H₃O⁺ محدا: x = 1,25×10⁻² mol.", "x_max = 5,0×10⁻³ mol، والمتفاعل المحد هو المغنيزيوم.", "3-أ) من قانون الغاز المثالي: ΔP·V_g = n(H₂)·R·T، و n(H₂) = x، إذن x = ΔP·V_g/(R·T).", "3-ب) ΔP_max = x_max·R·T/V_g = 5,0×10⁻³ × 8,31 × 300/(1,0×10⁻³) ≈ 1,25×10⁴ Pa ≈ 12,5 kPa.", "(يتوافق مع القيم الأخيرة في الجدول التي تقترب من 12,5 kPa)", "4-أ) عند t½: x = x_max/2 ⇔ ΔP = ΔP_max/2 ≈ 6,23 kPa.", "من الجدول ΔP = 6,28 kPa عند t = 35 s، إذن t½ ≈ 35 s.", "4-ب) v = (1/V)·(dx/dt) = (1/V)·(V_g/(R·T))·(dΔP/dt).", "v(0) = (1/0,050) × (1,0×10⁻³/(8,31 × 300)) × 249 ≈ 2,0×10⁻³ mol·L⁻¹·s⁻¹.", "4-ج) رفع درجة الحرارة، زيادة التركيز الابتدائي لـ H₃O⁺، استعمال المغنيزيوم على شكل مسحوق (زيادة سطح التلامس).", "5) n_f(H₃O⁺) = 2,5×10⁻² − 2 × 5,0×10⁻³ = 1,5×10⁻² mol.", "[H₃O⁺]_f = 1,5×10⁻²/0,050 = 0,30 mol/L ⇒ pH = −log(0,30) ≈ 0,52.", "[Mg²⁺]_f = 5,0×10⁻³/0,050 = 0,10 mol/L."], "answer": "x_max = 5,0×10⁻³ mol (Mg محد) ؛ ΔP_max ≈ 12,5 kPa ؛ t½ ≈ 35 s ؛ v(0) ≈ 2,0×10⁻³ mol·L⁻¹·s⁻¹ ؛ [H₃O⁺] = 0,30 mol/L ، pH ≈ 0,52 ، [Mg²⁺] = 0,10 mol/L"}, {"id": "physics-02a", "chapters": ["التحولات النووية"], "title": "التناقص الإشعاعي لليود 131", "level": "متوسط", "minutes": 25, "statement": ["يُستعمل اليود 131 (¹³¹₅₃I) في الطب لتشخيص وعلاج أمراض الغدة الدرقية. وهو نواة مشعة تُصدر جسيمات β⁻، ونصف عمرها t½ = 8,02 jours.", "المعطيات: N_A = 6,022×10²³ mol⁻¹ ، M(¹³¹I) = 131 g/mol ، 1 jour = 86400 s ، العنصر الموالي لليود: ₅₄Xe.", "1) اكتب معادلة التفكك، محددا قانوني الانحفاظ المستعملين.", "2) احسب ثابت التفكك λ بالـ s⁻¹.", "3) عيّنة تحتوي عند t = 0 على كتلة m₀ = 1,0 μg من اليود 131.", "أ) احسب عدد الأنوية الابتدائي N₀.", "ب) احسب النشاط الابتدائي A₀.", "4) احسب نشاط العيّنة بعد 24,06 يوما.", "5) بعد كم يوما يصبح نشاط العيّنة مساويا لـ 10% من A₀؟"], "solution": ["1) ¹³¹₅₃I → ¹³¹₅₄Xe + ⁰₋₁e", "انحفاظ العدد الكتلي: 131 = 131 + 0 ، وانحفاظ العدد الشحني: 53 = 54 + (−1).", "2) λ = ln 2/t½ = 0,693/(8,02 × 86400) ≈ 1,00×10⁻⁶ s⁻¹.", "3-أ) N₀ = (m₀/M) × N_A = (1,0×10⁻⁶/131) × 6,022×10²³ ≈ 4,60×10¹⁵ نواة.", "3-ب) A₀ = λ·N₀ ≈ 1,00×10⁻⁶ × 4,60×10¹⁵ ≈ 4,6×10⁹ Bq.", "4) 24,06 = 3 × 8,02 = 3t½، إذن A = A₀/2³ = A₀/8 ≈ 5,75×10⁸ Bq.", "5) A(t) = A₀·e^(−λt) = 0,10·A₀ ⇔ e^(−λt) = 0,10 ⇔ t = ln 10/λ.", "t = t½ × ln 10/ln 2 = 8,02 × 3,32 ≈ 26,6 jours."], "answer": "¹³¹₅₃I → ¹³¹₅₄Xe + ⁰₋₁e ؛ λ ≈ 1,00×10⁻⁶ s⁻¹ ؛ N₀ ≈ 4,60×10¹⁵ ؛ A₀ ≈ 4,6×10⁹ Bq ؛ A ≈ 5,75×10⁸ Bq ؛ t ≈ 26,6 jours"}, {"id": "physics-02b", "chapters": ["التحولات النووية"], "title": "الاندماج النووي والتأريخ بالكربون 14", "level": "باك", "minutes": 45, "statement": ["الجزء الأول: الاندماج النووي", "من التفاعلات المدروسة لإنتاج الطاقة اندماج الديتيريوم والتريتيوم: ²₁H + ³₁H → ⁴₂He + ¹₀n", "المعطيات: m(²₁H) = 2,01355 u ، m(³₁H) = 3,01550 u ، m(⁴₂He) = 4,00150 u ، m(n) = 1,00866 u ، m(p) = 1,00728 u", "1 u = 931,5 MeV/c² = 1,66054×10⁻²⁷ kg ، 1 MeV = 1,602×10⁻¹³ J.", "1) عرّف الاندماج النووي. لماذا يتطلب درجات حرارة عالية جدا؟", "2) احسب النقص الكتلي Δm للتفاعل، ثم الطاقة المحررة E_lib بالـ MeV.", "3) احسب طاقة الربط E_l لنواة الهيليوم 4، ثم طاقة الربط لكل نوية.", "4) احسب بالجول الطاقة المحررة عند اندماج 1 kg من خليط يحتوي نفس العدد من أنوية الديتيريوم والتريتيوم.", "الجزء الثاني: التأريخ بالكربون 14", "نصف عمر الكربون 14 هو t½ = 5730 ans. وُجد أن نشاط عيّنة من خشب قديم يساوي 70% من نشاط عيّنة مماثلة من خشب حديث (نعتبره النشاط الابتدائي A₀).", "5) اكتب قانون التناقص الإشعاعي للنشاط A(t).", "6) احسب عمر العيّنة القديمة."], "solution": ["1) الاندماج: اتحاد نواتين خفيفتين لتشكيل نواة أثقل وأكثر استقرارا مع تحرير طاقة.", "يتطلب حرارة عالية جدا (حوالي 10⁸ K) لتكتسب الأنوية الموجبة طاقة حركية كافية للتغلب على التنافر الكهربائي بينها.", "2) Δm = [m(²H) + m(³H)] − [m(He) + m(n)] = 5,02905 − 5,01016 = 0,01889 u.", "E_lib = Δm·c² = 0,01889 × 931,5 ≈ 17,6 MeV.", "3) E_l = [2m(p) + 2m(n) − m(He)]·c² = (2,01456 + 2,01732 − 4,00150) u·c² = 0,03038 u·c².", "E_l = 0,03038 × 931,5 ≈ 28,3 MeV ، و E_l/A = 28,3/4 ≈ 7,07 MeV/nucléon.", "4) كتلة زوج (²H + ³H): 5,02905 × 1,66054×10⁻²⁷ ≈ 8,351×10⁻²⁷ kg.", "عدد الأزواج في 1 kg: N = 1/8,351×10⁻²⁷ ≈ 1,197×10²⁶.", "E = N × 17,6 × 1,602×10⁻¹³ ≈ 1,197×10²⁶ × 2,819×10⁻¹² ≈ 3,38×10¹⁴ J.", "5) A(t) = A₀·e^(−λt) مع λ = ln 2/t½.", "6) A/A₀ = 0,70 ⇔ e^(−λt) = 0,70 ⇔ t = (t½/ln 2) × ln(1/0,70).", "t = (5730/0,693) × 0,357 ≈ 2,95×10³ ans (حوالي 2950 سنة)."], "answer": "Δm = 0,01889 u ؛ E_lib ≈ 17,6 MeV ؛ E_l ≈ 28,3 MeV ، 7,07 MeV/nucléon ؛ E ≈ 3,38×10¹⁴ J ؛ عمر العيّنة ≈ 2950 ans"}, {"id": "physics-03a", "chapters": ["دراسة الظواهر الكهربائية (ثنائي القطب RC وRL)"], "title": "شحن مكثفة عبر ناقل أومي", "level": "متوسط", "minutes": 25, "statement": ["نحقق دارة كهربائية على التسلسل تتكون من: مولد توتر ثابت E = 12 V،", "ناقل أومي مقاومته R = 5,0 kΩ، مكثفة فارغة سعتها C = 200 μF، وقاطعة K. عند t = 0 نغلق القاطعة.", "1) بتطبيق قانون جمع التوترات، بيّن أن المعادلة التفاضلية للتوتر u_C بين طرفي المكثفة هي: du_C/dt + (1/RC)·u_C = E/RC.", "2) تحقق أن u_C(t) = E(1 − e^(−t/τ)) حل لهذه المعادلة، حيث τ ثابت يطلب تعيين عبارته.", "3) احسب قيمة ثابت الزمن τ، وبيّن بالتحليل البعدي أنه متجانس مع الزمن.", "4) احسب u_C عند t = τ، وشدة التيار i عند t = 0.", "5) احسب الطاقة المخزنة في المكثفة في النظام الدائم.", "6) بعد كم من الوقت يبلغ التوتر u_C نسبة 99% من E؟"], "solution": ["1) u_R + u_C = E مع u_R = R·i و i = dq/dt = C·du_C/dt.", "RC·du_C/dt + u_C = E، وبالقسمة على RC: du_C/dt + (1/RC)·u_C = E/RC.", "2) du_C/dt = (E/τ)·e^(−t/τ). بالتعويض:", "(E/τ)·e^(−t/τ) + E/RC − (E/RC)·e^(−t/τ) = E/RC ⇔ E·e^(−t/τ)·(1/τ − 1/RC) = 0.", "هذا محقق من أجل كل t إذا كان τ = RC.", "3) τ = RC = 5,0×10³ × 200×10⁻⁶ = 1,0 s.", "[R] = [U]/[I] و [C] = [Q]/[U] = [I]·[T]/[U]، إذن [RC] = [T]: τ متجانس مع الزمن.", "4) u_C(τ) = 12(1 − e^(−1)) ≈ 0,63 × 12 ≈ 7,6 V.", "عند t = 0: u_C = 0، إذن i(0) = E/R = 12/5000 = 2,4×10⁻³ A = 2,4 mA.", "5) في النظام الدائم u_C = E: E_C = (1/2)·C·E² = 0,5 × 200×10⁻⁶ × 144 = 1,44×10⁻² J.", "6) 1 − e^(−t/τ) = 0,99 ⇔ e^(−t/τ) = 0,01 ⇔ t = τ·ln 100 ≈ 4,6 s."], "answer": "τ = RC = 1,0 s ؛ u_C(τ) ≈ 7,6 V ؛ i(0) = 2,4 mA ؛ E_C = 1,44×10⁻² J ؛ t ≈ 4,6 s"}, {"id": "physics-03b", "chapters": ["دراسة الظواهر الكهربائية (ثنائي القطب RC وRL)"], "title": "استجابة ثنائي القطب RL لتوتر ثابت", "level": "باك", "minutes": 45, "statement": ["نربط على التسلسل: مولدا ذا توتر ثابت E = 6,0 V، وشيعة ذاتيتها L ومقاومتها الداخلية r = 10 Ω،", "وناقلا أوميا مقاومته R = 50 Ω، وقاطعة K. عند t = 0 نغلق القاطعة.", "1) بيّن أن المعادلة التفاضلية التي تحققها شدة التيار i(t) هي: di/dt + ((R + r)/L)·i = E/L.", "2) حل هذه المعادلة من الشكل i(t) = A(1 − e^(−t/τ)). عيّن عبارتي A و τ.", "3) احسب شدة التيار I₀ في النظام الدائم.", "4) سمح جهاز إعلام آلي (EXAO) برسم u_R(t)، فوُجد أن المماس للمنحنى عند t = 0 يقطع المستقيم المقارب u_R = 5,0 V عند اللحظة t = 5,0 ms.", "أ) ما مدلول هذه اللحظة؟", "ب) استنتج قيمة الذاتية L.", "5) احسب التوتر بين طرفي الوشيعة في النظام الدائم.", "6) احسب الطاقة المغناطيسية المخزنة في الوشيعة في النظام الدائم.", "7) احسب قيمة di/dt عند t = 0، وفسّر لماذا لا تقفز شدة التيار فجأة عند غلق القاطعة."], "solution": ["1) قانون جمع التوترات: u_R + u_b = E مع u_R = R·i و u_b = r·i + L·di/dt.", "(R + r)·i + L·di/dt = E، وبالقسمة على L: di/dt + ((R + r)/L)·i = E/L.", "2) di/dt = (A/τ)·e^(−t/τ). بالتعويض:", "(A/τ)·e^(−t/τ) + ((R + r)/L)·A − ((R + r)/L)·A·e^(−t/τ) = E/L.", "بالمطابقة: ((R + r)/L)·A = E/L ⇒ A = E/(R + r)، و 1/τ = (R + r)/L ⇒ τ = L/(R + r).", "3) I₀ = E/(R + r) = 6,0/60 = 0,10 A. (تحقق: u_R = R·I₀ = 50 × 0,10 = 5,0 V ✓)", "4-أ) هذه اللحظة هي ثابت الزمن τ = 5,0 ms.", "4-ب) L = τ·(R + r) = 5,0×10⁻³ × 60 = 0,30 H.", "5) في النظام الدائم di/dt = 0، إذن u_b = r·I₀ = 10 × 0,10 = 1,0 V (أو E − u_R = 6,0 − 5,0 = 1,0 V).", "6) E_m = (1/2)·L·I₀² = 0,5 × 0,30 × (0,10)² = 1,5×10⁻³ J.", "7) عند t = 0: i = 0، إذن L·di/dt = E ⇒ di/dt = E/L = 6,0/0,30 = 20 A/s.", "الوشيعة تعاكس تغير شدة التيار المار فيها (ظاهرة التحريض الذاتي)، فشدة التيار دالة مستمرة لأن الطاقة (1/2)L·i² لا يمكن أن تتغير لحظيا."], "answer": "A = E/(R + r) ، τ = L/(R + r) ؛ I₀ = 0,10 A ؛ L = 0,30 H ؛ u_b = 1,0 V ؛ E_m = 1,5×10⁻³ J ؛ di/dt(0) = 20 A/s"}, {"id": "physics-04a", "chapters": ["تطور جملة ميكانيكية (قوانين نيوتن، السقوط الشاقولي، حركة الكواكب والأقمار الصناعية)"], "title": "السقوط الشاقولي لكرة مع احتكاك", "level": "متوسط", "minutes": 25, "statement": ["نترك كرة كتلتها m = 50 g تسقط شاقوليا دون سرعة ابتدائية في الهواء.", "نُنمذج قوة الاحتكاك بـ f = k·v حيث k = 2,5×10⁻² kg/s، ونهمل دافعة أرخميدس. g = 9,8 m/s².", "1) مثّل القوى المؤثرة على الكرة أثناء السقوط.", "2) بتطبيق القانون الثاني لنيوتن في مرجع سطحي أرضي نعتبره غاليليا، بيّن أن المعادلة التفاضلية للسرعة هي: dv/dt + (k/m)·v = g.", "3) استنتج عبارة السرعة الحدية v_lim واحسب قيمتها.", "4) تحقق أن v(t) = v_lim(1 − e^(−t/τ)) حل للمعادلة مع τ = m/k. احسب τ.", "5) احسب السرعة عند t = τ، والتسارع عندما تكون v = 10 m/s.", "6) بعد أي مدة تقريبا نعتبر أن النظام الدائم قد تحقق؟"], "solution": ["1) قوتان: الثقل P = m·g شاقولي نحو الأسفل، وقوة الاحتكاك f = k·v شاقولية نحو الأعلى.", "2) القانون الثاني لنيوتن: P→ + f→ = m·a→.", "بالإسقاط على محور شاقولي موجه نحو الأسفل: m·g − k·v = m·dv/dt ⇒ dv/dt + (k/m)·v = g.", "3) في النظام الدائم v = v_lim ثابتة، إذن dv/dt = 0 و (k/m)·v_lim = g.", "v_lim = m·g/k = 0,050 × 9,8/0,025 = 19,6 m/s.", "4) dv/dt = (v_lim/τ)·e^(−t/τ). بالتعويض مع τ = m/k:", "(v_lim·k/m)·e^(−t/τ) + (k/m)·v_lim − (k/m)·v_lim·e^(−t/τ) = (k/m)·v_lim = g ✓.", "τ = m/k = 0,050/0,025 = 2,0 s.", "5) v(τ) = 19,6 × (1 − e^(−1)) ≈ 12,4 m/s.", "a = g − (k/m)·v = 9,8 − 0,5 × 10 = 4,8 m/s².", "6) نعتبر النظام الدائم محققا بعد حوالي 5τ = 10 s."], "answer": "v_lim = 19,6 m/s ؛ τ = 2,0 s ؛ v(τ) ≈ 12,4 m/s ؛ a = 4,8 m/s² ؛ حوالي 10 s"}, {"id": "physics-04b", "chapters": ["تطور جملة ميكانيكية (قوانين نيوتن، السقوط الشاقولي، حركة الكواكب والأقمار الصناعية)"], "title": "ضربة حرة في كرة القدم وقمر اصطناعي", "level": "باك", "minutes": 55, "statement": ["الجزء الأول: ضربة حرة", "يسدد لاعب ضربة حرة: تنطلق الكرة (نعتبرها نقطية) من النقطة O على سطح الأرض عند t = 0 بسرعة v₀ = 25 m/s يصنع حاملها زاوية α = 16° مع الأفق.", "نهمل تأثير الهواء، g = 9,8 m/s².", "يقع حائط اللاعبين على بعد 9,15 m من O وارتفاعه 1,80 m، وخط المرمى على بعد 25 m، وارتفاع العارضة 2,44 m.", "1) بتطبيق القانون الثاني لنيوتن، أوجد المعادلتين الزمنيتين x(t) و y(t) في المعلم (O ; i , j).", "2) استنتج معادلة المسار y = f(x).", "3) هل تمر الكرة فوق الحائط؟ علّل.", "4) هل تدخل الكرة المرمى تحت العارضة؟ متى تصل إلى خط المرمى؟", "5) احسب أقصى ارتفاع تبلغه الكرة.", "الجزء الثاني: قمر اصطناعي", "قمر اصطناعي يدور حول الأرض بحركة دائرية منتظمة على ارتفاع h = 600 km.", "المعطيات: G = 6,67×10⁻¹¹ SI ، M_T = 5,97×10²⁴ kg ، R_T = 6380 km.", "6) بتطبيق القانون الثاني لنيوتن في المرجع المركزي الأرضي، بيّن أن سرعة القمر v = √(G·M_T/(R_T + h)). احسب قيمتها.", "7) احسب دوره T، ثم تحقق من القانون الثالث لكبلر: T²/r³ = 4π²/(G·M_T).", "8) احسب ارتفاع قمر جيومستقر دوره T' = 86164 s."], "solution": ["1) الجملة: الكرة، في مرجع سطحي أرضي غاليلي. القوة الوحيدة: الثقل، إذن a→ = g→: a_x = 0 و a_y = −g.", "v₀x = v₀·cos α ≈ 24,03 m/s ، v₀y = v₀·sin α ≈ 6,89 m/s.", "x(t) = v₀·cos α·t ≈ 24,03·t ، y(t) = −(1/2)·g·t² + v₀·sin α·t ≈ −4,9·t² + 6,89·t.", "2) t = x/(v₀·cos α) ⇒ y = −g·x²/(2v₀²·cos²α) + x·tan α.", "عدديا: y ≈ −8,48×10⁻³·x² + 0,287·x.", "3) y(9,15) ≈ −0,71 + 2,62 ≈ 1,91 m > 1,80 m: تمر الكرة فوق الحائط.", "4) y(25) ≈ −5,30 + 7,17 ≈ 1,87 m، و 0 < 1,87 < 2,44: تدخل الكرة المرمى.", "تصل عند t = 25/24,03 ≈ 1,04 s.", "5) عند الذروة v_y = 0: y_max = (v₀·sin α)²/(2g) = (6,89)²/19,6 ≈ 2,42 m.", "6) القوة الوحيدة: قوة الجذب F = G·M_T·m/r² نحو مركز الأرض، مع r = R_T + h.", "حركة دائرية منتظمة: a = v²/r، ومنه G·M_T·m/r² = m·v²/r ⇒ v = √(G·M_T/r).", "r = 6,98×10⁶ m ⇒ v = √(6,67×10⁻¹¹ × 5,97×10²⁴/6,98×10⁶) ≈ 7,55×10³ m/s.", "7) T = 2πr/v ≈ 2π × 6,98×10⁶/7,55×10³ ≈ 5,81×10³ s ≈ 96,8 min.", "T² = 4π²r²/v² = 4π²r³/(G·M_T) ⇒ T²/r³ = 4π²/(G·M_T) ≈ 9,91×10⁻¹⁴ s²/m³.", "8) r' = (G·M_T·T'²/(4π²))^(1/3) ≈ 4,215×10⁷ m.", "h' = r' − R_T ≈ 4,215×10⁷ − 0,638×10⁷ ≈ 3,58×10⁷ m ≈ 35 800 km."], "answer": "y ≈ −8,48×10⁻³x² + 0,287x ؛ تمر فوق الحائط (1,91 m) وتدخل المرمى (1,87 m) بعد 1,04 s ؛ y_max ≈ 2,42 m ؛ v ≈ 7,55 km/s ، T ≈ 96,8 min ؛ h' ≈ 35 800 km"}, {"id": "physics-05a", "chapters": ["تطور جملة كيميائية نحو حالة التوازن (الأحماض والأسس، المعايرة)"], "title": "نسبة التقدم وثابت الحموضة لحمض الإيثانويك", "level": "متوسط", "minutes": 20, "statement": ["نحضّر محلولا مائيا (S) لحمض الإيثانويك CH₃COOH تركيزه المولي c = 1,0×10⁻² mol/L. قياس pH المحلول عند 25 °C أعطى pH = 3,4.", "1) اكتب معادلة تفاعل الحمض مع الماء.", "2) أنشئ جدول التقدم (من أجل حجم V من المحلول)، واحسب نسبة التقدم النهائي τ_f. ماذا تستنتج؟", "3) اكتب عبارة ثابت الحموضة Ka للثنائية CH₃COOH/CH₃COO⁻، واحسب قيمته ثم pKa.", "4) ارسم مخطط مجالات التغلب للثنائية، وحدد الصفة الغالبة في المحلول (S)."], "solution": ["1) CH₃COOH(aq) + H₂O(l) ⇌ CH₃COO⁻(aq) + H₃O⁺(aq)", "2) الحالة الابتدائية: CH₃COOH: c·V | CH₃COO⁻: 0 | H₃O⁺: 0.", "الحالة النهائية: c·V − x_f | x_f | x_f.", "x_max = c·V (الماء بوفرة) ، x_f = [H₃O⁺]·V = 10^(−pH)·V.", "τ_f = x_f/x_max = 10^(−3,4)/c = 3,98×10⁻⁴/1,0×10⁻² ≈ 0,040 = 4%.", "τ_f < 1: التحول محدود (غير تام)، حمض الإيثانويك حمض ضعيف.", "3) Ka = [CH₃COO⁻]·[H₃O⁺]/[CH₃COOH].", "[CH₃COO⁻] = [H₃O⁺] = 3,98×10⁻⁴ mol/L ، [CH₃COOH] = c − [H₃O⁺] = 9,60×10⁻³ mol/L.", "Ka = (3,98×10⁻⁴)²/9,60×10⁻³ ≈ 1,65×10⁻⁵ ، pKa = −log Ka ≈ 4,78.", "4) pH < pKa: الصفة الحمضية CH₃COOH غالبة ، pH > pKa: الصفة الأساسية CH₃COO⁻ غالبة.", "pH = 3,4 < 4,78: الصفة الغالبة في (S) هي CH₃COOH."], "answer": "τ_f ≈ 4% (تحول محدود) ؛ Ka ≈ 1,65×10⁻⁵ ، pKa ≈ 4,78 ؛ الصفة الغالبة CH₃COOH"}, {"id": "physics-05b", "chapters": ["تطور جملة كيميائية نحو حالة التوازن (الأحماض والأسس، المعايرة)"], "title": "معايرة حمض البنزويك بمحلول الصود", "level": "باك", "minutes": 50, "statement": ["نريد تعيين التركيز المولي c_a لمحلول حمض البنزويك C₆H₅COOH.", "نأخذ حجما V_a = 20,0 mL منه ونعايره بمحلول هيدروكسيد الصوديوم (Na⁺ + HO⁻) تركيزه c_b = 2,0×10⁻² mol/L، مع متابعة pH-مترية عند 25 °C.", "أعطت المتابعة: نقطة التكافؤ E(V_bE = 15,0 mL ; pH_E = 8,1)، ومن أجل V_b = 7,5 mL كان pH = 4,2.", "المعطيات: Ke = 10⁻¹⁴.", "1) اكتب معادلة تفاعل المعايرة.", "2) عرّف التكافؤ، واحسب التركيز c_a.", "3) استنتج قيمة pKa للثنائية C₆H₅COOH/C₆H₅COO⁻. علّل.", "4) احسب ثابت التوازن K لتفاعل المعايرة، وبيّن أنه تام.", "5) أ) احسب pH محلول الحمض قبل بداية المعايرة.", "ب) لماذا يكون pH المزيج عند التكافؤ أكبر من 7؟", "6) من بين الكواشف التالية، اختر الأنسب لهذه المعايرة: الهيليانتين [3,1 – 4,4] ، أزرق البروموتيمول [6,0 – 7,6] ، أحمر الكريزول [7,2 – 8,8].", "7) احسب pH المزيج عند إضافة V_b = 10,0 mL."], "solution": ["1) C₆H₅COOH(aq) + HO⁻(aq) → C₆H₅COO⁻(aq) + H₂O(l)", "2) التكافؤ: اللحظة التي يكون فيها المتفاعلان قد أُدخلا بالنسب الستوكيومترية.", "c_a·V_a = c_b·V_bE ⇒ c_a = 2,0×10⁻² × 15,0/20,0 = 1,5×10⁻² mol/L.", "3) V_b = 7,5 mL = V_bE/2: نقطة نصف التكافؤ حيث [C₆H₅COOH] = [C₆H₅COO⁻].", "ومن pH = pKa + log([C₆H₅COO⁻]/[C₆H₅COOH]) نجد pH = pKa، إذن pKa = 4,2.", "4) K = [C₆H₅COO⁻]/([C₆H₅COOH]·[HO⁻]) = Ka/Ke = 10^(−4,2)/10^(−14) = 10^9,8 ≈ 6,3×10⁹.", "K > 10⁴: التفاعل تام.", "5-أ) Ka = h²/(c_a − h) مع h = [H₃O⁺]: h² + Ka·h − Ka·c_a = 0.", "Ka = 10^(−4,2) ≈ 6,31×10⁻⁵ ⇒ h ≈ 9,4×10⁻⁴ mol/L ⇒ pH ≈ 3,0.", "5-ب) عند التكافؤ يحتوي المزيج على الأساس C₆H₅COO⁻ (وشوارد Na⁺ الخاملة)، فالمحلول أساسي و pH > 7.", "6) الكاشف المناسب هو الذي تحتوي منطقة تغيره على pH_E = 8,1: أحمر الكريزول.", "7) V_b = 10,0 mL < V_bE: n(C₆H₅COO⁻) = c_b·V_b = 2,0×10⁻⁴ mol.", "n(C₆H₅COOH) = c_a·V_a − c_b·V_b = 3,0×10⁻⁴ − 2,0×10⁻⁴ = 1,0×10⁻⁴ mol.", "pH = pKa + log(2,0/1,0) = 4,2 + 0,3 ≈ 4,5."], "answer": "c_a = 1,5×10⁻² mol/L ؛ pKa = 4,2 ؛ K ≈ 6,3×10⁹ (تام) ؛ pH الابتدائي ≈ 3,0 ؛ الكاشف: أحمر الكريزول ؛ pH(10 mL) ≈ 4,5"}, {"id": "physics-06a", "chapters": ["مراقبة تطور جملة كيميائية (الأسترة والإماهة)"], "title": "الأسترة: المردود وتأثير الكميات الابتدائية", "level": "متوسط", "minutes": 25, "statement": ["نمزج في حوجلة n₁ = 0,50 mol من حمض الإيثانويك مع n₂ = 0,50 mol من الإيثانول،", "ونضيف قطرات من حمض الكبريت المركز ثم نسخن بالارتداد. ثابت التوازن للأسترة K = 4.", "1) اكتب معادلة تفاعل الأسترة بالصيغ نصف المفصلة، وسمّ الأستر الناتج.", "2) ما دور حمض الكبريت؟ وما دور التسخين بالارتداد؟", "3) أنشئ جدول التقدم، وبيّن أن التقدم النهائي x_f = 2n₁/3. احسب مردود التفاعل r.", "4) نعيد التجربة بمزج 1,0 mol من الحمض مع 2,0 mol من الإيثانول. احسب التقدم النهائي الجديد والمردود.", "5) اذكر طريقة أخرى لتحسين المردود."], "solution": ["1) CH₃−COOH + CH₃−CH₂−OH ⇌ CH₃−COO−CH₂−CH₃ + H₂O", "الأستر: إيثانوات الإيثيل.", "2) حمض الكبريت وسيط: يسرّع التفاعل دون أن يغير حالة التوازن.", "التسخين يسرّع التفاعل (عامل حركي)، والارتداد يُكثّف الأبخرة ويعيدها إلى الحوجلة فيمنع ضياع المواد.", "3) عند التوازن: الحمض n₁ − x_f | الكحول n₁ − x_f | الأستر x_f | الماء x_f.", "K = x_f²/(n₁ − x_f)² = 4 ⇒ x_f/(n₁ − x_f) = 2 ⇒ x_f = 2n₁/3 ≈ 0,333 mol.", "r = x_f/x_max = (2n₁/3)/n₁ = 2/3 ≈ 67%.", "4) K = x²/((1,0 − x)(2,0 − x)) = 4 ⇔ x² = 4(2 − 3x + x²) ⇔ 3x² − 12x + 8 = 0.", "الجذران: x = 2 ± (2√3)/3، أي x ≈ 3,15 (مرفوض لأنه > 1,0) أو x ≈ 0,845 mol.", "x_max = 1,0 mol (الحمض محد)، إذن r ≈ 84,5%: استعمال أحد المتفاعلين بزيادة يحسّن المردود.", "5) نزع أحد النواتج (الماء أو الأستر) أثناء تشكله، مثلا بالتقطير، فينزاح التوازن في جهة الأسترة."], "answer": "إيثانوات الإيثيل ؛ x_f = 0,333 mol ، r ≈ 67% ؛ مع زيادة الكحول: x_f ≈ 0,845 mol ، r ≈ 84,5%"}, {"id": "physics-06b", "chapters": ["مراقبة تطور جملة كيميائية (الأسترة والإماهة)"], "title": "متابعة أسترة بالمعايرة وانزياح التوازن", "level": "باك", "minutes": 50, "statement": ["نمزج في حوجلة 0,20 mol من حمض الميثانويك HCOOH مع 0,20 mol من البروبان-1-ول CH₃−CH₂−CH₂−OH،", "مع قطرات من حمض الكبريت المركز، ثم نوزع المزيج بالتساوي على 10 أنابيب اختبار مسدودة توضع في حمام مائي عند 80 °C.", "المعطيات: M(HCOOH) = 46 g/mol ، M(C₃H₇OH) = 60 g/mol ،", "الكتلة الحجمية للبروبان-1-ول ρ = 0,80 g/mL. نهمل كمية حمض الكبريت المضافة في المعايرة.", "1) احسب كتلة الحمض اللازمة وحجم الكحول اللازم.", "2) اكتب معادلة التفاعل بالصيغ نصف المفصلة، وسمّ الأستر الناتج.", "3) عند لحظات مختلفة نُخرج أنبوبا ونضعه في ماء مثلج، ثم نعاير الحمض المتبقي فيه بمحلول هيدروكسيد الصوديوم تركيزه c_b = 1,0 mol/L.", "أ) لماذا نضع الأنبوب في الماء المثلج قبل المعايرة؟", "ب) عند التوازن كان حجم التكافؤ V_bE = 6,7 mL. احسب كمية الحمض المتبقية في المزيج الكلي، ثم التقدم النهائي x_f.", "ج) احسب المردود r وثابت التوازن K. هل تتوافق النتيجة مع كون الكحول أوليا؟", "4) نأخذ المزيج الكلي عند التوازن (نعتبر K = 4 و x_f = 2/15 mol) ونضيف إليه 0,10 mol من البروبان-1-ول.", "أ) احسب كسر التفاعل Q_r مباشرة بعد الإضافة، واستنتج جهة تطور الجملة.", "ب) احسب التقدم النهائي الجديد والمردود الجديد.", "5) اكتب معادلة تفاعل إماهة الأستر الناتج، واذكر خصائص هذا التفاعل."], "solution": ["1) m(HCOOH) = 0,20 × 46 = 9,2 g.", "m(C₃H₇OH) = 0,20 × 60 = 12,0 g ⇒ V = m/ρ = 12,0/0,80 = 15 mL.", "2) HCOOH + CH₃−CH₂−CH₂−OH ⇌ HCOO−CH₂−CH₂−CH₃ + H₂O", "الأستر: ميثانوات البروبيل.", "3-أ) التبريد المفاجئ (السقي) يوقف التفاعل عمليا، فتبقى كمية الحمض المعايرة هي نفسها الموجودة عند لحظة الإخراج.", "3-ب) في أنبوب واحد: n = c_b·V_bE = 1,0 × 6,7×10⁻³ = 6,7×10⁻³ mol.", "في المزيج الكلي (10 أنابيب): n_acide = 6,7×10⁻² mol.", "x_f = 0,20 − 0,067 = 0,133 mol.", "3-ج) r = x_f/x_max = 0,133/0,20 ≈ 67%.", "K = x_f²/(0,20 − x_f)² = (0,133)²/(0,067)² ≈ 3,9 ≈ 4.", "نعم: من أجل مزيج متساوي المولات مع كحول أولي يكون المردود حوالي 67% و K ≈ 4.", "4-أ) بعد الإضافة: الحمض 1/15 mol ، الكحول 1/15 + 0,10 = 1/6 mol ، الأستر والماء 2/15 mol لكل منهما.", "Q_r = (2/15)²/((1/15) × (1/6)) = 0,0178/0,0111 = 1,6.", "Q_r < K: تتطور الجملة في الاتجاه المباشر (اتجاه الأسترة).", "4-ب) نسمي y التقدم الإضافي: (2/15 + y)² = 4(1/15 − y)(1/6 − y).", "بالحل نجد y = 1/5 − √7/15 ≈ 0,024 mol (الجذر الآخر ≈ 0,376 مرفوض لأنه > 1/15).", "x_f' = 2/15 + y = (5 − √7)/15 ≈ 0,157 mol ، و r' = 0,157/0,20 ≈ 78,5%.", "5) HCOO−CH₂−CH₂−CH₃ + H₂O ⇌ HCOOH + CH₃−CH₂−CH₂−OH", "الإماهة تفاعل بطيء ومحدود (عكوس) ولا حراري، وهو التفاعل العكسي للأسترة."], "answer": "m = 9,2 g ، V = 15 mL ؛ ميثانوات البروبيل ؛ x_f ≈ 0,133 mol ، r ≈ 67% ، K ≈ 4 ؛ Q_r = 1,6 < K (اتجاه مباشر) ؛ x_f' ≈ 0,157 mol ، r' ≈ 78,5%"}, {"id": "physics-07a", "chapters": ["الظواهر الاهتزازية (النواس المرن، النواس البسيط، الدارة RLC)"], "title": "النواس المرن الأفقي غير المتخامد", "level": "متوسط", "minutes": 25, "statement": ["نواس مرن أفقي يتكون من جسم صلب كتلته m = 200 g مثبت بطرف نابض مهمل الكتلة حلقاته غير متلاصقة وثابت مرونته k = 20 N/m.", "نزيح الجسم عن وضع توازنه بـ X_m = 4,0 cm في الاتجاه الموجب ونتركه دون سرعة ابتدائية عند t = 0. نهمل كل الاحتكاكات.", "1) بتطبيق القانون الثاني لنيوتن، بيّن أن المعادلة التفاضلية للحركة هي: d²x/dt² + (k/m)·x = 0.", "2) حل هذه المعادلة من الشكل x(t) = X_m·cos(ω₀t + φ). عيّن ω₀ و φ، واحسب الدور الذاتي T₀.", "3) احسب السرعة العظمى v_max والتسارع الأعظمي a_max.", "4) احسب الطاقة الميكانيكية للجملة (جسم + نابض)، وبيّن أنها محفوظة.", "5) احسب سرعة الجسم عند مروره بالموضع x = 2,0 cm."], "solution": ["1) القوى: الثقل P→ ورد الفعل R→ (متعاكسان لأن الحركة أفقية دون احتكاك)، وقوة الإرجاع T→ = −k·x·i→.", "القانون الثاني لنيوتن بالإسقاط على المحور الأفقي: −k·x = m·d²x/dt² ⇒ d²x/dt² + (k/m)·x = 0.", "2) ω₀ = √(k/m) = √(20/0,200) = 10 rad/s.", "عند t = 0: x(0) = X_m ⇒ cos φ = 1 ⇒ φ = 0 (و v(0) = −X_m·ω₀·sin φ = 0 ✓).", "x(t) = 0,040·cos(10t) (x بالمتر و t بالثانية).", "T₀ = 2π/ω₀ = 2π/10 ≈ 0,63 s.", "3) v_max = ω₀·X_m = 10 × 0,040 = 0,40 m/s.", "a_max = ω₀²·X_m = 100 × 0,040 = 4,0 m/s².", "4) E = (1/2)k·x² + (1/2)m·v² = (1/2)k·X_m²·cos²(ω₀t) + (1/2)m·X_m²·ω₀²·sin²(ω₀t).", "بما أن m·ω₀² = k: E = (1/2)k·X_m² ثابتة (محفوظة).", "E = 0,5 × 20 × (0,040)² = 1,6×10⁻² J.", "5) انحفاظ الطاقة: (1/2)m·v² = (1/2)k(X_m² − x²) ⇒ v = ω₀·√(X_m² − x²).", "v = 10 × √(0,040² − 0,020²) ≈ 0,35 m/s."], "answer": "ω₀ = 10 rad/s ، φ = 0 ، T₀ ≈ 0,63 s ؛ v_max = 0,40 m/s ، a_max = 4,0 m/s² ؛ E = 1,6×10⁻² J ؛ v ≈ 0,35 m/s"}, {"id": "physics-07b", "chapters": ["الظواهر الاهتزازية (النواس المرن، النواس البسيط، الدارة RLC)"], "title": "الاهتزازات الحرة في دارة LC ثم RLC", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: نشحن مكثفة سعتها C = 10 μF تحت توتر ثابت E = 10 V، ثم نوصلها عند t = 0 بوشيعة ذاتيتها L = 0,10 H مقاومتها مهملة.", "1) بيّن أن المعادلة التفاضلية التي تحققها شحنة المكثفة q(t) هي: d²q/dt² + (1/LC)·q = 0.", "2) حل هذه المعادلة من الشكل q(t) = Q₀·cos(2πt/T₀ + φ). عيّن Q₀ و φ وعبارة T₀ ثم احسب قيمته.", "3) احسب الطاقة الكلية المخزنة في الدارة، واستنتج الشدة العظمى I_max للتيار.", "4) عبّر عن الطاقة المخزنة في المكثفة وفي الوشيعة بدلالة الزمن، وبيّن أن مجموعهما ثابت.", "الجزء الثاني: نعوّض الوشيعة بأخرى لها نفس الذاتية ومقاومتها r غير مهملة.", "5) ما نمط الاهتزازات المحصل عليها؟ علّل.", "6) بعد ثلاث اهتزازات أصبحت القيمة العظمى للتوتر بين طرفي المكثفة 6,0 V. احسب الطاقة المبددة بفعل جول خلال هذه المدة.", "7) نريد الحصول على دور ذاتي T₀' = 2,0 ms بنفس المكثفة (دون مقاومة). ما قيمة الذاتية اللازمة؟"], "solution": ["1) قانون جمع التوترات: u_C + u_L = 0 مع u_C = q/C و u_L = L·di/dt = L·d²q/dt².", "L·d²q/dt² + q/C = 0 ⇒ d²q/dt² + (1/LC)·q = 0.", "2) بالتعويض نجد (2π/T₀)² = 1/(LC)، إذن T₀ = 2π·√(LC).", "T₀ = 2π·√(0,10 × 10×10⁻⁶) = 2π × 10⁻³ ≈ 6,28×10⁻³ s.", "عند t = 0: q(0) = C·E = Q₀ و i(0) = 0، إذن Q₀ = 10×10⁻⁶ × 10 = 1,0×10⁻⁴ C و φ = 0.", "3) E_tot = (1/2)·C·E² = 0,5 × 10×10⁻⁶ × 100 = 5,0×10⁻⁴ J.", "عندما q = 0 تكون كل الطاقة مغناطيسية: (1/2)L·I_max² = E_tot.", "I_max = √(2E_tot/L) = √(2 × 5,0×10⁻⁴/0,10) = 0,10 A.", "4) E_C = q²/(2C) = (Q₀²/2C)·cos²(ω₀t) مع ω₀ = 2π/T₀.", "i = dq/dt = −Q₀·ω₀·sin(ω₀t) ⇒ E_L = (1/2)L·i² = (1/2)L·Q₀²·ω₀²·sin²(ω₀t).", "بما أن L·ω₀² = 1/C: E_L = (Q₀²/2C)·sin²(ω₀t).", "E_C + E_L = Q₀²/(2C) = 5,0×10⁻⁴ J ثابتة.", "5) اهتزازات حرة متخامدة (شبه دورية إذا كانت r صغيرة): السعة تتناقص لأن جزءا من الطاقة يتبدد بفعل جول في المقاومة.", "6) عند القيمة العظمى للتوتر تكون i = 0 فالطاقة كلها في المكثفة:", "E₀ = (1/2)·C·(10)² = 5,0×10⁻⁴ J ، E₃ = (1/2)·C·(6,0)² = 1,8×10⁻⁴ J.", "الطاقة المبددة: ΔE = 5,0×10⁻⁴ − 1,8×10⁻⁴ = 3,2×10⁻⁴ J.", "7) T₀' = 2π·√(L'C) ⇒ L' = T₀'²/(4π²·C) = (2,0×10⁻³)²/(4π² × 10×10⁻⁶) ≈ 1,0×10⁻² H."], "answer": "T₀ = 2π√(LC) ≈ 6,28 ms ؛ Q₀ = 1,0×10⁻⁴ C ، φ = 0 ؛ E_tot = 5,0×10⁻⁴ J ؛ I_max = 0,10 A ؛ ΔE = 3,2×10⁻⁴ J ؛ L' ≈ 1,0×10⁻² H"}], "svt": [{"id": "svt-01a", "chapters": ["تركيب البروتين"], "title": "من المورثة إلى السلسلة الببتيدية", "level": "متوسط", "minutes": 25, "statement": ["يمثل ما يلي جزءاً من السلسلة المستنسخة (غير الرامزة) لمورثة تشرف على تركيب ببتيد قصير:", "3' - TAC GGA CTT AAA ATC - 5'", "مقتطف من جدول الشفرة الوراثية: AUG = Met | CCU = Pro | GAA = Glu | GAG = Glu | UUU = Phe | UAG و UAA = توقف.", "1) أعط تتابع نيكليوتيدات الـ ARNm الناتج مع تحديد اتجاهه، وسمّ المرحلة والإنزيم المسؤول عنها.", "2) استخرج تتابع الأحماض الأمينية للببتيد الناتج.", "3) حدثت طفرة (أ): استبدال T بـ C في آخر الثلاثية الثالثة (CTT ← CTC). وحدثت طفرة (ب): استبدال C بـ A في أول الثلاثية الثالثة (CTT ← ATT). بيّن نتيجة كل طفرة على الببتيد.", "4) لخّص في جدول الفروق بين مرحلتي الاستنساخ والترجمة (المقر، المادة الأولية، الناتج)."], "solution": ["1) يُبنى الـ ARNm بالتكامل مع السلسلة المستنسخة (A يقابله U، T يقابله A، G يقابله C، C يقابله G):", "5' - AUG CCU GAA UUU UAG - 3'", "المرحلة هي الاستنساخ، تتم في النواة بواسطة إنزيم ARN بوليميراز الذي يقرأ السلسلة المستنسخة في الاتجاه 3' نحو 5' ويبني الـ ARNm في الاتجاه 5' نحو 3'.", "2) قراءة الرامزات من 5' نحو 3': AUG = Met، CCU = Pro، GAA = Glu، UUU = Phe، UAG = رامزة توقف لا توافق أي حمض أميني.", "الببتيد الناتج: Met - Pro - Glu - Phe (أربعة أحماض أمينية).", "3) الطفرة (أ): CTC تعطي في الـ ARNm الرامزة GAG وهي ترمز أيضاً لـ Glu، فلا يتغير الببتيد. هي طفرة صامتة، وسببها أن الشفرة الوراثية متكررة (عدة رامزات لنفس الحمض الأميني).", "الطفرة (ب): ATT تعطي الرامزة UAA وهي رامزة توقف، فتتوقف الترجمة مبكراً ويصبح الببتيد Met - Pro فقط. هي طفرة موقفة (توقف مبكر) تنتج بروتيناً قصيراً غير وظيفي عادة.", "4) الاستنساخ: المقر النواة، المادة الأولية ADN (السلسلة المستنسخة) ونيكليوتيدات ريبية حرة، الناتج ARNm.", "الترجمة: المقر الهيولى على مستوى الريبوزومات (أو الشبكة الهيولية المحببة)، المادة الأولية ARNm وأحماض أمينية محمولة على ARNt، الناتج سلسلة ببتيدية.", "مراحل الترجمة: بداية (تثبيت الريبوزوم على رامزة الانطلاق AUG مع ARNt حامل للميثيونين)، استطالة (تشكل روابط ببتيدية وانتقال الريبوزوم رامزة برامزة)، نهاية (وصول الريبوزوم إلى رامزة توقف وتحرر الببتيد)."], "answer": "ARNm: 5'-AUG CCU GAA UUU UAG-3'؛ الببتيد Met-Pro-Glu-Phe؛ الطفرة (أ) صامتة (GAG=Glu)، الطفرة (ب) موقفة (UAA) تعطي Met-Pro."}, {"id": "svt-01b", "chapters": ["تركيب البروتين"], "title": "تتبع اليوراسيل والليوسين المشعين في خلية بنكرياسية", "level": "باك", "minutes": 45, "statement": ["الجزء الأول: توضع خلايا غدية في وسط به يوراسيل مشع لمدة 5 دقائق، ثم تنقل إلى وسط به يوراسيل عادي. تقاس نسبة الإشعاع في النواة والهيولى.", "الزمن (min): 0 | 5 | 15 | 30 | 45", "إشعاع النواة (%): 0 | 85 | 60 | 35 | 15", "إشعاع الهيولى (%): 0 | 15 | 40 | 65 | 85", "1) لماذا اختير اليوراسيل بالذات؟ حلل النتائج واستنتج ما تدل عليه.", "الجزء الثاني: تكرر التجربة باستعمال ليوسين مشع (حمض أميني). يظهر الإشعاع أولاً في الهيولى على مستوى تجمعات ريبوزومات مرتبطة بخيط واحد، ثم في جزيئات بروتينية. وعند إضافة مادة (س) تمنع ارتباط ARNt بالريبوزوم، يبقى الليوسين المشع حراً في الهيولى أو مرتبطاً بـ ARNt فقط.", "2) فسر هذه الملاحظات، وسمّ التجمعات الريبوزومية المشاهدة.", "3) حدد مقر تأثير المادة (س) والمرحلة المعنية.", "الجزء الثالث: انطلاقاً مما سبق ومعارفك، اكتب نصاً علمياً قصيراً تبين فيه كيف تُنقل المعلومة الوراثية من النواة إلى الهيولى وتترجم إلى بروتين."], "solution": ["1) اليوراسيل قاعدة آزوتية خاصة بالـ ARN (لا توجد في الـ ADN)، فتتبعه يسمح بتتبع تركيب الـ ARN وحده.", "التحليل: بعد 5 دقائق يتركز الإشعاع في النواة (85%) مقابل 15% في الهيولى. مع الزمن يتناقص الإشعاع النووي تدريجياً (إلى 15% عند 45 min) بينما يتزايد الإشعاع الهيولي بنفس القدر تقريباً (إلى 85%).", "الاستنتاج: يُركب الـ ARN في النواة (استنساخ) ثم ينتقل إلى الهيولى عبر الثقوب النووية. تناقص أحدهما مع تزايد الآخر يدل على انتقال نفس الجزيئات.", "2) الليوسين المشع يُدمج في سلاسل ببتيدية في الهيولى. التجمعات المشاهدة هي متعدد الريبوزومات (البوليزوم
