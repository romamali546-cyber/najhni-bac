): عدة ريبوزومات تترجم نفس جزيء الـ ARNm في وقت واحد، فتنتج عدة نسخ من نفس البروتين بسرعة.", "دور الـ ARNt: ينقل الحمض الأميني المنشط إلى الريبوزوم، ويتعرف على الرامزة بفضل الرامزة المضادة.", "3) المادة (س) تؤثر على مستوى الريبوزوم في الهيولى، فتمنع وصول الأحماض الأمينية المحمولة إلى موقعها. المرحلة المعنية هي الترجمة (البداية والاستطالة)، لذا لا تتشكل روابط ببتيدية ويبقى الليوسين حراً أو مرتبطاً بـ ARNt.", "الجزء الثالث (نص علمي): تحمل المورثة في الـ ADN المعلومة الوراثية على شكل تتابع نيكليوتيدات. في النواة ينفصل جزء من سلسلتي الـ ADN، ويبني إنزيم ARN بوليميراز جزيء ARNm مكملاً للسلسلة المستنسخة: هذه هي مرحلة الاستنساخ.", "يغادر الـ ARNm النواة عبر الثقوب النووية نحو الهيولى، حيث يتثبت عليه الريبوزوم عند رامزة الانطلاق AUG.", "تأتي جزيئات ARNt حاملة للأحماض الأمينية، وتتعرف كل رامزة مضادة على الرامزة المكملة لها. يربط الريبوزوم الأحماض الأمينية بروابط ببتيدية ويتقدم رامزة برامزة.", "عند رامزة التوقف تنفصل وحدتا الريبوزوم ويتحرر الببتيد، الذي يكتسب بنيته الفراغية ليصبح بروتيناً وظيفياً. وهكذا يحدد تتابع النيكليوتيدات في المورثة تتابع الأحماض الأمينية في البروتين."], "answer": "الـ ARN يُركب في النواة ثم يهاجر إلى الهيولى؛ الترجمة تتم على البوليزومات في الهيولى؛ المادة (س) تثبط الترجمة على مستوى الريبوزوم."}, {"id": "svt-02a", "chapters": ["العلاقة بين بنية ووظيفة البروتين"], "title": "الأحماض الأمينية والهجرة الكهربائية", "level": "متوسط", "minutes": 25, "statement": ["نضع مزيجاً من ثلاثة أحماض أمينية في وسط درجة حموضته pH = 5.97 ونطبق عليه تياراً كهربائياً (هجرة كهربائية).", "الحمض الأميني: حمض الأسبارتيك | الغليسين | الليزين", "قيمة pHi: 2.77 | 5.97 | 9.74", "1) عرّف pHi (نقطة التعادل الكهربائي).", "2) حدد الشحنة الإجمالية لكل حمض أميني في هذا الوسط، واتجاه هجرته.", "3) اكتب بالصيغة العامة تفاعل ارتباط حمضين أمينيين، وسمّ الرابطة الناتجة.", "4) لماذا يختلف سلوك الأحماض الأمينية رغم أن لها نفس الصيغة العامة؟"], "solution": ["1) pHi هو قيمة pH الوسط التي يكون فيها الحمض الأميني متعادلاً كهربائياً (شحنته الإجمالية معدومة)، فيكون على شكل أيون مزدوج (شحنة موجبة على -NH3+ وسالبة على -COO-).", "2) القاعدة: إذا كان pH الوسط أكبر من pHi يتصرف الحمض الأميني كحمض ويفقد H+ فيصبح سالب الشحنة ويهاجر نحو القطب الموجب (المصعد). وإذا كان pH أصغر من pHi يكتسب H+ فيصبح موجب الشحنة ويهاجر نحو القطب السالب (المهبط).", "حمض الأسبارتيك: pH = 5.97 أكبر من 2.77، شحنته سالبة، يهاجر نحو القطب الموجب.", "الغليسين: pH = pHi، شحنته معدومة، يبقى في مكان الوضع.", "الليزين: pH = 5.97 أصغر من 9.74، شحنته موجبة، يهاجر نحو القطب السالب.", "3) R1-CH(NH2)-COOH + R2-CH(NH2)-COOH ← R1-CH(NH2)-CO-NH-CH(R2)-COOH + H2O", "الرابطة -CO-NH- هي الرابطة الببتيدية، تتشكل بين مجموعة الكربوكسيل للحمض الأول ومجموعة الأمين للحمض الثاني مع تحرر جزيء ماء. الناتج ثنائي ببتيد.", "4) يرجع الاختلاف إلى الجذر R: في حمض الأسبارتيك يحمل الجذر وظيفة حمضية إضافية (-COOH)، وفي الليزين وظيفة قاعدية إضافية (-NH2)، أما الغليسين فجذره ذرة هيدروجين. هذه الجذور تحدد الخصائص الكيميائية والكهربائية لكل حمض أميني."], "answer": "الأسبارتيك سالب نحو القطب +، الغليسين متعادل لا يهاجر، الليزين موجب نحو القطب -؛ الرابطة الببتيدية -CO-NH-."}, {"id": "svt-02b", "chapters": ["العلاقة بين بنية ووظيفة البروتين"], "title": "البنية الفراغية شرط للوظيفة", "level": "باك", "minutes": 45, "statement": ["الجزء الأول: إنزيم (E) سلسلة ببتيدية واحدة تحتوي على 8 أحماض سيستين تشكل 4 جسور ثنائية الكبريت. أجريت عليه المعاملات التالية، وقيس نشاطه:", "المعاملة 1: إنزيم طبيعي ← النشاط 100%", "المعاملة 2: إضافة اليوريا (تكسر الروابط الضعيفة) ومادة مرجعة (تكسر الجسور ثنائية الكبريت) ← النشاط 0%", "المعاملة 3: إزالة المادتين معاً ببطء بعد المعاملة 2 ← النشاط 95%", "المعاملة 4: إزالة المادة المرجعة أولاً مع بقاء اليوريا، ثم إزالة اليوريا ← النشاط 2% تقريباً", "1) فسر النتائج، وبيّن ما تستنتجه حول العلاقة بين البنية الأولية والبنية الفراغية والوظيفة.", "2) اقترح تفسيراً لضعف النشاط في المعاملة 4.", "الجزء الثاني: عند شخص مصاب بفقر الدم المنجلي، يختلف جزء من مورثة السلسلة β للخضاب عن الشخص السليم:", "السليم: الرامزة السادسة في الـ ARNm هي GAG (Glu). المصاب: الرامزة السادسة GUG (Val).", "3) حدد نوع الطفرة، واشرح كيف يؤدي تغير حمض أميني واحد إلى تغير شكل الكرية الحمراء ووظيفتها."], "solution": ["1) المعاملة 2: كسر الروابط الضعيفة والجسور ثنائية الكبريت يفقد الإنزيم بنيته الفراغية (تمسخ) فيفقد نشاطه، مع أن بنيته الأولية (تتابع الأحماض الأمينية) سليمة لأن الروابط الببتيدية لم تتأثر.", "المعاملة 3: عند الإزالة البطيئة للمادتين تنطوي السلسلة تلقائياً وتستعيد بنيتها الفراغية الأصلية، فيعود النشاط (95%).", "الاستنتاج: البنية الأولية هي التي تحدد البنية الفراغية، لأن الروابط بين جذور الأحماض الأمينية (ثنائية الكبريت، شاردية، هيدروجينية، كارهة للماء) تنشأ في مواضع محددة بتتابع الأحماض الأمينية. والوظيفة مرتبطة بالبنية الفراغية.", "2) في المعاملة 4 تتشكل الجسور ثنائية الكبريت بينما السلسلة لا تزال غير منطوية (بسبب اليوريا)، فترتبط السيستينات عشوائياً بغير شركائها الطبيعيين. تتشكل بنى فراغية خاطئة، ولا يتشكل الموقع الفعال إلا في نسبة ضئيلة من الجزيئات (حوالي 2%).", "3) الطفرة طفرة استبدال نيكليوتيد واحد: في الـ ARNm تصبح الرامزة GAG إلى GUG (استبدال A بـ U)، ويقابل ذلك في السلسلة المستنسخة من الـ ADN تحول الثلاثية CTC إلى CAC (استبدال T بـ A).", "النتيجة: يُستبدل حمض الغلوتاميك (جذر محب للماء مشحون سالباً) بالفالين (جذر كاره للماء). يظهر على سطح الخضاب موقع كاره للماء يجعل جزيئات الخضاب تلتصق ببعضها وتشكل أليافاً طويلة، خاصة عند نقص الأكسجين.", "هذه الألياف تشوه الكرية الحمراء فتأخذ شكل منجل، فتصبح هشة وتسد الشعيرات الدموية وينقص نقلها للأكسجين: فقر دم.", "الخلاصة: تغير البنية الأولية يغير البنية الفراغية فتتغير الوظيفة."], "answer": "البنية الأولية تحدد البنية الفراغية التي تحدد الوظيفة؛ فقر الدم المنجلي: استبدال Glu بـ Val (GAG ← GUG) يغير الخضاب وشكل الكرية."}, {"id": "svt-03a", "chapters": ["النشاط الإنزيمي للبروتينات"], "title": "سرعة التفاعل الإنزيمي وتركيز مادة التفاعل", "level": "متوسط", "minutes": 25, "statement": ["نقيس السرعة الابتدائية لتفاعل إنزيمي بتركيزات مختلفة من مادة التفاعل، مع ثبات كمية الإنزيم ودرجة الحرارة وpH.", "تركيز مادة التفاعل [S] (mmol/L): 0 | 1 | 2 | 4 | 8 | 16 | 32", "السرعة الابتدائية V (µmol/min): 0 | 20 | 33 | 50 | 67 | 80 | 89", "1) حلل النتائج.", "2) فسر تطور السرعة مستعيناً بمفهوم المعقد إنزيم - مادة التفاعل.", "3) قدّر السرعة الأعظمية Vmax وتركيز مادة التفاعل الذي يعطي نصفها.", "4) كيف يمكن رفع السرعة الأعظمية؟ علل."], "solution": ["1) عند التراكيز الضعيفة (من 0 إلى 4 mmol/L) تزداد السرعة بسرعة مع زيادة [S]. ثم يتباطأ الارتفاع (من 67 إلى 89 بين 8 و32 mmol/L) وتقترب السرعة من قيمة حدية.", "2) يرتبط الإنزيم بمادة التفاعل على مستوى الموقع الفعال مشكلاً معقداً (إنزيم - مادة التفاعل)، ثم تتحول مادة التفاعل إلى ناتج ويتحرر الإنزيم سليماً: E + S ← ES ← E + P.", "عند [S] ضعيف تكون أغلب المواقع الفعالة حرة، فكلما زاد [S] زاد عدد المعقدات في الوحدة الزمنية فزادت السرعة.", "عند [S] مرتفع تصبح كل المواقع الفعالة تقريباً مشغولة (تشبع الإنزيم)، فلا تزيد السرعة إلا قليلاً: هذه هي السرعة الأعظمية.", "3) تقترب السرعة من حوالي 100 µmol/min، فـ Vmax ≈ 100 µmol/min. نصفها 50 µmol/min ويوافق [S] = 4 mmol/L.", "4) لا يمكن رفع Vmax بزيادة [S] لأن الإنزيم مشبع. ترتفع Vmax بزيادة كمية الإنزيم، لأن ذلك يزيد عدد المواقع الفعالة المتاحة."], "answer": "السرعة تزداد ثم تثبت بسبب تشبع المواقع الفعالة؛ Vmax ≈ 100 µmol/min ونصفها عند 4 mmol/L؛ ترفع Vmax بزيادة كمية الإنزيم."}, {"id": "svt-03b", "chapters": ["النشاط الإنزيمي للبروتينات"], "title": "تأثير الحرارة وpH على إنزيم الأميلاز", "level": "باك", "minutes": 45, "statement": ["الجزء الأول: يقاس النشاط النسبي للأميلاز اللعابي (يحلل النشاء إلى مالتوز) في درجات حرارة مختلفة عند pH = 6.8:", "الحرارة (°C): 0 | 10 | 20 | 37 | 50 | 60 | 70", "النشاط (%): 0 | 20 | 50 | 100 | 60 | 15 | 0", "تجربة مكملة: أنبوب (أ) حُفظ عند 0°C ثم نُقل إلى 37°C ← يستعيد نشاطه. أنبوب (ب) حُفظ عند 70°C ثم نُقل إلى 37°C ← لا يستعيد نشاطه.", "1) حلل المنحنى وحدد درجة الحرارة المثلى.", "2) فسر نتيجتي الأنبوبين (أ) و(ب).", "الجزء الثاني: النشاط النسبي بدلالة pH عند 37°C:", "pH: 4 | 5 | 6 | 7 | 8 | 9", "النشاط (%): 5 | 35 | 85 | 100 | 55 | 15", "3) فسر تأثير pH على النشاط الإنزيمي على المستوى الجزيئي.", "4) يُعطَّل الأميلاز اللعابي عند وصوله إلى المعدة (pH بين 1.5 و2). علل ذلك."], "solution": ["1) يرتفع النشاط من 0% عند 0°C حتى يبلغ أقصاه 100% عند 37°C، ثم ينخفض بسرعة ليصبح معدوماً عند 70°C. درجة الحرارة المثلى 37°C.", "2) الأنبوب (أ): البرودة تبطئ حركة الجزيئات فتقل فرص الالتقاء بين الإنزيم ومادة التفاعل، لكن بنية الإنزيم لم تتخرب. عند إعادة التسخين يعود النشاط: التثبيط بالبرودة عكوس.", "الأنبوب (ب): الحرارة المرتفعة تكسر الروابط الضعيفة التي تحافظ على البنية الفراغية، فيتشوه الموقع الفعال (تمسخ الإنزيم) ولا يعود يتكامل مع مادة التفاعل. التخرب غير عكوس.", "3) يحتوي الموقع الفعال على أحماض أمينية لجذورها وظائف قابلة للتشرد (-COOH و-NH2). تتغير حالة تشردها حسب pH الوسط.", "عند pH الأمثل (حوالي 7) تكون شحنات جذور الموقع الفعال مناسبة لتثبيت مادة التفاعل وتحفيز التفاعل. عند الابتعاد عنه تتغير الشحنات فيضعف التثبيت ويقل النشاط، وقد تتغير البنية الفراغية في القيم المتطرفة.", "4) في المعدة pH حمضي جداً (1.5 - 2)، بعيد عن pH الأمثل للأميلاز، فتتغير شحنات موقعه الفعال وتتخرب بنيته الفراغية، فيفقد نشاطه. لذلك يتوقف هضم النشاء في المعدة ويُستأنف في المعي الدقيق بأميلاز البنكرياس."], "answer": "الحرارة المثلى 37°C؛ البرودة تثبيط عكوس والحرارة المرتفعة تمسخ غير عكوس؛ pH يغير تشرد جذور الموقع الفعال (الأمثل ≈ 7)."}, {"id": "svt-04a", "chapters": ["دور البروتينات في الدفاع عن الذات (المناعة)"], "title": "الاستجابة الأولية والاستجابة الثانوية", "level": "متوسط", "minutes": 25, "statement": ["حُقن أرنب بمستضد (Ag) في اليوم 0، ثم أعيد حقنه بنفس المستضد في اليوم 30. قيس تركيز الأجسام المضادة النوعية ضد Ag في المصل (وحدات اعتبارية):", "اليوم: 0 | 5 | 10 | 15 | 25 | 30 | 35 | 40 | 50", "تركيز الأجسام المضادة: 0 | 2 | 10 | 15 | 5 | 3 | 60 | 100 | 70", "1) قارن بين الاستجابتين من حيث سرعة الظهور والشدة.", "2) فسر الاختلاف بين الاستجابتين.", "3) سمّ الخلايا المنتجة للأجسام المضادة، وصف بنية الجسم المضاد باختصار.", "4) ما مبدأ التلقيح (اللقاح) الذي يمكن استخلاصه من هذه النتائج؟"], "solution": ["1) الاستجابة الأولى (بعد الحقن الأول): تظهر الأجسام المضادة متأخرة (بعد حوالي 5 أيام) وتبلغ قيمة قصوى ضعيفة (15) ثم تتناقص.", "الاستجابة الثانية (بعد الحقن الثاني): سريعة الظهور (منذ الأيام الأولى) وأشد بكثير (100)، وتدوم مدة أطول.", "2) خلال الاستجابة الأولى تتكاثر اللمفاويات B النوعية وتتمايز إلى بلازميات منتجة للأجسام المضادة، ويتمايز جزء منها إلى خلايا ذاكرة طويلة العمر.", "عند التماس الثاني مع نفس المستضد، تتعرف خلايا الذاكرة (وهي أكثر عدداً من اللمفاويات الأصلية) عليه بسرعة وتتكاثر وتتمايز إلى بلازميات، فتكون الاستجابة أسرع وأقوى.", "3) الخلايا المنتجة هي الخلايا البلازمية (البلازميات) الناتجة عن تمايز اللمفاويات B.", "الجسم المضاد بروتين (غلوبيلين مناعي) على شكل Y، يتكون من 4 سلاسل ببتيدية: سلسلتان ثقيلتان وسلسلتان خفيفتان مرتبطة بجسور ثنائية الكبريت. يحمل منطقتين متغيرتين في الطرفين تشكلان موقعي تثبيت المستضد، ومنطقة ثابتة.", "4) مبدأ اللقاح: إدخال مستضد غير ممرض (ميكروب مقتول أو مضعف أو ذيفان معدل) يحدث استجابة أولية وينشئ خلايا ذاكرة، فإذا دخل الميكروب الحقيقي لاحقاً كانت الاستجابة ثانوية سريعة وقوية تحمي الجسم."], "answer": "الاستجابة الثانوية أسرع وأشد بفضل خلايا الذاكرة؛ البلازميات تنتج الأجسام المضادة (Y، 4 سلاسل)؛ اللقاح ينشئ ذاكرة مناعية."}, {"id": "svt-04b", "chapters": ["دور البروتينات في الدفاع عن الذات (المناعة)"], "title": "التعاون الخلوي في الاستجابة المناعية", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: تُعرَّض فئران لإشعاع يُخرب خلاياها اللمفاوية، ثم تُحقن بخلايا مأخوذة من فئران سليمة من نفس السلالة، وبعدها تحقن بمستضد (Ag). يقاس بعد 10 أيام إنتاج الأجسام المضادة ضد Ag:", "الفأر 1: لمفاويات T فقط ← لا أجسام مضادة", "الفأر 2: لمفاويات B فقط ← كمية ضئيلة جداً", "الفأر 3: لمفاويات T و B ← كمية كبيرة", "الفأر 4: لمفاويات B + مستخلص من وسط زرع لمفاويات T4 منشطة ← كمية كبيرة", "1) فسر النتائج، واستنتج طبيعة العلاقة بين LT4 وLB.", "الجزء الثاني: تُزرع خلايا مصابة بفيروس مع لمفاويات T8 مأخوذة من فأر سبق تعرضه لنفس الفيروس. تلاحظ ثقوب في أغشية الخلايا المصابة ثم انحلالها، بينما لا تتأثر خلايا سليمة موضوعة في نفس الوسط.", "2) سمّ الخلايا المسؤولة عن هذا التأثير، واشرح آلية تدخلها ونوعيتها.", "الجزء الثالث: فيروس فقدان المناعة المكتسبة (VIH) يصيب أساساً الخلايا LT4.", "3) اعتماداً على ما سبق، اشرح لماذا يصبح المصاب في المرحلة المتقدمة (السيدا) عرضة لأمراض انتهازية."], "solution": ["1) الفأر 1: اللمفاويات T لا تنتج أجساماً مضادة. الفأر 2: اللمفاويات B وحدها لا تكفي لاستجابة فعالة. الفأر 3: وجود النوعين معاً يعطي استجابة قوية.", "الفأر 4: مادة تفرزها LT4 المنشطة تكفي لتعويض وجود LT4. هذه المواد هي الأنترلوكينات (مبلغات كيميائية بروتينية).", "الاستنتاج: الاستجابة الخلطية تتطلب تعاوناً بين LT4 وLB. تتعرف LT4 على المستضد المعروض من طرف خلية عارضة (البلعمية) مرتبطاً بجزيئات CMH II، فتنشط وتفرز الأنترلوكين 2 الذي يحفز تكاثر LB المنتخبة وتمايزها إلى بلازميات منتجة للأجسام المضادة.", "2) الخلايا المسؤولة هي اللمفاويات T السامة (LTc) الناتجة عن تكاثر وتمايز LT8 (بمساعدة أنترلوكينات LT4).", "الآلية: تتعرف LTc بواسطة مستقبلاتها النوعية (TCR) على الخلية المصابة التي تعرض ببتيداً فيروسياً مرتبطاً بجزيئة CMH I. تلتصق بها وتفرز بروتين البرفورين الذي يشكل قنوات في غشائها، فيدخل الماء والشوارد وتنحل الخلية (كما تفرز إنزيمات الغرانزيم).", "النوعية: الخلايا السليمة لا تعرض الببتيد الفيروسي فلا تتعرف عليها LTc ولا تتأثر. وهذه هي الاستجابة المناعية ذات الوساطة الخلوية.", "3) LT4 هي المحور المشترك بين الاستجابتين: أنترلوكيناتها ضرورية لتكاثر LB وتمايزها (استجابة خلطية) ولتكاثر LT8 وتمايزها إلى LTc (استجابة خلوية).", "بتناقص عدد LT4 بسبب VIH تضعف الاستجابتان معاً، فيفقد الجسم قدرته على مواجهة ميكروبات لا تؤثر عادة في الشخص السليم، فتظهر الأمراض الانتهازية."], "answer": "تعاون LT4-LB عبر الأنترلوكينات ضروري للاستجابة الخلطية؛ LTc تقتل الخلايا المصابة بالبرفورين (CMH I + ببتيد)؛ VIH يدمر LT4 فتنهار الاستجابتان."}, {"id": "svt-05a", "chapters": ["دور البروتينات في الاتصال العصبي"], "title": "كمون الراحة وكمون العمل", "level": "متوسط", "minutes": 25, "statement": ["تركيز بعض الشوارد على جانبي غشاء ليف عصبي (mmol/L):", "Na+: داخل الليف 15 | خارجه 145", "K+: داخل الليف 150 | خارجه 5", "سُجل عند الراحة فرق كمون قدره -70 mV. وعند تنبيه فعال سُجل كمون عمل بلغت قمته +30 mV ثم عاد الكمون إلى -70 mV بعد مرور قصير بقيمة -80 mV.", "1) فسر وجود كمون الراحة.", "2) صف مراحل كمون العمل وفسر كل مرحلة بحركة الشوارد.", "3) ما دور مضخة Na+/K+؟ ولماذا تتوقف عند إضافة مادة تمنع تركيب ATP؟"], "solution": ["1) يوجد توزع غير متساو للشوارد: Na+ أكثر تركيزاً في الخارج وK+ أكثر تركيزاً في الداخل.", "عند الراحة يكون الغشاء أكثر نفاذية لـ K+ (قنوات تسرب) من Na+، فيخرج K+ بشكل أكبر من دخول Na+، ما يجعل الوجه الداخلي سالباً بالنسبة للخارجي: -70 mV. وتحافظ المضخة Na+/K+ على هذا الفرق في التراكيز.", "2) زوال الاستقطاب: تنفتح قنوات Na+ المرتبطة بالفولطية، فيدخل Na+ بكثافة حسب تدرج تركيزه، فينقلب الكمون حتى +30 mV.", "عودة الاستقطاب: تُغلق قنوات Na+ وتنفتح قنوات K+ المرتبطة بالفولطية، فيخرج K+ ويعود الكمون نحو القيم السالبة.", "فرط الاستقطاب: تبقى قنوات K+ مفتوحة لحظة إضافية فيصل الكمون إلى -80 mV، ثم تُغلق ويعود كمون الراحة -70 mV.", "3) تطرد المضخة 3 Na+ نحو الخارج وتدخل 2 K+ نحو الداخل عكس تدرج تركيزهما، مستعملة طاقة ATP (نقل فعال). بهذا تعيد التوزع الأصلي للشوارد وتحافظ عليه.", "عند منع تركيب ATP تتوقف المضخة لغياب الطاقة، فتتساوى التراكيز تدريجياً ويتناقص كمون الراحة إلى أن يزول، ويفقد الليف قابليته لنقل السيالة."], "answer": "كمون الراحة -70 mV بسبب تسرب K+ وعمل المضخة؛ كمون العمل: دخول Na+ ثم خروج K+ ثم فرط استقطاب؛ المضخة 3Na+ خارج / 2K+ داخل بطاقة ATP."}, {"id": "svt-05b", "chapters": ["دور البروتينات في الاتصال العصبي"], "title": "عمل المشبك وتأثير مواد كيميائية", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: في مشبك عصبي - عضلي، ينبَّه العصبون قبل المشبكي ويسجل الكمون في الليف العضلي، في ثلاث حالات:", "الحالة 1 (عادية): كمون بعد مشبكي منبه يظهر بعد 0.5 ms ويدوم 5 ms ويتبعه تقلص.", "الحالة 2 (إضافة مادة A): يدوم زوال الاستقطاب أكثر من 50 ms مع تقلص مستمر (تكزز). تحليل الشق المشبكي يبين تراكم الأستيل كولين.", "الحالة 3 (إضافة مادة B): لا يظهر أي كمون بعد مشبكي رغم تحرر الأستيل كولين. المادة B تتثبت على مستقبلات الأستيل كولين دون أن تفتحها.", "1) فسر الحالة العادية مبرزاً مراحل النقل المشبكي.", "2) استنتج طريقة تأثير كل من المادتين A وB.", "الجزء الثاني: عصبون حركي في النخاع الشوكي يتصل بعصبونين: N1 منبه وN2 يفرز GABA. النتائج (الكمون عند منطقة القطعة الابتدائية للمحور):", "تنبيه N1 مرة واحدة: زوال استقطاب قدره 8 mV (العتبة 15 mV) ← لا كمون عمل.", "تنبيهان متقاربان لـ N1: زوال استقطاب قدره 16 mV ← كمون عمل.", "تنبيه N2: فرط استقطاب قدره 5 mV.", "تنبيهان متقاربان لـ N1 مع تنبيه N2: زوال استقطاب قدره 11 mV ← لا كمون عمل.", "3) فسر هذه النتائج، وسمّ الظواهر المسجلة، واشرح دور العصبون الحركي في الإدماج."], "solution": ["1) وصول كمون العمل إلى النهاية قبل المشبكية يفتح قنوات Ca2+ المرتبطة بالفولطية، فيدخل الكالسيوم ويحفز اندماج الحويصلات المشبكية مع الغشاء وتحرير الأستيل كولين في الشق المشبكي بالإطراح الخلوي.", "ينتشر الأستيل كولين ويتثبت على مستقبلات قنوية نوعية في الغشاء بعد المشبكي، فتنفتح وتسمح بدخول Na+، فيحدث زوال استقطاب (كمون بعد مشبكي منبه PPSE) يولد كمون عمل عضلي ثم تقلص.", "يقصر الأثر لأن إنزيم الأستيل كولين استراز يحلل الأستيل كولين بسرعة إلى أستات وكولين، فتُغلق القنوات. التأخر 0.5 ms هو التأخر المشبكي.", "2) المادة A: تثبط إنزيم الأستيل كولين استراز، فيتراكم الأستيل كولين ويبقى مثبتاً على المستقبلات، فيستمر زوال الاستقطاب والتقلص.", "المادة B: مادة منافسة تتثبت على مستقبلات الأستيل كولين وتمنع تثبته دون أن تفتح القنوات، فلا يدخل Na+ ولا يحدث كمون بعد مشبكي: شلل عضلي.", "3) تنبيه واحد لـ N1 يعطي PPSE تحت العتبة (8 mV أقل من 15 mV) فلا يتولد كمون عمل.", "تنبيهان متقاربان: تتراكب كمونات بعد مشبكية متتالية من نفس المشبك (8 + 8 = 16 mV) فتبلغ العتبة: هذا تجميع زمني.", "تنبيه N2: الـ GABA يفتح قنوات Cl- فيدخل الكلور ويحدث فرط استقطاب: كمون بعد مشبكي مثبط PPSI (-5 mV).", "عند التنبيه المشترك: يجمع العصبون الحركي جبرياً الكمونات الواردة من مشابك مختلفة (16 - 5 = 11 mV) وهذا تجميع فضائي؛ القيمة تحت العتبة فلا رسالة.", "الإدماج: العصبون الحركي يجمع جبرياً كل الكمونات بعد المشبكية المنبهة والمثبطة على مستوى القطعة الابتدائية للمحور، ولا يرسل كمون عمل إلا إذا بلغت المحصلة العتبة. وبذلك يدمج المعلومات ويقرر الاستجابة."], "answer": "A تثبط الأستيل كولين استراز (تقلص مستمر)؛ B تحجز المستقبلات (شلل)؛ تجميع زمني وفضائي وإدماج للـ PPSE وPPSI في العصبون الحركي."}, {"id": "svt-06a", "chapters": ["آليات تحويل الطاقة الضوئية إلى طاقة كيميائية كامنة (التركيب الضوئي)"], "title": "مصدر الأكسجين المنطلق في التركيب الضوئي", "level": "متوسط", "minutes": 25, "statement": ["التجربة 1: صانعات خضراء معزولة في وسط خال من CO2 يحتوي على مستقبل إلكترونات اصطناعي (أيونات Fe3+). يقاس تركيز O2 في الوسط (وحدات اعتبارية):", "الزمن (min): 0 | 2 | 4 | 6 | 8 | 10", "الإضاءة: ظلام | ضوء | ضوء | ضوء | ظلام | ظلام", "تركيز O2: 10 | 10 | 14 | 18 | 18 | 18", "التجربة 2: نزود طحالب خضراء بماء يحتوي على الأكسجين المشع 18O وCO2 عادي، فيكون الأكسجين المنطلق مشعاً. وعند تزويدها بـ CO2 يحتوي على 18O وماء عادي يكون الأكسجين المنطلق غير مشع.", "1) حلل نتائج التجربة 1 واستنتج شروط انطلاق O2.", "2) ما مصدر الأكسجين المنطلق حسب التجربة 2؟", "3) اكتب التفاعل الإجمالي للتحلل الضوئي للماء، وحدد مقره ومصير نواتجه."], "solution": ["1) في الظلام يبقى تركيز O2 ثابتاً (10). عند الإضاءة يرتفع تدريجياً (إلى 18). عند العودة إلى الظلام يتوقف الارتفاع ويبقى ثابتاً.", "الاستنتاج: انطلاق O2 يتطلب الضوء ووجود مستقبل للإلكترونات، ولا يتطلب CO2. إذن انطلاق O2 مرتبط بالمرحلة الكيموضوئية، مستقل عن تثبيت CO2.", "2) الأكسجين المنطلق مصدره الماء وليس CO2.", "3) 2H2O ← O2 + 4H+ + 4e- (بوجود الضوء، على مستوى النظام الضوئي II).", "المقر: الوجه الداخلي لغشاء التيلاكويد (داخل التيلاكويد).", "مصير النواتج: ينطلق O2 إلى الوسط. الإلكترونات تعوض ما فقده اليخضور المثار في النظام الضوئي II ثم تنتقل عبر سلسلة النواقل إلى المستقبل النهائي NADP+. البروتونات تتراكم داخل التيلاكويد وتساهم في تشكيل تدرج يُستعمل لتركيب ATP. في التجربة 1 حل Fe3+ محل NADP+ كمستقبل للإلكترونات (يرجع إلى Fe2+)."], "answer": "انطلاق O2 يتطلب الضوء ومستقبل إلكترونات ولا يتطلب CO2؛ مصدره الماء؛ 2H2O ← O2 + 4H+ + 4e- في التيلاكويد."}, {"id": "svt-06b", "chapters": ["آليات تحويل الطاقة الضوئية إلى طاقة كيميائية كامنة (التركيب الضوئي)"], "title": "حلقة كالفن وتغيرات APG وRuDP", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: يزرع طحلب في وسط به CO2 مشع (14C) تحت إضاءة. يقاس الإشعاع في مركبين: حمض الفوسفوغليسريك (APG) وريبولوز ثنائي الفوسفات (RuDP) (وحدات اعتبارية):", "الزمن (s): 0 | 30 | 60 | 90 | 120 | 150 | 180", "الظروف: ضوء + CO2 حتى 60 s، ثم ظلام + CO2 من 60 s إلى 120 s، ثم ضوء دون CO2 من 120 s.", "APG: 50 | 50 | 50 | 80 | 90 | 30 | 15", "RuDP: 40 | 40 | 40 | 15 | 5 | 60 | 75", "1) حلل النتائج في كل فترة وفسرها.", "2) استنتج العلاقة بين المرحلة الكيموضوئية والمرحلة الكيموحيوية.", "الجزء الثاني: توضع تيلاكويدات معزولة في الظلام في وسط pH = 4 حتى يصبح داخلها حمضياً، ثم تنقل بسرعة إلى وسط pH = 8 يحتوي على ADP وPi. يلاحظ تركيب ATP في الظلام.", "3) فسر هذه النتيجة، وبيّن دور الكرات المذنبة (ATP سنتاز).", "4) اعط الحصيلة الطاقوية (ATP وNADPH,H+) اللازمة لتركيب جزيئة غلوكوز واحدة في حلقة كالفن."], "solution": ["1) الفترة 0 - 60 s (ضوء + CO2): التركيزان ثابتان، أي أن سرعة إنتاج كل مركب تساوي سرعة استهلاكه: حالة توازن.", "الفترة 60 - 120 s (ظلام): يرتفع APG (من 50 إلى 90) وينخفض RuDP (من 40 إلى 5). التفسير: تثبيت CO2 على RuDP بواسطة إنزيم الروبيسكو يستمر فيتشكل APG، لكن إرجاع APG وتجديد RuDP يتوقفان لغياب ATP وNADPH,H+ الناتجين عن المرحلة الكيموضوئية. فيتراكم APG ويُستنفد RuDP.", "الفترة بعد 120 s (ضوء دون CO2): ينخفض APG (إلى 15) ويرتفع RuDP (إلى 75). التفسير: غياب CO2 يوقف تثبيته على RuDP فلا يتشكل APG، بينما يستمر تحويل APG المتوفر إلى سكر ثلاثي فوسفاتي ثم تجديد RuDP بفضل ATP وNADPH,H+ المتوفرين في الضوء.", "2) المرحلة الكيموحيوية (حلقة كالفن في الحشوة) تتطلب ATP وNADPH,H+ اللذين تنتجهما المرحلة الكيموضوئية (في التيلاكويد). وفي المقابل تعيد المرحلة الكيموحيوية ADP وPi وNADP+ إلى المرحلة الكيموضوئية: المرحلتان متكاملتان.", "3) نقل التيلاكويدات من pH = 4 إلى pH = 8 يخلق تدرجاً في تركيز البروتونات: تركيزها مرتفع داخل التيلاكويد ومنخفض في الخارج.", "تعود البروتونات نحو الخارج (الحشوة) عبر القناة الوحيدة المتاحة: الكرة المذنبة (ATP سنتاز). هذا التدفق يوفر الطاقة اللازمة لفسفرة ADP إلى ATP. إذن الضوء غير ضروري مباشرة لتركيب ATP، بل التدرج البروتوني هو الضروري (النظرية الكيميائية الأسموزية).", "في الظروف الطبيعية يُنشأ هذا التدرج بالضوء: تحلل الماء داخل التيلاكويد، وضخ البروتونات من طرف سلسلة النواقل.", "4) لتثبيت 6 CO2 وتركيب جزيئة غلوكوز (C6H12O6) تحتاج حلقة كالفن 18 ATP و12 NADPH,H+.", "التوزيع: إرجاع 12 APG إلى 12 سكر ثلاثي يستهلك 12 ATP و12 NADPH,H+، وتجديد 6 RuDP يستهلك 6 ATP."], "answer": "في الظلام يتراكم APG وينفد RuDP، وبدون CO2 يحدث العكس؛ المرحلتان متكاملتان؛ ATP يركب بتدفق H+ عبر ATP سنتاز؛ الغلوكوز يتطلب 18 ATP و12 NADPH,H+."}, {"id": "svt-07a", "chapters": ["آليات تحويل الطاقة الكيميائية الكامنة إلى ATP (التنفس والتخمر)"], "title": "الخميرة بين التنفس والتخمر", "level": "متوسط", "minutes": 25, "statement": ["توضع خميرة في مفاعل حيوي مغلق به محلول غلوكوز وكمية محدودة من O2. تقاس بعض المقادير (وحدات اعتبارية):", "الزمن (min): 0 | 10 | 20 | 30 | 40 | 50", "O2 في الوسط: 100 | 60 | 20 | 0 | 0 | 0", "الإيثانول: 0 | 0 | 2 | 15 | 30 | 45", "CO2: 0 | 40 | 80 | 100 | 115 | 130", "1) حلل النتائج وحدد الظاهرة السائدة في كل مرحلة.", "2) اكتب المعادلتين الإجماليتين للظاهرتين.", "3) قارن مردود الظاهرتين من ATP لكل جزيئة غلوكوز، وعلل الفرق.", "4) لماذا يتباطأ إنتاج CO2 بعد نفاد الأكسجين؟"], "solution": ["1) من 0 إلى 30 min: يُستهلك O2 وينطلق CO2 بكثرة ولا يظهر إيثانول تقريباً: الظاهرة السائدة هي التنفس.", "بعد نفاد O2 (من 30 min): يظهر الإيثانول ويتزايد مع استمرار انطلاق CO2 بوتيرة أبطأ: الظاهرة هي التخمر الكحولي.", "2) التنفس: C6H12O6 + 6O2 ← 6CO2 + 6H2O + طاقة (38 ATP).", "التخمر الكحولي: C6H12O6 ← 2C2H5OH + 2CO2 + طاقة (2 ATP).", "3) التنفس ينتج 38 ATP والتخمر 2 ATP فقط لكل جزيئة غلوكوز.", "التعليل: في التنفس يُؤكسد الغلوكوز كلياً إلى CO2 وH2O (التحلل السكري ثم حلقة كريبس ثم السلسلة التنفسية في الميتوكوندري). في التخمر يكون الهدم جزئياً: التحلل السكري فقط في الهيولى، ويبقى جزء كبير من الطاقة كامناً في الإيثانول.", "4) لأن التخمر ينتج 2 CO2 فقط لكل غلوكوز مقابل 6 CO2 في التنفس. كما أن ضعف مردود الطاقة يبطئ نشاط الخميرة."], "answer": "تنفس مع وجود O2 ثم تخمر كحولي بعد نفاده؛ التنفس 38 ATP (أكسدة كلية) مقابل 2 ATP للتخمر (هدم جزئي، طاقة كامنة في الإيثانول)."}, {"id": "svt-07b", "chapters": ["آليات تحويل الطاقة الكيميائية الكامنة إلى ATP (التنفس والتخمر)"], "title": "الميتوكوندري المعزولة والفسفرة التأكسدية", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: توضع ميتوكوندري معزولة في وسط فيزيولوجي مؤكسج به ADP وPi. يقاس تركيز O2 وATP، وتضاف مواد في أزمنة محددة:", "عند t = 1 min: إضافة الغلوكوز ← لا تغير في O2 ولا في ATP.", "عند t = 3 min: إضافة البيروفات ← تناقص O2 وتزايد ATP.", "عند t = 6 min: إضافة مادة DNP (تجعل الغشاء الداخلي نفوذاً للبروتونات) ← يستمر تناقص O2 بل يتسارع، ويتوقف تزايد ATP.", "عند t = 9 min: إضافة السيانيد (يثبط آخر ناقل في السلسلة التنفسية) ← يتوقف استهلاك O2.", "1) فسر عدم تأثير الغلوكوز وتأثير البيروفات.", "2) فسر تأثير DNP ثم تأثير السيانيد، واستنتج العلاقة بين السلسلة التنفسية وتركيب ATP.", "الجزء الثاني:", "3) أنجز حصيلة طاقوية مفصلة للأكسدة الكلية لجزيئة غلوكوز (التحلل السكري، تشكل الأستيل مرافق الإنزيم A، حلقة كريبس، الفسفرة التأكسدية)، علماً أن NADH,H+ يعطي 3 ATP وFADH2 يعطي 2 ATP."], "solution": ["1) الغلوكوز لا يدخل الميتوكوندري ولا يُهدم فيها، لأن تحلله السكري إلى بيروفات يتم في الهيولى بإنزيمات هيولية غائبة هنا.", "البيروفات يدخل الميتوكوندري، ويتحول في المادة الأساسية إلى أستيل مرافق الإنزيم A ثم يُهدم في حلقة كريبس، فتنتج نواقل مرجعة (NADH,H+ وFADH2) تُؤكسد في السلسلة التنفسية مع استهلاك O2 وتركيب ATP.", "2) DNP: السلسلة التنفسية تواصل أكسدة النواقل ونقل الإلكترونات إلى O2 (استهلاك O2)، لكن البروتونات التي ضختها نحو الفراغ بين الغشائين تعود عبر الغشاء مباشرة دون المرور بالكرات المذنبة (ATP سنتاز)، فيزول التدرج ولا يُركب ATP. يسمى هذا فك الاقتران بين الأكسدة والفسفرة.", "السيانيد: يوقف نقل الإلكترونات إلى O2، فتتوقف السلسلة التنفسية كلها ويتوقف استهلاك O2.", "الاستنتاج: نقل الإلكترونات في السلسلة التنفسية (الغشاء الداخلي) يرافقه ضخ البروتونات من المادة الأساسية نحو الفراغ بين الغشائين. هذا التدرج البروتوني هو مصدر الطاقة لتركيب ATP عندما تعود البروتونات عبر ATP سنتاز. السلسلة تؤمن التدرج، وATP سنتاز يستعمله: أكسدة وفسفرة مقترنتان.", "3) التحلل السكري (الهيولى): 2 ATP صافي + 2 NADH,H+.", "تشكل 2 أستيل CoA من 2 بيروفات (المادة الأساسية): 2 NADH,H+ + 2 CO2.", "حلقة كريبس (دورتان): 2 ATP + 6 NADH,H+ + 2 FADH2 + 4 CO2.", "المجموع: 4 ATP مباشرة + 10 NADH,H+ + 2 FADH2.", "الفسفرة التأكسدية: 10 × 3 = 30 ATP، و 2 × 2 = 4 ATP، أي 34 ATP.", "الحصيلة: 4 + 34 = 38 ATP لكل جزيئة غلوكوز (قيمة نظرية؛ قد تنخفض إلى 36 حسب طريقة إدخال NADH الهيولي إلى الميتوكوندري)."], "answer": "البيروفات وليس الغلوكوز هو مادة الميتوكوندري؛ DNP يفك الاقتران (O2 يستهلك دون ATP)؛ السيانيد يوقف السلسلة؛ الحصيلة 38 ATP."}, {"id": "svt-08a", "chapters": ["التكتونية العامة (النشاط التكتوني للصفائح)"], "title": "توسع قاع المحيط عند الظهرة", "level": "متوسط", "minutes": 25, "statement": ["قيس عمر صخور البازلت في قاع محيط على جانبي ظهرة وسط محيطية:", "المسافة عن محور الظهرة (km): 0 | 20 | 40 | 60 | 80", "العمر (مليون سنة): 0 | 1 | 2 | 3 | 4", "النتائج نفسها تقريباً غرب الظهرة وشرقها.", "كما لوحظ أن سمك الرواسب فوق البازلت يزداد بالابتعاد عن الظهرة، وأن التدفق الحراري أعلى ما يكون عند الظهرة.", "1) حلل توزع الأعمار. ماذا تستنتج؟", "2) احسب سرعة الابتعاد لكل جانب ثم سرعة التوسع الكلية بـ cm/سنة.", "3) فسر ارتفاع التدفق الحراري عند الظهرة وتزايد سمك الرواسب.", "4) ما نوع الحدود بين الصفيحتين هنا؟ وكيف يتشكل الغلاف الصخري المحيطي؟"], "solution": ["1) الصخور الأحدث (0 مليون سنة) توجد في محور الظهرة، ويزداد العمر بانتظام مع الابتعاد عنها، والتوزع متناظر على الجانبين.", "الاستنتاج: يتشكل قاع محيطي جديد عند الظهرة ثم يُزاح إلى الجانبين: هذا هو توسع قاع المحيط.", "2) كل جانب يبتعد بـ 80 km خلال 4 مليون سنة، أي 20 km لكل مليون سنة.", "20 km = 2 000 000 cm، مقسومة على 1 000 000 سنة = 2 cm/سنة لكل جانب.", "سرعة التوسع الكلية (ابتعاد الصفيحتين عن بعضهما) = 2 × 2 = 4 cm/سنة.", "3) تحت الظهرة يصعد وشاح ساخن ويحدث انصهار جزئي للبيريدوتيت، فتكون الحرارة مرتفعة: تدفق حراري قوي. بالابتعاد يبرد الغلاف الصخري فيتناقص التدفق.", "الرواسب تتراكم باستمرار مع الزمن، فكلما كان القاع أقدم (أبعد عن الظهرة) كان سمك الرواسب أكبر. وهذا دليل إضافي على التوسع.", "4) الحدود تباعدية (منطقة تباعد). الصهارة الناتجة عن الانصهار الجزئي للبيريدوتيت ترتفع، فيتبلور جزء منها بسرعة على السطح مشكلاً البازلت (والوسائد البازلتية)، ويتبلور جزء ببطء في العمق مشكلاً الغابرو. يضاف إليهما البيريدوتيت في القاعدة: هذا هو الغلاف الصخري المحيطي."], "answer": "العمر يزداد بالابتعاد عن الظهرة بشكل متناظر (توسع)؛ 2 cm/سنة لكل جانب و4 cm/سنة كلياً؛ حدود تباعدية تنتج بازلت وغابرو."}, {"id": "svt-08b", "chapters": ["التكتونية العامة (النشاط التكتوني للصفائح)"], "title": "منطقة الغوص: الزلازل والبراكين والتحول", "level": "باك", "minutes": 50, "statement": ["الجزء الأول: في منطقة تلتقي فيها صفيحة محيطية بصفيحة قارية، سُجل عمق بؤر الزلازل بدلالة المسافة من الخندق المحيطي نحو القارة:", "المسافة من الخندق (km): 0 | 100 | 200 | 300 | 400", "عمق البؤرة (km): 10 | 70 | 135 | 195 | 260", "1) مثّل هذه المعطيات بوصف كلامي للمنحنى، واستنتج ما تدل عليه. احسب تقريبياً زاوية ميل المستوى المرسوم.", "الجزء الثاني: على بعد 170 km تقريباً من الخندق (حيث يبلغ عمق الصفيحة الغائصة حوالي 100 km) توجد سلسلة براكين انفجارية تقذف حمماً لزجة تتصلب إلى صخور الأنديزيت. تحليل المعادن في الصفيحة الغائصة يبين:", "عند عمق 30 km: معادن مميِّهة (غنية بالماء) في صخور مشابهة للبازلت والغابرو.", "عند عمق 80 km: ظهور الغلوكوفان (شيست أزرق).", "عند عمق 100 km فما أكثر: ظهور الجادييت والغرونا (إكلوجيت) مع فقدان الماء.", "2) فسر تطور المعادن، وحدد ظروف الضغط والحرارة المسؤولة.", "3) اشرح العلاقة بين هذا التحول وتشكل الصهارة الأنديزيتية.", "4) لخّص في نص علمي ما يحدث في منطقة الغوص."], "solution": ["1) المنحنى خط شبه مستقيم مائل: يزداد عمق البؤر بانتظام بالابتعاد عن الخندق نحو القارة.", "الاستنتاج: البؤر تتوزع على مستوى مائل (مستوى بينيوف) يوافق احتكاك صفيحة محيطية تغوص تحت الصفيحة القارية: هذا هو الغوص، وهي حدود تقاربية.", "الزاوية: ظل الزاوية = (260 - 10) ÷ 400 = 0.625، فالزاوية حوالي 32 درجة.", "2) قرب السطح يكون الغلاف الصخري المحيطي مميَّهاً (اكتسب الماء عند الظهرة وأثناء تقدمه). أثناء الغوص يزداد الضغط بسرعة بينما تبقى الحرارة منخفضة نسبياً لأن الصفيحة الباردة تسخن ببطء.", "هذه الظروف (ضغط مرتفع وحرارة منخفضة) تحول المعادن: يظهر الغلوكوفان (سحنة الشيست الأزرق) ثم الجادييت والغرونا (سحنة الإكلوجيت)، مع تحرير الماء تدريجياً. هذا تحول في الحالة الصلبة دون انصهار.", "3) الماء المحرر من الصفيحة الغائصة يصعد إلى وشاح الصفيحة الراكبة (البيريدوتيت) فيخفض درجة انصهاره، فيحدث انصهار جزئي على عمق حوالي 100 km.", "تصعد الصهارة الناتجة وتغتني بالسيليس أثناء صعودها عبر القشرة القارية، فتعطي صهارة لزجة غنية بالغازات: براكين انفجارية وصخور أنديزيت على السطح، وصخور حبيبية (الغرانوديوريت) إذا تبلورت في العمق.", "4) نص: عند التقاء صفيحة محيطية كثيفة وباردة بصفيحة قارية أقل كثافة، تغوص الأولى تحت الثانية مشكلة خندقاً محيطياً. يولد احتكاكها زلازل على مستوى مائل يزداد عمقه نحو القارة.", "أثناء الغوص يتحول الغلاف الصخري المحيطي تحت ضغط مرتفع وحرارة منخفضة (شيست أزرق ثم إكلوجيت) ويفقد ماءه. يسبب هذا الماء انصهاراً جزئياً لوشاح الصفيحة الراكبة، فتتشكل صهارة أنديزيتية تغذي براكين انفجارية موازية للخندق.", "وهكذا تُعد منطقة الغوص مكاناً لاختفاء الغلاف الصخري المحيطي الذي تكوّن عند الظهرات، ما يحافظ على ثبات مساحة سطح الأرض."], "answer": "البؤر على مستوى بينيوف مائل بحوالي 32° (غوص)؛ ضغط مرتفع وحرارة منخفضة: شيست أزرق ثم إكلوجيت مع تحرير الماء؛ الماء يسبب انصهار البيريدوتيت فتنتج صهارة أنديزيتية."}], "philosophy": [{"id": "philo-01", "chapters": ["السؤال والمشكلة (السؤال العلمي والسؤال الفلسفي)"], "title": "السؤال العلمي والسؤال الفلسفي", "level": "باك", "minutes": 60, "statement": ["قارن بين السؤال العلمي والسؤال الفلسفي.", "الطريقة: مقارنة"], "solution": ["طرح المشكلة: يطرح الإنسان أسئلة كثيرة، بعضها يسعى إلى تفسير الظواهر الطبيعية بقوانين، وبعضها يبحث في المبادئ الأولى والقيم والمعنى. فهل يعني اختلاف ميدان كل منهما أنهما منفصلان تماماً، أم أن بينهما صلة تجعل أحدهما يحتاج إلى الآخر؟", "أوجه الاختلاف (1): السؤال العلمي يتعلق بظواهر محسوسة قابلة للملاحظة والقياس، مثل: لماذا يتمدد المعدن بالحرارة؟ أما السؤال الفلسفي فيتعلق بقضايا مجردة كلية لا تخضع للتجربة، مثل: ما الحقيقة؟ ما العدل؟", "أوجه الاختلاف (2): يجيب العالم بمنهج تجريبي (ملاحظة، فرضية، تجربة)، ويصوغ قانوناً قابلاً للتحقق. أما الفيلسوف فيعتمد التأمل العقلي والحجاج المنطقي، ولا يصل إلى جواب نهائي متفق عليه.", "أوجه الاختلاف (3): السؤال العلمي ينتهي حين يجد جوابه ويُتجاوز، بينما يبقى السؤال الفلسفي مفتوحاً متجدداً. وفي هذا يرى كارل ياسبرس أن جوهر الفلسفة في البحث عن الحقيقة لا في امتلاكها، وأن أسئلتها أهم من أجوبتها.", "أوجه التشابه: كلاهما ينطلق من الدهشة والحيرة أمام المجهول، وكلاهما يعبّر عن حاجة الإنسان إلى المعرفة. وكلاهما يتطلب صياغة دقيقة وروحاً نقدية ورفضاً للأحكام المسبقة، ويستعمل العقل أداة أساسية.", "أوجه التداخل: كان العلم في الأصل جزءاً من الفلسفة (الفيزياء والفلك عند أرسطو)، ثم استقلت العلوم واحداً بعد الآخر. والعلم اليوم يطرح أسئلة فلسفية: ما قيمة المعرفة العلمية؟ هل يجوز التلاعب بالجينات؟ وهنا تظهر الإبستمولوجيا والأخلاقيات الحيوية.", "وفي المقابل، تستفيد الفلسفة من نتائج العلم لتجديد تأملها، فقد غيّرت النسبية ونظرية التطور نظرة الفلاسفة إلى الزمن والإنسان. فالسؤال الفلسفي يمهد للعلم، والعلم يغذي التفلسف.", "حل المشكلة: السؤال العلمي والسؤال الفلسفي مختلفان في الموضوع والمنهج والغاية، لكنهما متكاملان؛ فالعلم يجيب عن «كيف» تحدث الظواهر، والفلسفة تسأل عن «لماذا» وعن القيمة والمعنى، والإنسان يحتاج إلى الاثنين معاً."], "answer": "مختلفان في الموضوع والمنهج والغاية، متشابهان في الدهشة والروح النقدية، ومتكاملان: العلم يجيب عن الكيف والفلسفة عن المعنى والقيمة."}, {"id": "philo-02", "chapters": ["الشعور واللاشعور"], "title": "هل يكفي الشعور لمعرفة حياتنا النفسية؟", "level": "باك", "minutes": 60, "statement": ["هل يكفي الشعور لمعرفة كل ما يجري في حياتنا النفسية؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: يبدو للإنسان أنه يعرف ما يجري في نفسه مباشرة: يعرف أنه حزين أو فرح أو يفكر. لكنه أحياناً يقوم بسلوكات لا يعرف سببها كزلات اللسان والنسيان المفاجئ. فهل الشعور وحده كاف لمعرفة الحياة النفسية كلها، أم أن هناك جانباً خفياً منها يفلت منه؟", "الموقف الأول: يرى أنصار علم النفس التقليدي، وعلى رأسهم ديكارت، أن الشعور هو أساس الحياة النفسية، فكل ما هو نفسي شعوري، والإنسان يعرف أحواله النفسية معرفة مباشرة بالاستبطان.", "الحجج: قال ديكارت «أنا أفكر إذن أنا موجود»، فالفكر والوعي هما ماهية النفس، ولا يمكن أن نفكر دون أن نعي أننا نفكر. والحديث عن «نفس لا شعورية» تناقض في نظرهم، لأن النفسي يعني ما نعيه.", "ويضيفون أن الشعور يرافق جميع أحوالنا: الإدراك، التذكر، التخيل، الانفعال، ولولاه لما عرفنا أنفسنا ولا ميزنا بين ذواتنا والعالم.", "النقد: هذا الموقف يتجاهل وقائع كثيرة لا يفسرها الشعور: الأحلام، زلات اللسان، النسيان، بعض الأمراض النفسية. كما أن الاستبطان منهج ذاتي، فالشخص قد يخدع نفسه في معرفة دوافعه.", "الموقف الثاني: يرى سيغموند فرويد، مؤسس التحليل النفسي، أن الشعور لا يمثل إلا جزءاً صغيراً من الحياة النفسية، وأن الجزء الأكبر لا شعوري، يحتوي على رغبات ومكبوتات تؤثر في سلوكنا دون علمنا.", "الحجج: لاحظ فرويد عند مرضاه المصابين بالهستيريا أعراضاً جسدية دون سبب عضوي، تزول حين يتذكرون أحداثاً مؤلمة مكبوتة. كما أن الأحلام في نظره تعبير مقنّع عن رغبات مكبوتة، وزلات اللسان والقلم تكشف ما نريد إخفاءه.", "النقد: يؤخذ على فرويد أنه بالغ في إعطاء الأهمية للدوافع الجنسية وللطفولة. ورأى سارتر أن فكرة اللاشعور قد تصبح ذريعة يتهرب بها الإنسان من مسؤوليته عن أفعاله. كما أن نظرية فرويد صعبة التحقق التجريبي.", "التركيب: الحياة النفسية تتكون من جانب شعوري واع وجانب لا شعوري خفي، يتفاعلان معاً. فالشعور يبقى أداة أولى لمعرفة النفس، لكنه لا يكفي وحده، ونحتاج إلى مناهج أخرى كالتحليل النفسي والملاحظة الموضوعية لفهم الإنسان فهماً أعمق.", "حل المشكلة: الشعور لا يكفي لمعرفة كل ما يجري في حياتنا النفسية، لأن جزءاً منها يجري في اللاشعور، غير أن الإنسان يبقى مسؤولاً عن أفعاله الواعية."], "answer": "الشعور لا يكفي وحده: الحياة النفسية شعورية ولا شعورية معاً، مع بقاء الإنسان مسؤولاً عن أفعاله."}, {"id": "philo-03", "chapters": ["الذاكرة"], "title": "هل الذاكرة وظيفة الدماغ وحده؟", "level": "باك", "minutes": 60, "statement": ["هل يمكن رد التذكر إلى نشاط الدماغ وحده؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: الذاكرة قدرة على استرجاع الماضي والتعرف عليه. ولوحظ أن إصابات الدماغ تؤدي أحياناً إلى فقدان الذكريات، وفي المقابل نجد أن ذكرياتنا ترتبط بالأسرة والمجتمع واللغة. فهل الذاكرة ظاهرة بيولوجية مرتبطة بالدماغ وحده، أم أنها نفسية واجتماعية في جوهرها؟", "الموقف الأول: يرى أنصار النظرية المادية، وعلى رأسهم تيودول ريبو، أن الذاكرة وظيفة بيولوجية، وأن الذكريات تُحفظ في خلايا الدماغ على شكل آثار، كما تُحفظ الصور على شريط.", "الحجج: يستند ريبو إلى الحالات المرضية: فإصابة بعض مناطق الدماغ تؤدي إلى فقدان أنواع محددة من الذكريات، كفقدان القدرة على تذكر الكلمات (الأفازيا). ولاحظ أن فقدان الذاكرة يبدأ بالذكريات الحديثة ثم القديمة.", "كما يدعم علم الأعصاب الحديث هذا الموقف ببيان دور مناطق دماغية معينة، كالحُصين، في تثبيت الذكريات، وبأثر بعض الأمراض كالزهايمر على الذاكرة.", "النقد: الدماغ شرط ضروري للتذكر لكنه ليس كافياً. فبعض المصابين يستعيدون ذكرياتهم بعد مدة، ولو كانت الذكريات مخزنة في خلايا تلفت لما عادت. كما أن الذكرى ليست صورة جامدة، بل نعيد بناءها ونعطيها معنى.", "الموقف الثاني: يرى هنري برغسون أن الذاكرة ظاهرة نفسية روحية في جوهرها. ويميز بين ذاكرة العادة (آلية، مرتبطة بالجسم، كحفظ نص بالتكرار) والذاكرة الخالصة (روحية، تستعيد الماضي كحدث فريد).", "الحجج: الذاكرة الخالصة لا تحتاج إلى تكرار، فنحن نتذكر حدثاً وقع مرة واحدة بكل تفاصيله. والدماغ في نظر برغسون ليس مخزناً للذكريات بل أداة للانتباه إلى الحياة، يختار من الماضي ما يفيد الحاضر.", "كما يضيف موريس هالبفاكس أن الذاكرة اجتماعية: فنحن نتذكر داخل أطر اجتماعية (الأسرة، اللغة، الأعياد، الأمكنة)، والمجتمع يساعدنا على استرجاع ماضينا وتحديد تاريخه.", "النقد: الفصل التام بين الذاكرة والجسم غير مقبول، لأن الواقع يثبت تأثر التذكر بالحالة العضوية. كما أن المبالغة في الدور الاجتماعي تهمل الطابع الشخصي لكثير من ذكرياتنا.", "التركيب: الذاكرة وظيفة معقدة يتداخل فيها الجانب البيولوجي (الدماغ شرطها الضروري)، والجانب النفسي (الشعور وإعطاء المعنى)، والجانب الاجتماعي (الأطر التي تساعد على الاسترجاع).", "حل المشكلة: لا يمكن رد التذكر إلى الدماغ وحده؛ فالذاكرة نشاط يقوم به الإنسان كله، جسماً ونفساً وكائناً اجتماعياً."], "answer": "التذكر لا يُرد إلى الدماغ وحده: الدماغ شرط ضروري، لكن الذاكرة نفسية واجتماعية أيضاً."}, {"id": "philo-04", "chapters": ["العادة والإرادة"], "title": "العادة بين التقييد والتحرير", "level": "باك", "minutes": 60, "statement": ["هل العادة تقيّد حرية الإنسان أم تحررها؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: العادة قدرة مكتسبة على أداء عمل بطريقة آلية بعد تكراره. نلاحظ أنها تسهل حياتنا اليومية، لكنها قد تجعلنا أسرى لسلوكات يصعب تركها. فهل العادة سلوك يقيد حرية الإنسان، أم أنها وسيلة تحرره وتوسع قدرته على الفعل؟", "الموقف الأول: يرى بعض المفكرين، ومنهم جان جاك روسو، أن العادة سلوك آلي سلبي يقضي على المبادرة والحرية. وقد نصح روسو في كتابه «إميل» بأن العادة الوحيدة التي ينبغي أن يُعوَّد عليها الطفل هي ألا يكتسب أي عادة.", "الحجج: العادة تجعل السلوك آلياً متكرراً فتضعف الانتباه والتفكير، ويصبح الإنسان كالآلة. كما أنها تقتل الحساسية: فالطبيب المعتاد على الألم قد يفقد التعاطف. وهي تجعل الإنسان محافظاً يرفض التجديد، كما يحدث مع العادات الاجتماعية الجامدة.", "النقد: هذا الموقف يركز على العادات السيئة وحدها، ويتجاهل أن الإنسان لا يستطيع أن يعيش دون عادات، وأن التعلم كله يقوم على اكتسابها.", "الموقف الثاني: يرى فلاسفة آخرون، مثل مين دو بيران ورافيسون وآلان، أن العادة إيجابية، فهي توفر الجهد والوقت وتحرر الفكر للانشغال بمهام أرقى.", "الحجج: من تعوّد على الكتابة لا يفكر في رسم الحروف بل في معاني ما يكتب. والعازف الماهر يتفرغ للتعبير بعد أن تصبح حركات أصابعه آلية. فالعادة تمنح الجسم سهولة ومرونة، وتجعل الأداء أسرع وأدق وأقل تعباً.", "كما أن العادات الأخلاقية كالصدق واحترام الوقت تبني الشخصية، والعادات الاجتماعية تحقق الانسجام بين الأفراد.", "النقد: لا يمكن إنكار أن بعض العادات ضارة (التدخين، الإدمان، الكسل)، وأن الآلية قد تتحول إلى روتين يقتل الإبداع.", "التركيب: العادة ليست خيرة ولا شريرة في ذاتها، بل قيمتها تتوقف على طريقة اكتسابها واستعمالها. وفي هذا المعنى يقول جاك شوفالييه إن العادة أداة حياة أو موت حسب استخدامنا لها. فإذا بقيت خاضعة للإرادة والعقل كانت أداة تحرر، وإذا سيطرت علينا أصبحت قيداً.", "حل المشكلة: العادة تحرر الإنسان حين يكتسبها بوعي ويوجهها بإرادته، وتقيده حين تتحول إلى آلية عمياء. فالإنسان الحر هو من يملك عاداته ولا تملكه."], "answer": "العادة تحرر إذا بقيت خاضعة للإرادة والعقل، وتقيد إذا سيطرت على صاحبها."}, {"id": "philo-05", "chapters": ["اللغة والفكر"], "title": "الدفاع عن تلازم اللغة والفكر", "level": "باك", "minutes": 60, "statement": ["«إن اللغة والفكر متلازمان، فلا فكر بدون لغة». دافع عن هذه الأطروحة.", "الطريقة: استقصاء بالوضع"], "solution": ["طرح المشكلة: شاع عند بعض الفلاسفة أن الفكر أوسع من اللغة، وأن الألفاظ تخون المعاني. لكن هناك أطروحة ترى عكس ذلك: الفكر واللغة وجهان لعملة واحدة. فكيف يمكن الدفاع عن هذه الأطروحة وإثبات مشروعيتها؟", "عرض منطق الأطروحة: يرى أنصار النزعة الأحادية، ومنهم هيغل وميرلوبونتي وعالم اللسانيات فرديناند دو سوسير، أن العلاقة بين اللغة والفكر علاقة تلازم ووحدة: لا يوجد فكر خالص قبل اللغة ثم نبحث له عن ألفاظ، بل نفكر داخل اللغة نفسها.", "الحجة الأولى: يرى هيغل أننا نفكر داخل الكلمات، وأن الفكر الذي لا يجد كلماته يبقى غامضاً غير مكتمل. فالكلمة هي التي تعطي الفكرة وجودها الواضح والمحدد.", "الحجة الثانية: يشبه دو سوسير اللغة بورقة: الفكر وجهها والصوت ظهرها، ولا يمكن قطع أحد الوجهين دون قطع الآخر. والفكر بدون لغة كتلة سديمية غير متميزة.", "الحجة الثالثة: يلاحظ علماء النفس أن الطفل ينمو فكره مع نمو لغته، وأن فقدان اللغة عند المصابين بالأفازيا يرافقه اضطراب في التفكير. كما أننا حين نفكر في صمت نتحدث داخلياً مع أنفسنا.", "عرض موقف الخصوم ونقده: يرى أنصار النزعة الثنائية، وعلى رأسهم هنري برغسون، أن الفكر أسبق من اللغة وأوسع منها، وأن الألفاظ عاجزة عن التعبير عن تدفق الحياة الشعورية، ويستدلون بأننا كثيراً ما نشعر بأفكار لا نجد كلماتها.", "لكن هذا الموقف يمكن الرد عليه: فالعجز عن التعبير لا يدل على وجود فكر واضح خارج اللغة، بل على أن الفكرة نفسها لم تكتمل بعد. والفكرة الواضحة تجد ألفاظها، والإنسان يستطيع أن يغني لغته بكلمات جديدة كلما نضج فكره، كما يفعل الشعراء والعلماء.", "حل المشكلة: الأطروحة القائلة بتلازم اللغة والفكر مشروعة ويمكن تبنيها، لأن اللغة ليست مجرد ثوب للفكر بل هي أداة تكوينه ووسيلة وضوحه، والفكر يتجسد في اللغة كما تتجسد الروح في الجسد."], "answer": "الأطروحة مشروعة: الفكر يتكوّن ويتضح داخل اللغة، والعجز عن التعبير دليل على فكرة غير ناضجة."}, {"id": "philo-06", "chapters": ["فلسفة الرياضيات (الرياضيات والمطلقية)"], "title": "هل ما زالت الحقيقة الرياضية مطلقة؟", "level": "باك", "minutes": 60, "statement": ["هل ما زالت الحقيقة الرياضية مطلقة يقينية؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: اعتُبرت الرياضيات طويلاً نموذج اليقين، فنتائجها ضرورية لا يختلف حولها اثنان. لكن ظهور هندسات جديدة في القرن التاسع عشر أحدث أزمة في هذا اليقين. فهل ما زالت الحقيقة الرياضية مطلقة، أم أصبحت نسبية؟", "الموقف الأول: يرى الرياضيون والفلاسفة التقليديون، من إقليدس إلى ديكارت وكانط، أن الحقيقة الرياضية مطلقة ويقينية، صادقة في كل زمان ومكان.", "الحجج: تقوم الرياضيات على مبادئ بديهية واضحة بذاتها، مثل «الكل أكبر من الجزء»، وعلى تعريفات دقيقة ومسلمات، ثم تستنتج منها النتائج بالبرهان الاستنتاجي الصارم. وقد اتخذ ديكارت الرياضيات نموذجاً لمنهجه بسبب وضوحها ويقينها.", "وهندسة إقليدس صمدت أكثر من عشرين قرناً، وقضاياها مثل «مجموع زوايا المثلث 180 درجة» بدت حقائق ضرورية. ورأى كانط أن المكان والزمان صورتان قبليتان في العقل، مما يعطي الرياضيات صدقاً كلياً.", "النقد: هذا الموقف اهتز مع ظهور الهندسات اللاإقليدية، التي بينت أن مسلمة التوازي ليست بديهية، وأن تغييرها يعطي أنظمة رياضية جديدة متماسكة.", "الموقف الثاني: يرى الرياضيون المعاصرون، وأنصار النزعة الأكسيومية، أن الحقيقة الرياضية نسبية، مرتبطة بالمسلمات التي ننطلق منها، وصدقها هو عدم تناقضها مع مبادئها.", "الحجج: انطلق لوباتشيفسكي من أنه يمكن رسم عدد لا نهائي من الموازيات لمستقيم من نقطة خارجه، فحصل على هندسة يكون فيها مجموع زوايا المثلث أقل من 180 درجة. وانطلق ريمان من عدم وجود أي مواز، فكان المجموع أكبر من 180 درجة.", "كل هذه الهندسات صحيحة داخل نسقها، بل استُعملت هندسة ريمان في نظرية النسبية لأينشتاين. كما بيّن كورت غودل سنة 1931 أن أي نسق رياضي متماسك يتضمن الحساب يحتوي على قضايا لا يمكن البرهنة على صحتها ولا على خطئها داخله.", "النقد: القول بالنسبية لا يعني أن الرياضيات فقدت دقتها، فالاستنتاج داخل النسق يبقى ضرورياً يقينياً، والرياضيات ما زالت أدق العلوم وأداة العلم الحديث.", "التركيب: الحقيقة الرياضية لم تعد مطلقة بمعنى أنها صادقة على الواقع بإطلاق، لكنها تبقى يقينية بمعنى صحة الاستنتاج انطلاقاً من مسلمات معينة. فاليقين انتقل من المبادئ إلى سلامة البناء المنطقي.", "حل المشكلة: الحقيقة الرياضية اليوم نسبية بالنظر إلى المسلمات، ويقينية بالنظر إلى البرهان، وهذا يعبر عن تطور الفكر الرياضي لا عن ضعفه."], "answer": "الحقيقة الرياضية نسبية إلى المسلمات (الهندسات اللاإقليدية، غودل) لكنها تبقى يقينية في صحة الاستنتاج داخل النسق."}, {"id": "philo-07", "chapters": ["العلوم التجريبية والمنهج التجريبي"], "title": "مكانة الفرضية في المنهج التجريبي", "level": "باك", "minutes": 60, "statement": ["هل للفرضية دور ضروري في المنهج التجريبي؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: يمر المنهج التجريبي بخطوات: الملاحظة، الفرضية، التجربة، القانون. والفرضية فكرة مؤقتة يقترحها العالم لتفسير الظاهرة. لكن بعض العلماء يرون أنها خيال قد يبعد العالم عن الواقع. فهل الفرضية ضرورية في البحث التجريبي، أم يمكن الاستغناء عنها؟", "الموقف الأول: يرى أنصار النزعة التجريبية، مثل فرانسيس بيكون وجون ستيوارت ميل، أن الفرضية غير ضرورية بل خطيرة، وأن على العالم أن يكتفي بالملاحظة والتجربة.", "الحجج: الفرضية من إنتاج العقل والخيال، وقد تدفع العالم إلى رؤية ما يريد في الوقائع بدل رؤيتها كما هي. لذلك اقترح بيكون ألواح الحضور والغياب والتفاوت في الدرجات، واقترح ميل قواعد الاستقراء (الاتفاق، الاختلاف، التغير النسبي، البواقي)، ليتمكن العالم من استخلاص القانون من الوقائع مباشرة.", "كما تُنسب إلى نيوتن عبارة «أنا لا أصطنع الفرضيات»، تعبيراً عن الحذر من التفسيرات غير المؤسسة على التجربة.", "النقد: الوقائع لا تتكلم من تلقاء نفسها، والملاحظة دون فكرة توجهها ملاحظة عمياء. كما أن قواعد ميل نفسها تفترض وجود فكرة مسبقة حول العلاقة المراد اختبارها. ونيوتن نفسه استعمل فرضيات في أبحاثه.", "الموقف الثاني: يرى كلود برنار وهنري بوانكاريه أن الفرضية خطوة ضرورية، لأنها الفكرة التي توجه البحث وتحوله من تسجيل للوقائع إلى تفسير لها.", "الحجج: يرى كلود برنار أن الفكرة المسبقة هي نقطة انطلاق كل استدلال تجريبي، وأن الفرضية هي التي تحدد نوع التجربة التي يجب إجراؤها. وقد بنى أبحاثه على فرضيات اختبرها، كتجربته على بول الأرانب وعلاقته بالغذاء.", "ويرى بوانكاريه أن التجربة دون فكرة مسبقة مستحيلة، لأنها ستكون عقيمة. كما أن تاريخ العلم مليء بالاكتشافات التي بدأت بفرضيات جريئة.", "النقد: الفرضية قد تكون خاطئة، والعالم قد يتعصب لفكرته. لذلك يشترط كلود برنار أن يترك العالم فرضيته عند باب المختبر، أي أن يُخضعها للتجربة بكل موضوعية.", "التركيب: الفرضية ضرورية لكن بشرط أن تكون مراقبة بالتجربة. فالعلم حوار بين العقل والواقع، وهو ما عبّر عنه غاستون باشلار بالعقلانية المطبقة: العقل يقترح والتجربة تحكم.", "حل المشكلة: للفرضية دور ضروري في المنهج التجريبي لأنها توجه البحث وتفسر الوقائع، لكن قيمتها مرهونة بخضوعها للتجربة التي تؤكدها أو تنفيها."], "answer": "الفرضية ضرورية لتوجيه البحث بشرط أن تخضع للتحقيق التجريبي: العقل يقترح والتجربة تحكم."}, {"id": "philo-08", "chapters": ["علوم المادة الحية (البيولوجيا)"], "title": "الدفاع عن تجريب المادة الحية", "level": "باك", "minutes": 60, "statement": ["«يمكن تطبيق المنهج التجريبي على المادة الحية». دافع عن هذه الأطروحة.", "الطريقة: استقصاء بالوضع"], "solution": ["طرح المشكلة: يرى بعض الفلاسفة والعلماء أن المادة الحية تختلف عن المادة الجامدة اختلافاً يمنع دراستها بالمنهج التجريبي الدقيق. لكن هناك أطروحة ترى أن البيولوجيا علم تجريبي كالفيزياء والكيمياء. فكيف ندافع عن هذه الأطروحة؟", "عرض منطق الأطروحة: يرى كلود برنار، رائد الطب التجريبي، ومعه علماء البيولوجيا المعاصرون، أن الظواهر الحية تخضع لمبدأ الحتمية مثل الظواهر الجامدة، وأن نفس الأسباب تؤدي إلى نفس النتائج في نفس الظروف، لذا يمكن دراستها تجريبياً.", "الحجة الأولى: أثبت كلود برنار تجريبياً دور الكبد في إنتاج السكر (الوظيفة الغليكوجينية)، وبيّن أن الوسط الداخلي للعضوية خاضع لقوانين دقيقة. ورأى أن الكائن الحي مجموعة ظواهر فيزيائية وكيميائية معقدة لكنها قابلة للدراسة.", "الحجة الثانية: تقدم البيولوجيا الحديثة دليلاً قوياً: فقد أثبت باستور بالتجربة أن الجراثيم تأتي من جراثيم أخرى ولا تتولد ذاتياً، واكتشف علم الوراثة قوانين انتقال الصفات، وأصبح العلماء يقرؤون الـ ADN ويعدّلونه وينتجون اللقاحات والأدوية بالتجربة.", "الحجة الثالثة: طور العلماء وسائل تتجاوز العوائق: الزرع الخلوي في المختبر، التجارب على حيوانات قريبة من الإنسان، الإحصاء لدراسة الفروق الفردية، والتصوير الطبي الذي يسمح بدراسة العضو داخل الجسم دون فصله.", "عرض موقف الخصوم ونقده: يرى خصوم الأطروحة، مثل جورج كوفييه، أن الكائن الحي كل لا يتجزأ، وأن عزل عضو عنه يعني موته وتغير طبيعته. ويضيفون أن لكل كائن فرديته، فلا يمكن تعميم النتائج، وأن التجريب على الإنسان يطرح مشكلات أخلاقية.", "لكن هذه العوائق حقيقية دون أن تكون مانعة: فالعلماء يدرسون الأعضاء داخل العضوية الحية، ويستعملون العينات الكبيرة والإحصاء لتجاوز الفروق الفردية، والمشكلة الأخلاقية تُعالج بقواعد الأخلاقيات الحيوية لا بالتخلي عن التجريب.", "حل المشكلة: الأطروحة مشروعة: يمكن تطبيق المنهج التجريبي على المادة الحية، بشرط تكييفه مع خصوصيتها واحترام كرامة الإنسان، والنتائج المذهلة للطب والبيولوجيا الحديثة أكبر دليل على ذلك."], "answer": "الأطروحة مشروعة: الظواهر الحية تخضع للحتمية، والمنهج التجريبي يطبق عليها مع تكييفه مع خصوصيتها واحترام الأخلاق."}, {"id": "philo-09", "chapters": ["العلوم الإنسانية (التاريخ، علم النفس، علم الاجتماع)"], "title": "موضوعية المعرفة التاريخية", "level": "باك", "minutes": 60, "statement": ["هل يمكن للتاريخ أن يكون علماً موضوعياً؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: التاريخ دراسة لأحداث الماضي الإنساني. وقد سعى المؤرخون إلى جعله علماً مثل العلوم الطبيعية. لكن الحادثة التاريخية مضت ولا تتكرر، والمؤرخ إنسان له انتماؤه. فهل يمكن للتاريخ أن يبلغ الموضوعية العلمية، أم أن الذاتية تبقى ملازمة له؟", "الموقف الأول: يرى بعض المفكرين أن التاريخ لا يمكن أن يكون علماً موضوعياً بسبب طبيعة موضوعه وطبيعة المؤرخ.", "الحجج: الحادثة التاريخية فريدة لا تتكرر، فلا يمكن ملاحظتها مباشرة ولا إجراء تجربة عليها. والمؤرخ يعتمد على وثائق قد تكون ناقصة أو مزيفة. كما أنه ينتمي إلى أمة وعصر وإيديولوجيا، فيختار الأحداث ويؤولها حسب قناعاته، ولذلك تختلف روايات المؤرخين للحدث نفسه.", "ويضاف إلى ذلك أنه لا يمكن صياغة قوانين عامة تسمح بالتنبؤ بالأحداث المستقبلية كما في الفيزياء.", "النقد: هذه العوائق لا تمنع البحث التاريخي، بل تدفع إلى تطوير منهج خاص به. فالعلوم لا تشترط كلها التجربة المخبرية، فالجيولوجيا والفلك مثلاً تدرس ظواهر ماضية أو بعيدة.", "الموقف الثاني: يرى المؤرخون المنهجيون أن التاريخ يمكن أن يكون علماً موضوعياً إذا اتبع منهجاً نقدياً صارماً. وقد سبق ابن خلدون إلى ذلك في «المقدمة»، حين انتقد المؤرخين الذين ينقلون الأخبار دون تمحيص.", "الحجج: وضع ابن خلدون قواعد لنقد الأخبار، منها عرضها على طبيعة العمران وقوانين الاجتماع، والتحقق من الرواة. وأكد المؤرخان لانغلوا وسينيوبوس أهمية الوثيقة بقولهما: «لا وثائق، لا تاريخ».", "يقوم المنهج التاريخي على: جمع الوثائق والآثار، ثم النقد الخارجي (التحقق من صحة الوثيقة وزمنها ومصدرها) والنقد الداخلي (فحص مضمونها وصدق كاتبها)، ثم التركيب والتفسير. وتساعد العلوم المساعدة، كالتأريخ بالكربون المشع وعلم الآثار، على الدقة.", "النقد: رغم هذه القواعد تبقى ذاتية المؤرخ حاضرة في اختيار الموضوع وتفسير الأسباب، وتبقى الوثائق ناقصة أحياناً.", "التركيب: التاريخ علم من نوع خاص: لا يبلغ موضوعية الفيزياء، لكنه يقترب منها بقدر التزام المؤرخ بالمنهج النقدي وبالنزاهة. فالموضوعية في التاريخ هدف نسعى إليه ونقترب منه، وليست أمراً مكتملاً.", "حل المشكلة: يمكن للتاريخ أن يكون علماً موضوعياً نسبياً، إذا اعتمد على الوثائق ونقدها، وتحلى المؤرخ بالروح العلمية والحياد."], "answer": "التاريخ علم بموضوعية نسبية: يقترب من الموضوعية بالمنهج النقدي (ابن خلدون، النقد الخارجي والداخلي) رغم بقاء أثر الذاتية."}, {"id": "philo-10", "chapters": ["الأخلاق والعدل"], "title": "العدل والمساواة", "level": "باك", "minutes": 60, "statement": ["هل يقتضي العدل المساواة المطلقة بين الناس؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: العدل قيمة أخلاقية واجتماعية يطمح إليها كل مجتمع. لكن الناس يختلفون في قدراتهم وجهودهم وحاجاتهم. فهل العدل أن نعامل الجميع معاملة واحدة، أم أن العدل يقتضي مراعاة الفروق بين الأفراد؟", "الموقف الأول: يرى أنصار المساواة، من الرواقيين إلى فلاسفة الحق الطبيعي مثل جون لوك، أن الناس متساوون بطبيعتهم، وأن العدل هو المساواة بينهم في الحقوق والواجبات.", "الحجج: يشترك الناس في الطبيعة الإنسانية وفي العقل، فلا مبرر للتمييز بينهم. ويرى كانط أن لكل إنسان كرامة تجعله غاية في ذاته لا وسيلة. وقد أعلنت مواثيق حقوق الإنسان أن الناس يولدون أحراراً متساوين في الكرامة والحقوق.", "كما أن الأديان السماوية ساوت بين الناس في أصل الخلقة، وجعلت التفاضل بالعمل الصالح لا بالنسب أو اللون.", "النقد: المساواة المطلقة قد تتحول إلى ظلم، فمساواة المجتهد بالكسول في الجزاء ظلم للمجتهد، ومساواة المريض بالسليم في المعاملة تتجاهل حاجة المريض.", "الموقف الثاني: يرى آخرون أن العدل يقتضي مراعاة التفاوت بين الناس. فقد قسّم أفلاطون المجتمع إلى طبقات (حكام، حراس، منتجين) حسب قوى النفس الغالبة على كل فرد. ورأى أرسطو أن العدل التوزيعي يقوم على إعطاء كل واحد حسب استحقاقه.", "الحجج: الطبيعة نفسها تفاوت بين الناس في الذكاء والقوة والمواهب، وهو ما أكده ألكسيس كاريل من منظور بيولوجي. كما أن التفاوت في الجزاء حافز على العمل والاجتهاد. أما نيتشه فاعتبر المساواة أخلاق الضعفاء، ورأى أن الأقوياء أحق بالسيادة.", "النقد: هذا الموقف قد يُستعمل لتبرير الظلم والعنصرية والاستعباد، كما حدث في التاريخ. والتفاوت الطبيعي لا يبرر التفاوت في الحقوق الأساسية.", "التركيب: العدل يجمع بين المساواة والإنصاف. يقترح جون رولز نظرية «العدالة كإنصاف»: مساواة الجميع في الحقوق والحريات الأساسية، مع قبول التفاوتات الاجتماعية والاقتصادية فقط إذا كانت مفتوحة للجميع (تكافؤ الفرص) وتعود بالنفع على الأقل حظاً.", "حل المشكلة: العدل لا يعني المساواة المطلقة، بل المساواة في الحقوق والكرامة وتكافؤ الفرص، مع مراعاة الجهد والاستحقاق وحاجات الضعفاء."], "answer": "العدل مساواة في الحقوق والكرامة وتكافؤ الفرص، مع إنصاف يراعي الاستحقاق وحاجات الأضعف (رولز)."}, {"id": "philo-11", "chapters": ["الحرية والمسؤولية"], "title": "الحرية والحتميات", "level": "باك", "minutes": 60, "statement": ["هل يمكن الحديث عن حرية الإنسان في ظل الحتميات التي تحيط به؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: يشعر الإنسان بأنه يختار أفعاله، ولذلك يُحاسَب عليها. لكن العلوم تكشف أن سلوكه يتأثر بعوامل بيولوجية ونفسية واجتماعية لا يختارها. فهل الإنسان حر في أفعاله، أم أنه مقيد بحتميات تسيّره؟", "الموقف الأول: يرى أنصار الحرية، كالمعتزلة في الفكر الإسلامي وديكارت وجان بول سارتر، أن الإنسان حر حرية حقيقية، وأنه صانع أفعاله.", "الحجج: يرى المعتزلة أن الإنسان خالق أفعاله، ولولا ذلك لكان التكليف والحساب ظلماً، والله منزه عن الظلم. ويرى ديكارت أن الحرية حقيقة بديهية نشعر بها مباشرة حين نتردد ونختار.", "أما سارتر فيرى أن الإنسان يوجد أولاً ثم يصنع ماهيته بأفعاله، وأنه «محكوم عليه أن يكون حراً»، فلا يستطيع التهرب من الاختيار ولا من المسؤولية.", "النقد: الشعور بالحرية ليس دليلاً كافياً، فقد نشعر بالحرية ونحن نجهل الأسباب التي تحركنا. وهذا الموقف يتجاهل تأثير الوراثة والتربية والمجتمع.", "الموقف الثاني: يرى أنصار الحتمية، كالجبرية في الفكر الإسلامي (جهم بن صفوان) وسبينوزا وعلماء النفس والاجتماع، أن الإنسان مسيّر بأسباب تتجاوزه.", "الحجج: يرى الجبرية أن الإنسان لا قدرة له، وأن أفعاله تجري عليه. ويرى سبينوزا أن الناس يعتقدون أنهم أحرار لأنهم يعون رغباتهم ويجهلون الأسباب التي تحددها.", "وتؤكد العلوم الإنسانية هذه الفكرة: فرويد يرد السلوك إلى دوافع لا شعورية، ودوركايم يرى أن المجتمع يفرض على الفرد طرق تفكيره وعمله. كما أن الوراثة تحدد كثيراً من استعداداتنا.", "النقد: إنكار الحرية يُسقط المسؤولية الأخلاقية والقانونية، ويجعل العقاب والثواب بلا معنى. كما أن الإنسان استطاع عبر التاريخ أن يتحدى ظروفه ويغيرها.", "التركيب: الحرية ليست غياب الحتميات، بل هي القدرة على معرفتها والتعامل معها. فالعلم بقوانين الطبيعة جعل الإنسان يطير رغم الجاذبية. وهي فكرة نجدها عند هيغل وأعاد صياغتها إنجلز: الحرية هي وعي الضرورة. وفي الفكر الإسلامي اقترح الأشاعرة نظرية الكسب توفيقاً بين قدرة الله ومسؤولية الإنسان.", "حل المشكلة: الإنسان ليس حراً حرية مطلقة ولا مقيداً تقييداً تاماً؛ فالحرية تحرر تدريجي يكتسبه بمعرفة الحتميات وتجاوزها، وعليه تقوم مسؤوليته."], "answer": "الحرية ليست مطلقة ولا منعدمة: هي تحرر يكتسبه الإنسان بمعرفة الحتميات وتجاوزها، وعليه تقوم المسؤولية."}, {"id": "philo-12", "chapters": ["الإحساس والإدراك"], "title": "الإدراك: جمع للإحساسات أم بناء كلي؟", "level": "باك", "minutes": 60, "statement": ["هل الإدراك مجرد مجموع للإحساسات؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: الإحساس هو أثر نفسي ينتج عن تنبيه عضو حسي، والإدراك هو معرفة الأشياء وتحديد معناها. حين أرى كتاباً أدركه ككتاب لا كمجموعة ألوان وخطوط. فهل الإدراك مجرد جمع للإحساسات الجزئية، أم أنه عملية كلية تتجاوزها؟", "الموقف الأول: يرى أنصار النزعة الحسية والترابطية، مثل جون لوك ودافيد هيوم وكوندياك، أن الإدراك ليس إلا مجموعة إحساسات مترابطة، وأن العقل يولد صفحة بيضاء.", "الحجج: يرى لوك أنه لا يوجد في العقل شيء لم يمر قبل ذلك بالحواس. وتخيل كوندياك تمثالاً يكتسب الحواس واحدة بعد أخرى، فتتكون معارفه تدريجياً من تراكم الإحساسات. والدليل أن فاقد حاسة يفقد الإدراكات المرتبطة بها، فالأعمى منذ الولادة لا يدرك الألوان.", "النقد: هذا الموقف يجعل الإدراك سلبياً ويهمل دور العقل والذات. كما أن التجربة تبين أننا ندرك الشكل الكلي قبل أجزائه.", "الموقف الثاني: يرى أنصار نظرية الشكل (الجشطالت)، مثل كوفكا وكوهلر وفرتهايمر، أن الإدراك إدراك لكليات منظمة، وأن الكل سابق على الأجزاء وأكثر من مجموعها.", "الحجج: ندرك اللحن كوحدة رغم تغير النغمات إذا عُزف بمقام آخر. وندرك الأشياء حسب قوانين التنظيم: التقارب (النقاط المتقاربة تُدرك كمجموعة)، والتشابه، والإغلاق (نكمل الشكل الناقص). كما بيّن العقلانيون كديكارت، بمثال قطعة الشمع التي تتغير صفاتها الحسية ونبقى ندركها، أن الإدراك حكم عقلي.", "النقد: نظرية الشكل تبالغ في إعطاء الأهمية للعوامل الموضوعية، وتهمل دور الذات وخبرتها وثقافتها. فالطبيب يدرك في صورة الأشعة ما لا يدركه غيره.", "التركيب: يرى ميرلوبونتي أن الإدراك عملية تتداخل فيها الإحساسات والعقل والجسد والخبرة: نحن ندرك العالم بجسدنا الحي، ونعطيه معنى من خلال تجربتنا. فالإحساس مادة أولية ضرورية، والعقل والبنية الكلية والخبرة تنظمها.", "حل المشكلة: الإدراك ليس مجرد جمع للإحساسات، بل هو نشاط كلي يتدخل فيه الإحساس والعقل والشكل والتجربة الشخصية والاجتماعية."], "answer": "الإدراك ليس مجموع إحساسات: هو نشاط كلي يتدخل فيه الإحساس والعقل وتنظيم الشكل والخبرة."}, {"id": "philo-13", "chapters": ["الخيال والإبداع"], "title": "الإبداع بين الإلهام والجهد", "level": "باك", "minutes": 60, "statement": ["هل الإبداع وليد الإلهام أم ثمرة الجهد والظروف؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: الإبداع إنتاج جديد أصيل في العلم أو الفن أو التقنية. وقد يبدو أن المبدع تأتيه الفكرة فجأة دون سابق إنذار، لكننا نعلم أيضاً أن المبدعين يعملون سنوات طويلة. فهل الإبداع هبة وإلهام مفاجئ، أم أنه نتيجة جهد وشروط نفسية واجتماعية؟", "الموقف الأول: يرى أنصار نظرية الإلهام، منذ أفلاطون، أن الإبداع هبة خارجية أو موهبة فطرية، تأتي المبدع دون أن يتحكم فيها.", "الحجج: يرى أفلاطون في محاورة «إيون» أن الشاعر لا يبدع بالصنعة بل بإلهام ينزل عليه، فيكون كالمأخوذ. وكان العرب يعتقدون أن لكل شاعر شيطاناً يلهمه. وروى بوانكاريه أن حل مسألة رياضية شغلته طويلاً خطر له فجأة حين وضع قدمه على درج حافلة، وهو منشغل بأمر آخر.", "النقد: هذا الموقف يجعل الإبداع لغزاً لا يُفسر، ويقلل من قيمة العمل. ثم إن الإلهام لم يأت بوانكاريه إلا بعد طول تفكير في المسألة.", "الموقف الثاني: يرى آخرون أن الإبداع ثمرة جهد ومثابرة، وأنه مشروط بظروف نفسية واجتماعية. وتُنسب إلى إديسون عبارة إن العبقرية واحد بالمائة إلهام وتسعة وتسعون بالمائة عرق وجهد.", "الحجج: المجتمع يوفر للمبدع اللغة والمعارف والوسائل ويطرح عليه المشكلات، ولذلك تزدهر الاختراعات في المجتمعات التي تشجع البحث. ويرى دوركايم أن المبدع ابن بيئته. ومن الناحية النفسية يرى فرويد أن الإبداع الفني تسامٍ بالرغبات المكبوتة نحو أهداف راقية. كما أن تاريخ العلم يبين أن الاكتشافات تراكمية.", "النقد: لو كان الإبداع نتيجة الظروف والجهد وحدهما لكان كل من يعيش نفس الظروف ويبذل نفس الجهد مبدعاً، والواقع يبين غير ذلك.", "التركيب: الإبداع ثمرة تفاعل بين الاستعداد الشخصي والجهد والظروف المناسبة. والإلهام نفسه ليس سوى لحظة نضج تأتي بعد عمل طويل، وهو ما يعبر عنه قول باستور: الصدفة لا تخدم إلا العقول المهيأة.", "حل المشكلة: الإبداع ليس هبة مفاجئة فقط ولا مجرد جهد آلي، بل هو نتيجة موهبة يصقلها العمل، في ظروف اجتماعية تحفزها."], "answer": "الإبداع تفاعل بين الموهبة والجهد والظروف؛ الإلهام لحظة نضج بعد عمل طويل."}, {"id": "philo-14", "chapters": ["المنطق الصوري والمنطق المادي"], "title": "المنطق الصوري والمنطق المادي", "level": "باك", "minutes": 60, "statement": ["قارن بين المنطق الصوري والمنطق المادي.", "الطريقة: مقارنة"], "solution": ["طرح المشكلة: المنطق علم قواعد التفكير الصحيح. وقد وضع أرسطو المنطق الصوري، ثم ظهر في العصر الحديث المنطق المادي (الاستقرائي) مع تطور العلوم التجريبية. فما الذي يميز كلا منهما؟ وهل هما متعارضان أم متكاملان؟", "أوجه الاختلاف (1): المنطق الصوري، الذي أسسه أرسطو في كتبه المعروفة بالأورغانون، يهتم بصورة الفكر وانسجامه مع نفسه بغض النظر عن مضمونه. أما المنطق المادي، الذي أسسه فرانسيس بيكون في «الأورغانون الجديد» وطوره جون ستيوارت ميل، فيهتم بمطابقة الفكر للواقع.", "أوجه الاختلاف (2): يعتمد المنطق الصوري على الاستنتاج، الانتقال من العام إلى الخاص، وأبرز صوره القياس: كل إنسان فان، سقراط إنسان، إذن سقراط فان. ويقوم المنطق المادي على الاستقراء، الانتقال من حالات جزئية ملاحظة إلى قانون عام.", "أوجه الاختلاف (3): معيار الصدق في المنطق الصوري هو عدم التناقض واحترام مبادئ العقل (الهوية، عدم التناقض، الثالث المرفوع). ومعيار الصدق في المنطق المادي هو التجربة. والنتيجة في الأول ضرورية لكنها لا تضيف جديداً، وفي الثاني احتمالية لكنها تضيف معرفة جديدة.", "النقد المتبادل: انتقد بيكون القياس الأرسطي واعتبره عقيماً لا يكشف حقائق جديدة. وفي التراث الإسلامي انتقد ابن تيمية المنطق الأرسطي في كتابه «الرد على المنطقيين». وفي المقابل يؤخذ على الاستقراء أن تعميمه يتجاوز الحالات الملاحظة.", "أوجه التشابه: كلاهما منطق يهدف إلى عصمة الفكر من الخطأ والوصول إلى الحقيقة. وكلاهما يعتمد على العقل ويضع قواعد منهجية، ويحترم المبادئ العقلية الأساسية كمبدأ عدم التناقض.", "أوجه التداخل: يحتاج الاستقراء إلى الاستنتاج، فالعالم حين يضع فرضية يستنتج منها نتائج ثم يختبرها بالتجربة. وفي المقابل، كثير من المقدمات الكبرى للقياس مثل «كل معدن يتمدد بالحرارة» مستمدة من الاستقراء. فالمنطقان يعملان معاً داخل المنهج العلمي.", "حل المشكلة: المنطق الصوري يضمن اتساق الفكر مع ذاته، والمنطق المادي يضمن اتساقه مع الواقع؛ وهما رغم اختلافهما متكاملان، لأن المعرفة الصحيحة تحتاج إلى فكر سليم البناء وإلى مطابقة للواقع."], "answer": "الصوري: اتساق الفكر مع ذاته بالاستنتاج (أرسطو)؛ المادي: مطابقة الواقع بالاستقراء (بيكون، ميل)؛ متكاملان في المنهج العلمي."}, {"id": "philo-15", "chapters": ["الأنظمة السياسية والاقتصادية"], "title": "الرأسمالية والاشتراكية والعدالة الاجتماعية", "level": "باك", "minutes": 60, "statement": ["هل يحقق النظام الرأسمالي العدالة الاجتماعية أفضل من النظام الاشتراكي؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: تسعى الأنظمة الاقتصادية إلى تحقيق الرفاهية والعدالة. وقد تنافس نظامان كبيران في العصر الحديث: الرأسمالية القائمة على الملكية الخاصة والسوق الحرة، والاشتراكية القائمة على الملكية الجماعية وتدخل الدولة. فأيهما أقدر على تحقيق العدالة الاجتماعية؟", "الموقف الأول: يرى أنصار الرأسمالية، وعلى رأسهم آدم سميث، أن الحرية الاقتصادية والملكية الخاصة هما الطريق إلى الرفاهية والعدالة.", "الحجج: يرى آدم سميث أن الفرد حين يسعى إلى مصلحته الخاصة يخدم مصلحة المجتمع دون أن يقصد، كأن «يداً خفية» تنظم السوق. والمنافسة الحرة تحسن الجودة وتخفض الأسعار وتشجع الإبداع، ومبدأ «دعه يعمل دعه يمر» يحرر المبادرة. والعدل هنا أن ينال كل فرد ثمرة جهده.", "النقد: أثبت الواقع أن الرأسمالية تولد تفاوتاً كبيراً بين الأغنياء والفقراء، واحتكارات، وأزمات اقتصادية حادة كأزمة 1929 وأزمة 2008، واستغلالاً للعمال، وهذا ينافي العدالة الاجتماعية.", "الموقف الثاني: يرى أنصار الاشتراكية، وعلى رأسهم كارل ماركس، أن العدالة لا تتحقق إلا بإلغاء الملكية الخاصة لوسائل الإنتاج وجعلها ملكية جماعية.", "الحجج: يرى ماركس أن الرأسمالي يستغل العامل بأخذ «فائض القيمة»، أي الفرق بين قيمة ما ينتجه العامل وما يتقاضاه من أجر، وأن هذا يولد صراع الطبقات. والملكية الجماعية والتخطيط تضمن توزيعاً عادلاً للثروة وتوفر العمل والتعليم والصحة للجميع.", "النقد: أدى تطبيق الاشتراكية إلى بيروقراطية ثقيلة، وضعف الحوافز الفردية والإنتاجية، وتقييد الحريات. وقد انهار الاتحاد السوفييتي سنة 1991، مما بيّن حدود هذا النظام.", "التركيب: لا يحقق أي نظام في صورته الخالصة العدالة الكاملة. لذلك اتجهت أغلب الدول إلى اقتصاد مختلط: حرية السوق مع تدخل الدولة لحماية الضعفاء، كما دعا إلى ذلك كينز. ويقدم الاقتصاد الإسلامي تصوراً يجمع بين احترام الملكية الخاصة والتكافل الاجتماعي عبر الزكاة وتحريم الربا والاحتكار.", "حل المشكلة: العدالة الاجتماعية لا تتحقق بالحرية الاقتصادية وحدها ولا بالملكية الجماعية وحدها، بل بنظام يوازن بين حرية المبادرة وتدخل الدولة لضمان حقوق الجميع."], "answer": "لا الرأسمالية ولا الاشتراكية الخالصة تحقق العدالة؛ الحل نظام متوازن يجمع حرية المبادرة وتدخل الدولة والتكافل."}, {"id": "philo-16", "chapters": ["العنف والتسامح"], "title": "هل العنف ضروري للتغيير؟", "level": "باك", "minutes": 60, "statement": ["هل العنف ضروري لتحقيق التغيير في التاريخ والمجتمع؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: العنف استعمال القوة لإلحاق الضرر بالغير أو إخضاعه، والتسامح احترام الآخر المختلف وقبوله. وتاريخ البشرية مليء بالحروب والثورات، لكنه يعرف أيضاً حركات سلمية ناجحة. فهل العنف شر ضروري لتحقيق التغيير، أم أن التسامح والطرق السلمية أقدر على ذلك؟", "الموقف الأول: يرى بعض الفلاسفة أن العنف ضروري وملازم للتاريخ. فقد اعتبر هوبز أن الإنسان في حالة الطبيعة في حرب الكل ضد الكل، ورأى هيغل أن جدلية السيد والعبد صراع يصنع الوعي والتاريخ.", "الحجج: يرى ماركس أن العنف قابلة التاريخ، أي أن المجتمعات الجديدة تولد من رحم الصراع، وأن الطبقات المسيطرة لا تتخلى عن امتيازاتها طوعاً. وكتب فرانز فانون، انطلاقاً من تجربة الثورة الجزائرية، أن الاستعمار نظام قائم على العنف، وأن الشعوب المستعمرة لا تتحرر إلا بمقاومته.", "وفي الواقع لم تتحرر كثير من الشعوب إلا بالكفاح المسلح، ومنها الشعب الجزائري سنة 1962 بعد أن أُغلقت أمامه الطرق السلمية.", "النقد: تمجيد العنف خطير، لأنه يولد عنفاً مضاداً ويخلف دماراً وضحايا أبرياء. ثم إن هناك فرقاً بين العنف العدواني والمقاومة المشروعة ضد الظلم والاحتلال، التي يقرها القانون الدولي كحق للشعوب في تقرير مصيرها.", "الموقف الثاني: يرى دعاة التسامح واللاعنف أن التغيير الحقيقي يتحقق بالطرق السلمية. فقد دعا جون لوك في «رسالة في التسامح» إلى احترام الاختلاف الديني، ودافع فولتير عن التسامح ضد التعصب.", "الحجج: قاد غاندي الهند إلى الاستقلال بالمقاومة السلمية والعصيان المدني، وحقق مارتن لوثر كينغ مكاسب مدنية للسود في أمريكا دون سلاح. والحوار والتفاوض يحفظان الأرواح ويبنيان سلاماً دائماً، بينما العنف يترك الأحقاد.", "النقد: التسامح المطلق قد يتحول إلى ضعف أو قبول بالظلم، فلا يمكن التسامح مع من يرفض التسامح ويعتدي. كما أن الطرق السلمية لا تنجح دائماً أمام قوة لا تعترف إلا بالقوة.", "التركيب: الأصل في العلاقات الإنسانية هو التسامح والحوار، والعنف ليس قيمة في ذاته. لكن الدفاع عن النفس ومقاومة الظلم والاحتلال قد يصبحان ضرورة حين تُغلق الطرق السلمية. ويرى ماكس فيبر أن الدولة الحديثة تحتكر الاستعمال المشروع للقوة، لتحمي المجتمع من العنف الفوضوي.", "حل المشكلة: العنف ليس ضرورياً دائماً لتحقيق التغيير، فالتسامح والطرق السلمية هي الأصل، أما القوة فلا تكون مشروعة إلا دفاعاً عن الحق وفي إطار عادل."], "answer": "التسامح والحوار هما الأصل؛ العنف ليس ضرورياً دائماً، ولا يُقبل إلا كمقاومة مشروعة للظلم حين تنعدم البدائل."}, {"id": "philo-17", "chapters": ["العولمة"], "title": "العولمة والهوية الثقافية", "level": "باك", "minutes": 60, "statement": ["هل تشكل العولمة تهديداً للهويات الثقافية للشعوب؟", "الطريقة: جدلية"], "solution": ["طرح المشكلة: العولمة هي تزايد الترابط بين دول العالم في الاقتصاد والإعلام والثقافة، بفضل التكنولوجيا ووسائل الاتصال. وقد جعلت العالم أقرب، لكنها أثارت مخاوف من ذوبان الخصوصيات الثقافية. فهل العولمة خطر على هوية الشعوب، أم فرصة للتفتح والتطور؟", "الموقف الأول: يرى كثير من المفكرين أن العولمة تهدد الهويات الثقافية لأنها تفرض نموذجاً ثقافياً واحداً هو النموذج الغربي، وخاصة الأمريكي.", "الحجج: يميز المفكر المغربي محمد عابد الجابري بين «العالمية» التي تعني الانفتاح على ثقافات الآخرين مع الحفاظ على الذات، و«العولمة» التي تعني في نظره إرادة الهيمنة ونفي الخصوصيات. ويرى الفرنسي سيرج لاتوش أن ما يحدث هو «تغريب للعالم».", "ويلاحظ الواقع انتشار أنماط الاستهلاك نفسها واللباس نفسه والأغاني والأفلام نفسها، وتراجع اللغات المحلية أمام اللغات المهيمنة، وانجذاب الشباب إلى قيم بعيدة عن مجتمعاتهم.", "النقد: هذا الموقف يجعل الشعوب متلقية سلبية، والواقع أن الثقافات المحلية تقاوم وتتكيف، بل تستعمل وسائل العولمة نفسها للتعريف بنفسها. كما أن الانغلاق ليس حلاً.", "الموقف الثاني: يرى أنصار العولمة أنها فرصة للتقارب والتطور. وقد تنبأ مارشال ماكلوهان بأن وسائل الاتصال ستجعل العالم «قرية كونية»، ورأى فرانسيس فوكوياما أن انتشار الديمقراطية الليبرالية يمثل «نهاية التاريخ».", "الحجج: تسمح العولمة بانتقال المعرفة والتكنولوجيا بسرعة، وتتيح للطالب الجزائري مثلاً الوصول إلى دروس أفضل الجامعات. كما تنشر قيماً إنسانية كحقوق الإنسان، وتسمح للثقافات المحلية بالتعريف بنفسها عالمياً، كالموسيقى والمطبخ والسياحة.", "النقد: هذا الموقف يتجاهل أن تبادل الثقافات غير متكافئ، فالدول القوية تملك وسائل الإعلام والإنتاج، والدول الضعيفة غالباً مستهلكة. وقد عرفت أطروحة فوكوياما انتقادات كثيرة بسبب استمرار الصراعات.", "التركيب: العولمة واقع لا يمكن رفضه، وهي تحمل مخاطر وفرصاً معاً. وأثرها على الهوية يتوقف على موقف الشعوب منها: فالشعب الذي يعرف تاريخه ويعتز بلغته وقيمه ويساهم في الإنتاج العلمي يستطيع أن يأخذ من العولمة ما يفيده دون أن يذوب فيها.", "حل المشكلة: العولمة تهدد الهويات المنغلقة أو الضعيفة، لكنها قد تغني الهويات الواثقة بنفسها؛ فالحل هو الانفتاح الواعي الذي يجمع بين الأصالة والمعاصرة."], "answer": "العولمة تهدد الهويات الضعيفة وتغني الواثقة بنفسها؛ الحل انفتاح واع يجمع الأصالة والمعاصرة."}]};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseYmd(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayDiff(a,b){return Math.round((parseYmd(ymd(b))-parseYmd(ymd(a)))/864e5)}
const today=()=>new Date();

/* ---------- data helpers ---------- */
function stream(){return BAC.streams.find(s=>s.id===S.stream)}
function chaptersOf(sub){
  if(sub.chapters_by_option&&S.option&&sub.chapters_by_option[S.option])return sub.chapters_by_option[S.option];
  return (sub.chapters||[]).map(c=>c.replace(/^\[[^\]]+\]\s*/,""));
}
function studySubjects(){
  return stream().subjects.filter(s=>!s.optional&&s.id!=="pe"&&s.id!=="amazigh").map(s=>({...s,chapters:chaptersOf(s)}));
}
function weightOf(s){const lv=(S.levels&&S.levels[s.id])||2;return s.coefficient*LEVELS.find(l=>l.v===lv).f}
function priority(){return studySubjects().map(s=>({...s,w:weightOf(s)})).sort((a,b)=>b.w-a.w)}
function subjName(id){const s=stream().subjects.find(x=>x.id===id);return s?s.name_ar.replace(/\s*\(.*\)$/,""):id}
function color(id){return SUBJ_COLORS[id]||"#5B6278"}

/* ---------- plan: smooth weighted round-robin from start date ---------- */
let planCache=null;
function planSeq(n){
  const key=JSON.stringify([S.stream,S.option,S.mode,S.levels,n]);
  if(planCache&&planCache.key===key)return planCache.seq;
  const subs=priority();const total=subs.reduce((a,s)=>a+s.w,0);const cur={};subs.forEach(s=>cur[s.id]=0);
  const seq=[];
  for(let i=0;i<n;i++){let best=null;subs.forEach(s=>{cur[s.id]+=s.w;if(!best||cur[s.id]>cur[best.id])best=s});cur[best.id]-=total;seq.push(best.id)}
  planCache={key,seq};return seq;
}
function sessionsFor(date){
  const m=MODES[S.mode];const di=Math.max(0,dayDiff(parseYmd(S.start),date));
  let per=m.per; if(date.getDay()===5&&S.mode==="strong")per=3; // الجمعة أخف
  const seq=planSeq((di+8)*m.per);const out=[];
  const toBac=daysToBac(date);
  for(let i=0;i<per;i++){
    const id=seq[di*m.per+i];const sub=studySubjects().find(s=>s.id===id);
    const done=(S.chapDone[id]||[]);const next=sub.chapters.findIndex((c,j)=>!done.includes(j));
    let kind,label;
    if(toBac<=30||next===-1){kind="paper";label="حل موضوع باك سابق وتصحيحه"}
    else if(i===per-1&&S.mode==="strong"){kind="ex";label="تمارين: "+sub.chapters[next]}
    else{kind="learn";label=sub.chapters[next]}
    out.push({key:ymd(date)+"#"+i,id,label,kind,min:m.min});
  }
  return out;
}

/* ---------- log, streak, mood ---------- */
function dayLog(d){return S.log[ymd(d)]||{done:[],min:0}}
function studied(d){return dayLog(d).done.length>0}
function streak(){let n=0,d=today();if(!studied(d))d=addDays(d,-1);while(studied(d)){n++;d=addDays(d,-1)}return n}
function lastStudy(){const ks=Object.keys(S.log).filter(k=>S.log[k].done.length).sort();return ks.length?parseYmd(ks[ks.length-1]):null}
function missedDays(){const l=lastStudy();const ref=l||addDays(parseYmd(S.start),-1);return Math.max(0,dayDiff(ref,today())-1)}
function mood(){
  const t=today();
  if(studied(t))return "happy";
  const miss=missedDays();
  if(!lastStudy()&&dayDiff(parseYmd(S.start),t)<=0)return "neutral";
  if(miss===0){const [h,mi]=S.remind.split(":").map(Number);return (t.getHours()*60+t.getMinutes()>=h*60+mi)?"worried":"neutral"}
  if(miss===1)return "worried";
  return "sad";
}
function daysToBac(from){return dayDiff(from||today(),parseYmd(S.bacDate))}
function pick(arr,seed){return arr[Math.abs(seed)%arr.length]}
function fill(s,extra){
  const nx=sessionsFor(today()).find(x=>!dayLog(today()).done.includes(x.key));
  return s.replace(/\{name\}/g,S.name).replace(/\{days\}/g,extra&&extra.days!=null?extra.days:daysToBac()).replace(/\{streak\}/g,streak())
    .replace(/\{subject\}/g,extra&&extra.subject||(nx?subjName(nx.id):"")).replace(/\{minutes\}/g,extra&&extra.minutes||"");
}
function heroMessage(md){
  const seed=dayDiff(new Date(2026,0,1),today());const d=daysToBac();
  if(md==="sad")return fill(pick(MSG.missed_several_days,seed),{days:missedDays()});
  if(md==="worried"&&missedDays()>=1)return fill(pick(MSG.missed_one_day,seed));
  if(md==="happy"){const all=sessionsFor(today()).every(x=>dayLog(today()).done.includes(x.key));
    if(all)return fill(pick(MSG.daily_goal_done,seed));return fill(pick(MSG.streak_kept,seed))}
  if(d<=30&&d>=0)return fill(pick(MSG.exam_close,seed));
  return fill(pick(today().getHours()<15?MSG.greeting_morning:MSG.greeting_evening,seed));
}

const FLAME='<svg class="flame" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.2c0-2 1-3.4 2.2-4.5.2 1.6 1 2.7 2.2 3.1C11 9 11.4 5 12 2zm0 20a7 7 0 0 1-7-7c0 .4 0 0 0 0a7 7 0 0 0 14 0 7 7 0 0 1-7 7z"/></svg>';
function bacParts(){const ms=parseYmd(S.bacDate).setHours(8,0,0,0)-Date.now();if(ms<=0)return null;const s=Math.floor(ms/1000);return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
function cdCard(){const p=bacParts();const st=parseYmd(S.start),end=parseYmd(S.bacDate);const tot=Math.max(1,dayDiff(st,end)),gone=Math.min(tot,Math.max(0,dayDiff(st,today())));

/* 1) average calculator: sum(grade×coef)/sum(coef); optional subjects add only points above 10 */

function calcAvg(){const g=(S.grades&&S.grades[S.stream])||{};let num=0,coef=0,totalC=0,bonus=0;

    totalC+=s.coefficient;if(v!=null){num+=v*s.coefficient;coef+=s.coefficient}});
  return {avg:coef?(num+bonus)/coef:null,num:num+bonus,coef,totalC,complete:coef===totalC}}
const fmtAvg=a=>a==null?"—":(Math.round(a*100)/100).toFixed(2);
function mention(a){return a>=18?"ممتاز":a>=16?"جيد جداً":a>=14?"جيد":a>=12?"قريب من الجيد":a>=10?"مقبول":"راسب"}

/* ---------- game: سباق التواريخ ---------- */
const MONTHS=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function hdFmt(d){const p=d.split("-").map(Number);return p.length===3?`${p[2]} ${MONTHS[p[1]-1]} ${p[0]}`:p.length===2?`${MONTHS[p[1]-1]} ${p[0]}`:String(p[0])}
const hdYear=d=>+d.slice(0,4);const hdKey=d=>{const p=d.split("-").map(Number);return p[0]*10000+(p[1]||6)*100+(p[2]||15)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gstate(){S.game=S.game||{best:0,plays:0,seen:{},wrong:{},right:{}};return S.game}
function pickEvent(pool,used){const g=gstate();let tot=0;const ws=pool.filter(e=>!used.has(e.id)).map(e=>{const w=Math.max(.3,1+(g.seen[e.id]?0:2)+3*(g.wrong[e.id]||0)-.7*Math.min(3,g.right[e.id]||0));tot+=w;return [e,w]});
  let r=Math.random()*tot;for(const [e,w] of ws){r-=w;if(r<=0)return e}return ws.length?ws[ws.length-1][0]:pool[0]}
function nearDates(e,pool){const prec=e.d.split("-").length;const fmtC=hdFmt(e.d);const out=new Set();
  const cands=pool.filter(x=>x.id!==e.id&&x.d.split("-").length===prec).sort((a,b)=>Math.abs(hdYear(a.d)-hdYear(e.d))-Math.abs(hdYear(b.d)-hdYear(e.d)));
  for(const c of cands.slice(0,6)){const f=hdFmt(c.d);if(f!==fmtC)out.add(f)}
  const p=e.d.split("-");[1,-1,2,-2].forEach(k=>{const f=hdFmt([+p[0]+k,...p.slice(1)].join("-"));if(f!==fmtC)out.add(f)});
  return shuf([...out]).slice(0,3)}
function makeQ(pool,used,i){
  const e=pickEvent(pool,used);used.add(e.id);
  if(i%4===3){const others=shuf(pool.filter(x=>x.id!==e.id&&Math.abs(hdYear(x.d)-hdYear(e.d))<=8&&hdKey(x.d)!==hdKey(e.d)));
    const set=[e];for(const o of others){if(set.length<3&&set.every(s=>hdKey(s.d)!==hdKey(o.d)))set.push(o)}
    if(set.length===3)return {type:"order",items:shuf(set),answer:set.slice().sort((a,b)=>hdKey(a.d)-hdKey(b.d)).map(x=>x.id),ev:e}}
  if(Math.random()<.6){const opts=shuf([hdFmt(e.d),...nearDates(e,pool)]);return {type:"when",ev:e,q:e.e,opts,answer:hdFmt(e.d)}}
  const dis=shuf(pool.filter(x=>x.id!==e.id&&hdFmt(x.d)!==hdFmt(e.d))).sort((a,b)=>Math.abs(hdYear(a.d)-hdYear(e.d))-Math.abs(hdYear(b.d)-hdYear(e.d))).slice(0,3);
  return {type:"what",ev:e,q:hdFmt(e.d),opts:shuf([e.e,...dis.map(x=>x.e)]),answer:e.e}}

  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}

  const cols=["#F0A85A","#3BC495","#7A4FD6","#3A6FD8","#FF7A2F","#F6C343"];const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  const t0=performance.now();(function f(t){const k=(t-t0)/1000;x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-k/1.6);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(k<1.6)requestAnimationFrame(f);else c.remove()})(t0)}
